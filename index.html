<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farewell 2026 — Our Memories Together</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    background:
        linear-gradient(rgba(35,20,12,.45),rgba(20,10,6,.7)),
        repeating-linear-gradient(
            90deg,
            #4b2c19 0px,
            #56321d 80px,
            #432514 160px,
            #5a351f 240px
        );

    font-family: Georgia, "Times New Roman", serif;
    color: #4a3322;
    overflow: hidden;
}

/* subtle wooden texture */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .15;

    background:
        repeating-linear-gradient(
            5deg,
            transparent 0px,
            transparent 8px,
            rgba(255,255,255,.08) 9px,
            transparent 11px
        );
}

/* =========================================
   MAIN
========================================= */

.scene {
    width: 100vw;
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 30px;

    perspective: 2500px;
}

.book-wrapper {
    width: min(1150px, 92vw);
    height: min(720px, 78vh);

    position: relative;
}

/* =========================================
   BOOK SHADOW
========================================= */

.book-shadow {
    position: absolute;

    left: 5%;
    right: 5%;
    bottom: -5%;

    height: 12%;

    background: #000;
    opacity: .55;

    filter: blur(28px);

    border-radius: 50%;
}

/* =========================================
   CLOSED COVER
========================================= */

.cover {
    position: absolute;

    width: 55%;
    height: 88%;

    left: 22.5%;
    top: 5%;

    z-index: 100;

    border-radius: 8px 15px 15px 8px;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.45),
            transparent 10%
        ),
        linear-gradient(
            135deg,
            #71332b,
            #491b18 55%,
            #2a0e0d
        );

    border: 2px solid #b78a48;

    box-shadow:
        15px 25px 45px rgba(0,0,0,.65),
        inset 8px 0 15px rgba(0,0,0,.35);

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    color: #edcf91;

    transform-origin: left center;

    transition:
        transform 1.5s cubic-bezier(.7,0,.2,1),
        opacity 1s;
}

.cover::after {
    content: "";

    position: absolute;

    inset: 15px;

    border: 1px solid #b98b4b;

    border-radius: 5px;
}

.cover.open {
    transform: rotateY(-110deg);
    opacity: 0;
    pointer-events: none;
}

.cover-content {
    position: relative;
    z-index: 2;
}

.cover-small {
    font-size: 16px;
    letter-spacing: 7px;
}

.cover h1 {
    font-size: clamp(55px, 7vw, 90px);
    margin: 15px 0;
}

.cover-title {
    font-size: clamp(22px, 3vw, 34px);
    font-style: italic;
}

.cover-decoration {
    font-size: 32px;
    margin-top: 28px;
}

.open-button {
    position: absolute;

    bottom: -70px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 200;

    border: none;

    padding: 15px 30px;

    border-radius: 30px;

    background: #f4e5c7;

    color: #493221;

    font-family: Georgia, serif;

    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 7px 20px rgba(0,0,0,.6);
}

/* =========================================
   OPEN BOOK
========================================= */

.book {
    position: absolute;

    inset: 0;

    opacity: 0;
    visibility: hidden;

    transition: opacity .8s;

    transform-style: preserve-3d;
}

.book.visible {
    opacity: 1;
    visibility: visible;
}

/* =========================================
   TWO PAGE SPREAD
========================================= */

.spread {
    position: absolute;

    left: 0;
    right: 0;

    top: 0;
    bottom: 5%;

    display: grid;

    grid-template-columns: 1fr 1fr;

    border-radius: 12px;

    overflow: hidden;

    box-shadow:
        0 25px 45px rgba(0,0,0,.65);
}

/* =========================================
   PAPER
========================================= */

.page {
    position: relative;

    overflow: hidden;

    padding: clamp(35px, 5vw, 65px);

    background:
        radial-gradient(
            circle at 25% 20%,
            rgba(120,80,40,.08),
            transparent 30%
        ),

        radial-gradient(
            circle at 80% 80%,
            rgba(120,80,40,.06),
            transparent 35%
        ),

        linear-gradient(
            90deg,
            rgba(100,65,30,.12),
            transparent 9%,
            transparent 91%,
            rgba(100,65,30,.08)
        ),

        #f2e4c8;
}

.left-page {
    border-radius: 12px 0 0 12px;

    box-shadow:
        inset -25px 0 35px rgba(80,45,20,.12);
}

.right-page {
    border-radius: 0 12px 12px 0;

    box-shadow:
        inset 25px 0 35px rgba(80,45,20,.12);
}

/* =========================================
   REALISTIC CENTER GUTTER
========================================= */

.gutter {
    position: absolute;

    left: 50%;
    top: 0;
    bottom: 5%;

    width: 40px;

    transform: translateX(-50%);

    z-index: 20;

    pointer-events: none;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(62,35,18,.18),
            rgba(255,255,255,.45),
            rgba(62,35,18,.20),
            transparent
        );
}

/* =========================================
   BOTANICAL DECOR
========================================= */

.flower-left,
.flower-right {
    position: absolute;

    font-size: 42px;

    opacity: .45;

    color: #72573b;
}

.flower-left {
    left: 25px;
    bottom: 25px;
}

.flower-right {
    right: 25px;
    bottom: 25px;
}

/* =========================================
   LEFT PAGE
========================================= */

.left-content {
    width: 100%;
    height: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;
}

/* =========================================
   POLAROID
========================================= */

.polaroid {
    width: min(68%, 390px);

    aspect-ratio: 4 / 5;

    background: #fffdf8;

    padding: 12px 12px 35px;

    box-shadow:
        0 12px 25px rgba(50,30,15,.25);

    transform: rotate(-1.5deg);

    position: relative;

    margin-bottom: 25px;
}

.polaroid img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;
}

.photo-placeholder {
    width: 100%;
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    text-align: center;

    background:
        linear-gradient(
            135deg,
            #d9c6a7,
            #b79b74
        );

    color: #72583d;

    font-size: 16px;
}

/* tape */

.tape {
    position: absolute;

    width: 105px;
    height: 25px;

    top: -13px;
    left: 50%;

    transform: translateX(-50%) rotate(-2deg);

    background: rgba(210,190,145,.72);

    box-shadow: 0 2px 5px rgba(0,0,0,.08);
}

/* =========================================
   NAME
========================================= */

.person-name {
    font-size: clamp(34px, 4vw, 54px);

    font-weight: normal;

    margin: 5px 0 12px;
}

.name-decoration {
    font-size: 22px;

    margin-bottom: 13px;
}

.tags {
    font-size: 12px;

    letter-spacing: 4px;

    color: #80684e;
}

/* =========================================
   RIGHT PAGE
========================================= */

.right-content {
    width: 100%;
    height: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding: 5%;
}

.quote-decoration {
    font-size: 25px;

    margin-bottom: 25px;
}

.message {
    max-width: 600px;

    font-size: clamp(17px, 2vw, 25px);

    line-height: 1.8;

    color: #503a29;
}

/* =========================================
   VIDEO PLAYER
========================================= */

.video-box {
    width: min(78%, 400px);

    margin-top: 30px;

    border: 1px solid #b99b72;

    border-radius: 8px;

    overflow: hidden;

    background: #e5d1ad;

    box-shadow:
        0 8px 18px rgba(70,40,20,.12);
}

.video-placeholder {
    height: 150px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    color: #654b34;
}

.play-circle {
    width: 50px;
    height: 50px;

    border-radius: 50%;

    background: #765638;

    color: white;

    display: flex;

    justify-content: center;
    align-items: center;

    font-size: 20px;

    margin-bottom: 10px;
}

.watch-text {
    font-size: 16px;
}

/* actual video */

.video-box video {
    width: 100%;
    display: block;
}

/* =========================================
   PAGE NUMBERS
========================================= */

.page-number {
    position: absolute;

    bottom: 18px;

    left: 50%;

    transform: translateX(-50%);

    font-size: 12px;

    letter-spacing: 3px;

    color: #80684e;
}

/* =========================================
   CONTROLS OUTSIDE BOOK
========================================= */

.navigation {
    position: absolute;

    left: -20px;
    right: -20px;

    bottom: -85px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    z-index: 100;
}

.nav-button {
    min-width: 135px;

    padding: 13px 24px;

    border-radius: 30px;

    border: 1px solid #b89563;

    background: rgba(47,26,16,.95);

    color: #f0d39a;

    font-family: Georgia, serif;

    font-size: 15px;

    cursor: pointer;
}

.book-title {
    text-align: center;

    color: #efd29a;
}

.book-title strong {
    display: block;

    letter-spacing: 5px;

    font-size: 13px;
}

.book-title span {
    display: block;

    margin-top: 5px;

    font-style: italic;

    font-size: 20px;
}

/* =========================================
   PAGE TURN
========================================= */

.turning-page {
    position: absolute;

    left: 50%;
    top: 0;

    width: 50%;
    height: 100%;

    z-index: 50;

    transform-origin: left center;

    transform-style: preserve-3d;

    display: none;

    transition:
        transform 1.2s cubic-bezier(.65,.05,.25,1);
}

.turning-page.active {
    display: block;

    transform: rotateY(-180deg);
}

.turn-front,
.turn-back {
    position: absolute;

    inset: 0;

    backface-visibility: hidden;

    background: #f2e4c8;

    box-shadow:
        inset 0 0 35px rgba(80,45,20,.15);

    padding: 50px;
}

.turn-back {
    transform: rotateY(180deg);
}

/* =========================================
   MOBILE
========================================= */

@media(max-width:700px) {

    body {
        overflow: hidden;
    }

    .scene {
        padding: 10px;
    }

    .book-wrapper {
        width: 96vw;
        height: 68vh;
    }

    .cover {
        width: 82%;
        left: 9%;
    }

    .cover-small {
        font-size: 11px;
        letter-spacing: 4px;
    }

    .cover h1 {
        font-size: 50px;
    }

    .cover-title {
        font-size: 20px;
    }

    .spread {
        bottom: 5%;
    }

    .page {
        padding: 15px;
    }

    .polaroid {
        width: 82%;

        padding: 7px 7px 25px;

        margin-bottom: 14px;
    }

    .tape {
        width: 65px;
        height: 17px;
        top: -9px;
    }

    .person-name {
        font-size: 25px;
    }

    .name-decoration {
        font-size: 16px;
        margin-bottom: 6px;
    }

    .tags {
        font-size: 7px;
        letter-spacing: 1.5px;
    }

    .message {
        font-size: 12px;
        line-height: 1.55;
    }

    .quote-decoration {
        font-size: 17px;
        margin-bottom: 10px;
    }

    .video-box {
        width: 90%;
        margin-top: 15px;
    }

    .video-placeholder {
        height: 95px;
    }

    .play-circle {
        width: 35px;
        height: 35px;
        font-size: 14px;
    }

    .watch-text {
        font-size: 11px;
    }

    .navigation {
        left: 0;
        right: 0;
        bottom: -65px;
    }

    .nav-button {
        min-width: 85px;
        padding: 8px 10px;
        font-size: 11px;
    }

    .book-title strong {
        font-size: 8px;
        letter-spacing: 2px;
    }

    .book-title span {
        font-size: 12px;
    }

    .flower-left,
    .flower-right {
        font-size: 25px;
    }
}
</style>
</head>


<body>

<div class="scene">

<div class="book-wrapper">

<div class="book-shadow"></div>


<!-- ======================================
     CLOSED COVER
======================================= -->

<div class="cover" id="cover">

<div class="cover-content">

<div class="cover-small">
FAREWELL
</div>

<h1>2026</h1>

<div class="cover-title">
Our Memories Together
</div>

<div class="cover-decoration">
❦ ♥ ❦
</div>

</div>


<button
class="open-button"
onclick="openBook()">

📖 OPEN BOOK

</button>

</div>


<!-- ======================================
     OPEN BOOK
======================================= -->

<div class="book" id="book">

<div class="spread">


<!-- LEFT PAGE -->

<div class="page left-page">

<div class="left-content"
id="leftContent">
</div>

<div class="flower-left">
❧
</div>

<div class="page-number"
id="leftNumber">
1 / 15
</div>

</div>


<!-- RIGHT PAGE -->

<div class="page right-page">

<div class="right-content"
id="rightContent">
</div>

<div class="flower-right">
❧
</div>

<div class="page-number"
id="rightNumber">
1 / 15
</div>

</div>


<!-- CENTER GUTTER -->

<div class="gutter"></div>


<!-- PHYSICAL PAGE TURN -->

<div class="turning-page"
id="turningPage">

<div class="turn-front"
id="turnFront">
</div>

<div class="turn-back"
id="turnBack">
</div>

</div>

</div>


<!-- ======================================
     NAVIGATION BELOW BOOK
======================================= -->

<div class="navigation">

<button
class="nav-button"
onclick="previousPerson()">

← Previous

</button>


<div class="book-title">

<strong>
FAREWELL 2026
</strong>

<span>
Our Memories Together
</span>

</div>


<button
class="nav-button"
onclick="nextPerson()">

Next →

</button>

</div>

</div>

</div>

</div>


<script>

/* =====================================================
   15 PEOPLE

   One person = ONE COMPLETE TWO-PAGE SPREAD.

   Add photo URL inside photo:""

   Add video URL inside video:""
===================================================== */

const people = [

{
    name: "Sai",
    photo: "",
    tags: "FRIEND • DREAMER • INSPIRATION",
    message: "Some people make our journey beautiful simply by being part of it. You have brought so much positivity, laughter and kindness into our lives. Thank you for being you. May your dreams always be big and your heart always be happy.",
    video: ""
},

{
    name: "Person 2",
    photo: "",
    tags: "FRIEND • LAUGHTER • MEMORIES",
    message: "The memories we created together will always have a special place in our hearts. Every conversation, every laugh and every little moment will be remembered.",
    video: ""
},

{
    name: "Person 3",
    photo: "",
    tags: "FRIEND • SMILES • MEMORIES",
    message: "Goodbyes are not the end. They are simply the beginning of another beautiful chapter. Wherever life takes you, may happiness always follow.",
    video: ""
},

{
    name: "Person 4",
    photo: "",
    tags: "FRIEND • JOY • ADVENTURE",
    message: "Thank you for all the laughter, memories and beautiful moments. Life was definitely more enjoyable because you were part of our journey.",
    video: ""
},

{
    name: "Person 5",
    photo: "",
    tags: "FRIEND • KINDNESS • MEMORIES",
    message: "Some friendships become memories that stay with us forever. Thank you for being a wonderful part of this chapter.",
    video: ""
},

{
    name: "Person 6",
    photo: "",
    tags: "LAUGHTER • FRIENDSHIP • FUN",
    message: "From the funniest moments to the unforgettable memories, there will always be a special place in our hearts for the time we shared.",
    video: ""
},

{
    name: "Person 7",
    photo: "",
    tags: "FRIEND • SUPPORT • SMILES",
    message: "Thank you for every smile, every conversation and every moment that made this journey special.",
    video: ""
},

{
    name: "Person 8",
    photo: "",
    tags: "MEMORIES • FRIENDSHIP • JOY",
    message: "Years may pass and places may change, but beautiful memories have a way of staying with us forever.",
    video: ""
},

{
    name: "Person 9",
    photo: "",
    tags: "FRIEND • LAUGHTER • ADVENTURE",
    message: "Here is to all the adventures we shared and all the wonderful moments still waiting for us in the future.",
    video: ""
},

{
    name: "Person 10",
    photo: "",
    tags: "FRIEND • DREAMER • SMILES",
    message: "May your next chapter be filled with exciting opportunities, wonderful people and countless reasons to smile.",
    video: ""
},

{
    name: "Person 11",
    photo: "",
    tags: "FRIENDSHIP • MEMORIES • HEART",
    message: "Thank you for being part of our story. The memories we made together will always remain a beautiful part of our lives.",
    video: ""
},

{
    name: "Person 12",
    photo: "",
    tags: "LAUGHTER • FRIENDSHIP • MOMENTS",
    message: "Some moments become special simply because of the people who were there. Thank you for making those moments unforgettable.",
    video: ""
},

{
    name: "Person 13",
    photo: "",
    tags: "FRIEND • MEMORIES • DREAMS",
    message: "Wherever your journey takes you next, may it be filled with success, happiness and beautiful new memories.",
    video: ""
},

{
    name: "Person 14",
    photo: "",
    tags: "FRIENDSHIP • JOY • MEMORIES",
    message: "Farewells may be difficult, but they remind us just how meaningful the journey has been. Thank you for every wonderful memory.",
    video: ""
},

{
    name: "Person 15",
    photo: "",
    tags: "FOREVER • FRIENDSHIP • MEMORIES",
    message: "And finally, thank you for being part of this beautiful chapter. The journey continues, but these memories will always stay with us.",
    video: ""
}

];


/* =====================================================
   STATE
===================================================== */

let current = 0;


/* =====================================================
   ELEMENTS
===================================================== */

const cover =
document.getElementById("cover");

const book =
document.getElementById("book");

const leftContent =
document.getElementById("leftContent");

const rightContent =
document.getElementById("rightContent");

const leftNumber =
document.getElementById("leftNumber");

const rightNumber =
document.getElementById("rightNumber");

const turningPage =
document.getElementById("turningPage");

const turnFront =
document.getElementById("turnFront");

const turnBack =
document.getElementById("turnBack");


/* =====================================================
   PHOTO
===================================================== */

function getPhoto(person) {

    if (person.photo) {

        return `
        <div class="polaroid">

            <div class="tape"></div>

            <img
            src="${person.photo}"
            alt="${person.name}">

        </div>
        `;

    }

    return `
    <div class="polaroid">

        <div class="tape"></div>

        <div class="photo-placeholder">
            📷
            <br><br>
            Photo will be added here
        </div>

    </div>
    `;
}


/* =====================================================
   VIDEO
===================================================== */

function getVideo(person) {

    if (person.video) {

        return `
        <div class="video-box">

            <video
            controls
            playsinline
            src="${person.video}">
            </video>

        </div>
        `;

    }

    return `
    <div class="video-box">

        <div class="video-placeholder">

            <div class="play-circle">
                ▶
            </div>

            <div class="watch-text">
                Watch Video
            </div>

            <small>
                Video coming soon
            </small>

        </div>

    </div>
    `;
}


/* =====================================================
   RENDER ONE COMPLETE SPREAD
===================================================== */

function renderPerson() {

    const person =
    people[current];


    /*
       LEFT PAGE
       PHOTO + NAME + TAGS
    */

    leftContent.innerHTML = `

        ${getPhoto(person)}

        <div class="person-name">
            ${person.name}
        </div>

        <div class="name-decoration">
            ── ♥ ──
        </div>

        <div class="tags">
            ${person.tags}
        </div>

    `;


    /*
       RIGHT PAGE
       MESSAGE + VIDEO
    */

    rightContent.innerHTML = `

        <div class="quote-decoration">
            ─── ♥ ───
        </div>

        <div class="message">
            ${person.message}
        </div>

        ${getVideo(person)}

    `;


    /*
       Both pages belong to SAME person.
    */

    leftNumber.innerHTML =
    `${current + 1} / 15`;

    rightNumber.innerHTML =
    `${current + 1} / 15`;
}


/* =====================================================
   OPEN BOOK
===================================================== */

function openBook() {

    cover.classList.add("open");

    setTimeout(function() {

        book.classList.add("visible");

    }, 500);

    current = 0;

    renderPerson();
}


/* =====================================================
   NEXT PERSON
===================================================== */

function nextPerson() {

    if (current >= people.length - 1) {
        return;
    }


    /*
       Capture current spread
       before turning.
    */

    turnFront.innerHTML =
    `
    <div style="
        height:100%;
        display:flex;
        align-items:center;
        justify-content:center;
        text-align:center;
        font-size:28px;
    ">
        ${people[current].name}
    </div>
    `;


    turnBack.innerHTML =
    `
    <div style="
        height:100%;
        background:#f2e4c8;
    ">
    </div>
    `;


    current++;


    /*
       Start realistic page turn
    */

    turningPage.classList.remove("active");

    void turningPage.offsetWidth;

    turningPage.classList.add("active");


    /*
       Change spread after page has turned.
    */

    setTimeout(function() {

        renderPerson();

        turningPage.classList.remove("active");

    }, 1200);
}


/* =====================================================
   PREVIOUS PERSON
===================================================== */

function previousPerson() {

    if (current <= 0) {
        return;
    }

    current--;

    renderPerson();
}


/* =====================================================
   INITIAL
===================================================== */

renderPerson();

</script>

</body>
</html>
