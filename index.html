<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sai Memory Book</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family: Georgia, "Times New Roman", serif;
    background:
        radial-gradient(circle at center,
            #f5f0e8 0%,
            #ddd2c1 55%,
            #c1b19b 100%);
    color: #3d2c24;
    overflow-x: hidden;
}

/* =====================================================
   MAIN STAGE
===================================================== */

.stage {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 35px;
    perspective: 2200px;
}

/* =====================================================
   CLOSED BOOK
===================================================== */

.closed-book {
    width: min(510px, 88vw);
    aspect-ratio: 0.70;
    position: relative;
    transform:
        rotateY(-8deg)
        rotateX(2deg);
    filter:
        drop-shadow(30px 35px 25px rgba(0,0,0,.30));
    animation: bookAppear .8s ease;
}

@keyframes bookAppear {
    from {
        opacity: 0;
        transform:
            rotateY(-15deg)
            rotateX(5deg)
            translateY(20px);
    }
    to {
        opacity: 1;
        transform:
            rotateY(-8deg)
            rotateX(2deg);
    }
}

.leather {
    position: absolute;
    inset: 0;

    border-radius: 8px 15px 15px 8px;

    background:
        linear-gradient(
            135deg,
            #291311 0%,
            #512922 25%,
            #67352b 45%,
            #3b1c18 70%,
            #1d0b09 100%
        );

    box-shadow:
        inset 4px 0 0 rgba(255,255,255,.06),
        inset -6px 0 0 rgba(0,0,0,.35),
        8px 8px 0 #24100e,
        13px 13px 0 #170907;
}

.leather::before {
    content: "";
    position: absolute;
    inset: 22px;

    border: 1px solid rgba(222,180,117,.55);
    border-radius: 5px;
}

.leather::after {
    content: "";
    position: absolute;
    inset: 0;

    background:
        repeating-linear-gradient(
            105deg,
            rgba(255,255,255,.018) 0,
            rgba(255,255,255,.018) 1px,
            transparent 1px,
            transparent 5px
        );

    pointer-events: none;
}

.cover-content {
    position: absolute;
    z-index: 3;

    inset: 65px 40px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;

    color: #e8cb98;
}

.cover-small {
    font-size: 11px;
    letter-spacing: 5px;
    opacity: .8;
    margin-bottom: 27px;
}

.cover-title {
    font-size: clamp(30px, 7vw, 46px);
    line-height: 1.15;
    letter-spacing: 4px;
    font-weight: 500;
}

.cover-subtitle {
    margin-top: 17px;
    font-size: 16px;
    font-style: italic;
    letter-spacing: 1px;
}

.cover-heart {
    font-size: 35px;
    margin-top: 30px;
}

.open-button {
    margin-top: 48px;

    padding: 14px 24px;

    border: 1px solid rgba(232,203,152,.7);
    background: rgba(0,0,0,.08);

    color: #e8cb98;

    font-family: Georgia, serif;
    font-size: 13px;
    letter-spacing: 2px;

    cursor: pointer;

    transition:
        background .3s,
        transform .3s;
}

.open-button:hover {
    background: rgba(232,203,152,.13);
    transform: translateY(-2px);
}


/* =====================================================
   BOOK
===================================================== */

.book {
    width: min(1120px, 95vw);
    height: min(650px, 70vh);

    min-height: 530px;

    position: relative;

    transform-style: preserve-3d;

    filter:
        drop-shadow(0 30px 30px rgba(0,0,0,.23));
}

.spread {
    position: absolute;
    inset: 0;

    display: grid;
    grid-template-columns: 1fr 1fr;

    transform-style: preserve-3d;
}

.page {
    position: relative;

    background:
        radial-gradient(
            ellipse at center,
            #fffdf9 0%,
            #f3ecdf 100%
        );

    overflow: hidden;

    box-shadow:
        inset 0 0 35px rgba(100,70,40,.07);
}

.page::after {
    content: "";
    position: absolute;
    inset: 0;

    pointer-events: none;

    background:
        repeating-linear-gradient(
            0deg,
            transparent 0,
            transparent 5px,
            rgba(70,45,25,.012) 6px
        );
}

.left-page {
    border-radius: 9px 0 0 9px;
}

.right-page {
    border-radius: 0 9px 9px 0;
}

.book-center {
    position: absolute;
    z-index: 20;

    top: 0;
    bottom: 0;
    left: 50%;

    width: 2px;

    background:
        linear-gradient(
            to right,
            rgba(0,0,0,.10),
            rgba(255,255,255,.7),
            rgba(0,0,0,.05)
        );

    transform: translateX(-50%);
}


/* =====================================================
   INTRODUCTION
===================================================== */

.intro-left {
    display: flex;
    justify-content: center;
    align-items: center;
}

.quiet-heart {
    font-size: 28px;
    color: #b99b70;
    opacity: .32;
}

.intro-right {
    padding: 70px;
    display: flex;
    align-items: center;
}

.intro-content {
    width: 100%;
}

.eyebrow {
    font-size: 10px;
    letter-spacing: 4px;
    color: #a0845e;
}

.intro-content h1 {
    margin: 17px 0;

    font-size: clamp(38px, 5vw, 58px);
    font-weight: 400;

    letter-spacing: 2px;
}

.gold-line {
    width: 65px;
    height: 1px;
    background: #b99a6d;

    margin: 22px 0 30px;
}

.intro-main {
    font-size: 25px;
    line-height: 1.5;
    margin: 0;
}

.intro-highlight {
    margin: 4px 0 24px;

    font-size: 29px;
    font-style: italic;

    color: #8e6b46;
}

.intro-description {
    max-width: 430px;

    font-size: 16px;
    line-height: 1.9;

    color: #76675d;
}

.intro-heart {
    margin-top: 28px;

    font-size: 28px;
    color: #a48761;
}


/* =====================================================
   PERSON LEFT
===================================================== */

.person-left {
    padding: 48px;
}

.photo-frame {
    width: 100%;
    height: 65%;

    padding: 9px;

    border: 1px solid #cbb28d;

    background: #eee4d5;

    box-shadow:
        0 12px 25px rgba(0,0,0,.14);
}

.photo-frame img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;
}

.person-info {
    position: relative;
    padding-top: 18px;
}

.person-number {
    position: absolute;
    right: 0;
    top: 18px;

    font-size: 11px;
    letter-spacing: 2px;

    color: #aa906e;
}

.person-name {
    margin: 0;

    font-size: 35px;
    font-weight: 400;

    color: #382820;
}

.heart-line {
    margin: 7px 0 14px;

    font-size: 15px;
    font-style: italic;

    color: #826749;
}

.tags {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
}

.tag {
    border: 1px solid #d2bea0;

    padding: 5px 10px;

    border-radius: 20px;

    font-size: 9px;
    letter-spacing: 1px;

    color: #887054;
}


/* =====================================================
   PERSON RIGHT
===================================================== */

.person-right {
    padding: 65px;
    display: flex;
    align-items: center;
}

.tribute {
    width: 100%;
}

.tribute-label {
    font-size: 10px;
    letter-spacing: 3px;

    color: #a48761;

    margin-bottom: 25px;
}

.tribute-message {
    font-size: 19px;
    line-height: 1.9;

    color: #4d3a31;

    white-space: pre-line;
}

.divider {
    display: flex;
    align-items: center;

    gap: 12px;

    margin: 34px 0;
}

.divider-line {
    width: 55px;
    height: 1px;

    background: #d1bd9e;
}

.divider-heart {
    color: #ad8c61;
}


/* =====================================================
   VIDEO CARD
===================================================== */

.video-card {
    width: 100%;

    display: flex;
    align-items: center;

    gap: 15px;

    padding: 18px 20px;

    border: 1px solid #d2bea2;

    background: rgba(255,255,255,.38);

    text-decoration: none;

    color: #46352d;

    transition:
        transform .25s,
        background .25s;
}

.video-card:hover {
    transform: translateY(-3px);

    background: rgba(255,255,255,.7);
}

.video-icon {
    width: 43px;
    height: 43px;

    border-radius: 50%;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #8c6a48;

    color: white;

    font-size: 12px;
}

.video-text small {
    display: block;

    font-size: 8px;
    letter-spacing: 2px;

    color: #a08460;
}

.video-text strong {
    display: block;

    margin-top: 4px;

    font-size: 16px;
    font-weight: 400;
}

.video-arrow {
    margin-left: auto;

    font-size: 20px;

    color: #987653;
}


/* =====================================================
   NAVIGATION
===================================================== */

.navigation {
    position: absolute;

    left: 0;
    right: 0;

    bottom: -65px;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 30px;

    z-index: 100;
}

.nav-button {
    border: 0;

    background: transparent;

    font-family: Georgia, serif;

    color: #5d4837;

    font-size: 13px;

    letter-spacing: 1px;

    cursor: pointer;

    padding: 10px 15px;
}

.nav-button:hover {
    color: #a0784b;
}

.nav-button:disabled {
    opacity: .25;
    cursor: default;
}

.page-count {
    font-size: 10px;

    letter-spacing: 2px;

    color: #9e886d;
}


/* =====================================================
   INTRO NEXT
===================================================== */

.intro-next {
    position: absolute;

    right: 30px;
    bottom: 25px;

    z-index: 50;
}


/* =====================================================
   OPEN COVER
===================================================== */

.open-animation {
    position: relative;

    width: min(1120px, 95vw);
    height: min(650px, 70vh);
    min-height: 530px;

    transform-style: preserve-3d;
}

.open-animation .cover {
    position: absolute;
    z-index: 50;

    inset: 0;

    transform-origin: left center;

    animation:
        openCover 1.1s cubic-bezier(.65,0,.35,1)
        forwards;

    backface-visibility: hidden;
}

@keyframes openCover {

    0% {
        transform: rotateY(0deg);
    }

    100% {
        transform: rotateY(-180deg);
    }
}


/* =====================================================
   CLOSE ANIMATION
===================================================== */

.close-animation {
    position: relative;

    width: min(1120px, 95vw);
    height: min(650px, 70vh);
    min-height: 530px;

    transform-style: preserve-3d;
}

.close-animation .closing-cover {
    position: absolute;

    inset: 0;

    z-index: 100;

    transform-origin: right center;

    animation:
        closeCover 1.2s cubic-bezier(.65,0,.35,1)
        forwards;

    backface-visibility: hidden;
}

@keyframes closeCover {

    0% {
        transform: rotateY(-180deg);
    }

    100% {
        transform: rotateY(0deg);
    }
}

.end-message {
    position: absolute;

    inset: 0;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;
}

.end-message .heart {
    font-size: 38px;
    color: #a58761;
}

.end-message h2 {
    margin-top: 20px;

    font-size: 27px;
    font-weight: 400;

    font-style: italic;

    color: #70563d;
}


/* =====================================================
   PAGE TURN EFFECT
===================================================== */

.turning .spread {
    animation:
        pageTurn .65s ease;
}

@keyframes pageTurn {

    0% {
        transform: rotateY(0);
    }

    45% {
        transform:
            rotateY(-7deg)
            translateX(-5px);
    }

    100% {
        transform: rotateY(0);
    }
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 850px) {

    .stage {
        padding: 20px;
    }

    .book,
    .open-animation,
    .close-animation {
        width: 95vw;
        height: 70vh;
        min-height: 480px;
    }

    .person-left,
    .person-right,
    .intro-right {
        padding: 30px;
    }

    .tribute-message {
        font-size: 16px;
        line-height: 1.7;
    }

    .person-name {
        font-size: 28px;
    }
}

@media (max-width: 600px) {

    .stage {
        align-items: flex-start;
        padding-top: 35px;
    }

    .book {
        height: auto;
        min-height: 0;
    }

    .spread {
        position: relative;
        display: block;
    }

    .left-page,
    .right-page {
        min-height: 480px;
        border-radius: 0;
    }

    .intro-left {
        display: none;
    }

    .intro-right {
        min-height: 600px;
        border-radius: 9px;
    }

    .photo-frame {
        height: 300px;
    }

    .person-left {
        min-height: 560px;
        border-radius: 9px 9px 0 0;
    }

    .person-right {
        min-height: 500px;
        border-radius: 0 0 9px 9px;
    }

    .navigation {
        position: relative;
        bottom: auto;
        margin-top: 25px;
    }

    .intro-next {
        bottom: 20px;
        right: 20px;
    }

    .book-center {
        display: none;
    }
}
</style>
</head>

/* =====================================================

let state = "closed";

let currentPage = 0;


/* =====================================================

===================================================== */

const app = document.getElementById("app");


/* =====================================================
   COVER HTML
===================================================== */

function coverHTML() {

    return `
        <div class="leather">

            <div class="cover-content">

                <div class="cover-small">

                </div>

}


/* =====================================================

    app.innerHTML = `

}


/* =====================================================
   OPENING
===================================================== */

function openBook() {

    state = "opening";

    app.innerHTML = `
        <main class="stage">

            <div class="open-animation">

                <div class="book">

                    <div class="spread">

            </div>

        </main>

    setTimeout(() => {

        currentPage = 0;

        renderIntro();

    }, 1150);
}

/* =====================================================

                            </div>

                        </div>

                    </div>


                    <!-- RIGHT -->

                    <div class="page right-page person-right">

                        <div class="tribute">

                            <div class="tribute-label">
                                A LITTLE SOMETHING FOR YOU
                            </div>

                            <div class="tribute-message">
                                ${person.message}
                            </div>

                            <div class="divider">

                                <span class="divider-line"></span>

                                <span class="divider-heart">
                                    ♡
                                </span>

                                <span class="divider-line"></span>

                            </div>

                            <a
                                class="video-card"
                                href="${person.video}"
                                target="_blank"
                                rel="noopener noreferrer"
                            >

                                <div class="video-icon">
                                    ▶
                                </div>

                                <div class="video-text">

                                    <small>
                                        MEMORY
                                    </small>

                                    <strong>
                                        Watch Video
                                    </strong>

                                </div>

                                <div class="video-arrow">
                                    →
                                </div>

                            </a>

                        </div>

                    </div>

                </div>

                <div class="book-center"></div>


                <!-- NAVIGATION -->

                <div class="navigation">

                    <button
                        class="nav-button"
                        onclick="previousPerson()"
                        ${index === 0 ? "disabled" : ""}
                    >
                        ← Previous
                    </button>

                    <div class="page-count">
                        ${index + 1} / ${people.length}
                    </div>

                    <button
                        class="nav-button"
                        onclick="nextPerson()"
                    >
                        ${
                            index === people.length - 1
                            ? "Close Book"
                            : "Next →"
                        }
                    </button>

                </div>

            </div>

        </main>
    `;
}


/* =====================================================
   NEXT
===================================================== */

function nextPerson() {

    if (currentPage < people.length - 1) {

        showPerson(currentPage + 1);

    } else {

        closeBook();

    }
}


/* =====================================================
   PREVIOUS
===================================================== */

function previousPerson() {

    if (currentPage > 0) {

        showPerson(currentPage - 1);

    }
}


/* =====================================================
   CLOSE BOOK
===================================================== */

function closeBook() {

    state = "closing";

    app.innerHTML = `

        <main class="stage">

            <div class="close-animation">

                <div class="book">

                    <div class="spread">

                        <div class="page left-page">

                            <div class="end-message">

                                <div class="heart">
                                    ♡
                                </div>

                            </div>

                        </div>

                        <div class="page right-page">

                            <div class="end-message">

                                <div class="heart">
                                    ♡
                                </div>

                                <h2>
                                    Until the next chapter...
                                </h2>

                            </div>

                        </div>

                    </div>

                    <div class="book-center"></div>

                </div>


                <!-- SAME FRONT COVER -->

                <div class="closing-cover">

                    ${coverHTML()}

                </div>

            </div>

        </main>
    `;


    /*
       Wait for the physical closing animation
       and then return to the EXACT same
       closed-book state.
    */

    setTimeout(() => {

        renderClosed();

    }, 1250);
}


/* =====================================================
   START
===================================================== */

renderClosed();

</script>

</body>
</html>
