<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farewell 2026 ❤️</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    min-height: 100%;
}

body {
    background:
        radial-gradient(circle at 50% 20%, #fff8ed 0%, #ead8bd 45%, #c9ad88 100%);
    color: #3b2a20;
    font-family: Georgia, "Times New Roman", serif;
    overflow-x: hidden;
}

/* =====================================================
   COVER
===================================================== */

.cover-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
}

.book-cover {
    width: min(430px, 92vw);
    min-height: 620px;
    background:
        linear-gradient(135deg, #4a2d25, #6b4235 50%, #3a231e);
    color: #f9ead0;
    border-radius: 8px 18px 18px 8px;
    box-shadow:
        0 30px 70px rgba(55, 35, 20, .45),
        inset 12px 0 20px rgba(0,0,0,.2);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    overflow: hidden;
}

.book-cover::before {
    content: "";
    position: absolute;
    inset: 18px;
    border: 1px solid rgba(255,230,190,.5);
    border-radius: 4px 12px 12px 4px;
}

.cover-content {
    position: relative;
    z-index: 2;
    padding: 50px 30px;
}

.cover-small {
    font-size: 13px;
    letter-spacing: 5px;
    margin-bottom: 28px;
}

.cover-title {
    font-size: clamp(48px, 14vw, 78px);
    line-height: .9;
    font-weight: normal;
    letter-spacing: 3px;
}

.cover-subtitle {
    font-size: 23px;
    margin-top: 25px;
    font-style: italic;
}

.cover-heart {
    font-size: 35px;
    margin: 25px 0;
}

.open-book {
    margin-top: 30px;
    padding: 15px 28px;
    background: transparent;
    color: #f9ead0;
    border: 1px solid #e8cda4;
    font-family: inherit;
    letter-spacing: 2px;
    font-size: 14px;
    cursor: pointer;
    transition: .3s;
}

.open-book:hover {
    background: #f9ead0;
    color: #4a2d25;
}


/* =====================================================
   BOOK AREA
===================================================== */

.memory-area {
    display: none;
    min-height: 100vh;
    padding: 35px 15px 60px;
}

.book-stage {
    width: min(920px, 96vw);
    margin: auto;
    perspective: 2200px;
}


/* =====================================================
   OPEN BOOK
===================================================== */

.book {
    position: relative;
    width: 100%;
    min-height: 650px;
    background: #5b382c;
    border-radius: 8px;
    padding: 14px;
    box-shadow: 0 30px 80px rgba(50,30,15,.35);
}

.book-inner {
    position: relative;
    min-height: 620px;
    background: #f6ead8;
    border-radius: 4px;
    overflow: hidden;
    box-shadow: inset 0 0 35px rgba(100,60,30,.18);
}


/* center spine */

.book-inner::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 2px;
    background: rgba(100,70,40,.15);
    box-shadow: 0 0 12px rgba(60,40,20,.15);
}


/* =====================================================
   PAGE
===================================================== */

.page {
    position: absolute;
    inset: 0;
    padding: 45px 55px;
    background:
        repeating-linear-gradient(
            0deg,
            rgba(100,70,40,.025),
            rgba(100,70,40,.025) 1px,
            transparent 1px,
            transparent 4px
        ),
        #fffaf0;
    transform-origin: left center;
    backface-visibility: hidden;
    transition:
        transform 1s cubic-bezier(.65,.05,.25,1),
        box-shadow 1s;
    box-shadow: 0 0 15px rgba(60,40,20,.12);
    z-index: 10;
}

.page.turning {
    transform: rotateY(-180deg);
    box-shadow: -15px 0 25px rgba(50,30,10,.2);
}

.page-content {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
}


/* =====================================================
   PERSON PAGE
===================================================== */

.memory-number {
    font-size: 12px;
    letter-spacing: 4px;
    opacity: .55;
    margin-bottom: 10px;
}

.person-name {
    font-size: clamp(32px, 7vw, 52px);
    font-weight: normal;
    margin: 0 0 20px;
}

.decorative-line {
    width: 100px;
    height: 1px;
    background: #9b7657;
    margin-bottom: 25px;
}

.photo-area {
    width: min(580px, 100%);
    height: 300px;
    background: #e9dac6;
    border: 10px solid #fffdf8;
    box-shadow: 0 10px 25px rgba(60,40,20,.18);
    overflow: hidden;
}

.photo-area img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.photo-placeholder {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: #806b58;
}

.message {
    max-width: 650px;
    font-size: 18px;
    line-height: 1.7;
    font-style: italic;
    margin: 22px auto 18px;
}

.video-placeholder {
    width: min(580px, 100%);
    padding: 15px;
    background: #eadcc9;
    border: 1px dashed #9c8063;
    color: #725c49;
}

.video-placeholder .icon {
    font-size: 27px;
}

.video-placeholder strong {
    display: block;
    margin-top: 4px;
}


/* =====================================================
   FINAL PAGE
===================================================== */

.final-content {
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.final-heart {
    font-size: 70px;
    margin-bottom: 20px;
}

.final-content h2 {
    font-size: clamp(38px, 8vw, 65px);
    font-weight: normal;
    margin: 0;
}

.final-content p {
    font-size: 20px;
    line-height: 1.7;
    font-style: italic;
}


/* =====================================================
   CONTROLS
===================================================== */

.controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 25px;
    margin-top: 28px;
}

    background: #4a3026;
    color: white;
    padding: 13px 24px;
    font-family:
