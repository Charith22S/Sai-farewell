<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Farewell 2026 — Our Memories Together</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
}

body{
  min-height:100vh;

  background:
    radial-gradient(
      circle at 50% 15%,
      rgba(255,255,255,.045),
      transparent 35%
    ),
    linear-gradient(
      135deg,
      #17100c,
      #3b281d 45%,
      #160e0a
    );

  color:#403329;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  overflow-x:hidden;
}


/* =====================================================
   WOODEN DESK
===================================================== */

body::before{
  content:"";

  position:fixed;
  inset:0;

  pointer-events:none;

  opacity:.16;

  background:
    repeating-linear-gradient(
      7deg,
      transparent 0,
      transparent 10px,
      rgba(255,255,255,.025) 11px,
      transparent 13px
    );
}


/* =====================================================
   SCENE
===================================================== */

.scene{
  min-height:100vh;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  padding:28px 10px 24px;
}


/* =====================================================
   BOOK WRAPPER
===================================================== */

.book-wrap{
  width:min(1100px,97vw);
  position:relative;
}

.book-shadow{
  position:absolute;

  left:3%;
  right:3%;
  bottom:-30px;

  height:45px;

  border-radius:50%;

  background:rgba(0,0,0,.5);

  filter:blur(18px);
}


/* =====================================================
   LEATHER FRAME
===================================================== */

.book-frame{
  position:relative;

  padding:18px;

  border-radius:12px;

  background:
    linear-gradient(
      90deg,
      #120d0a 0%,
      #4b3021 4%,
      #21140e 9%,
      #130d09 50%,
      #21140e 91%,
      #4b3021 96%,
      #120d0a 100%
    );

  box-shadow:
    0 25px 50px rgba(0,0,0,.58),
    inset 0 0 0 2px rgba(255,255,255,.04),
    inset 0 0 0 5px rgba(0,0,0,.4);
}


/* =====================================================
   BOOK AREA
===================================================== */

.book{
  position:relative;

  width:100%;

  aspect-ratio:2 / 1.18;

  overflow:hidden;

  border-radius:5px;

  background:#eee1c5;

  box-shadow:
    inset 0 0 22px rgba(60,40,25,.18);
}


/* =====================================================
   INTERNAL TWO-PAGE SPREAD
===================================================== */

.spread{
  position:absolute;
  inset:0;

  display:grid;
  grid-template-columns:1fr 1fr;
}


/* =====================================================
   PAPER
===================================================== */

.page{
  position:relative;

  overflow:hidden;

  background:
    radial-gradient(
      ellipse at center,
      rgba(255,255,255,.55),
      transparent 68%
    ),
    linear-gradient(
      90deg,
      #eee0c3,
      #fff8e7 50%,
      #eddfc1
    );

  box-shadow:
    inset 0 0 35px rgba(75,50,30,.08);
}

.page.left{
  border-right:1px solid rgba(80,55,35,.08);
}

.page.right{
  border-left:1px solid rgba(80,55,35,.06);
}


/* =====================================================
   GUTTER
===================================================== */

.gutter{
  position:absolute;

  left:50%;
  top:0;
  bottom:0;

  width:34px;

  transform:translateX(-50%);

  z-index:15;

  pointer-events:none;

  background:
    linear-gradient(
      90deg,
      rgba(65,40,20,.02),
      rgba(60,38,22,.16),
      rgba(255,255,255,.12),
      rgba(60,38,22,.15),
      rgba(65,40,20,.02)
    );
}


/* =====================================================
   PAGE INNER
===================================================== */

.page-inner{
  position:absolute;
  inset:0;

  padding:
    6%
    8%
    6%;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  text-align:center;
}


/* =====================================================
   PAGE NUMBER
===================================================== */

.page-number{
  position:absolute;

  bottom:13px;

  font-family:Arial,sans-serif;

  font-size:9px;

  letter-spacing:2px;

  color:#9b8870;
}

.page.left .page-number{
  left:18px;
}

.page.right .page-number{
  right:18px;
}


/* =====================================================
   PERSON PHOTO
===================================================== */

.photo-area{
  width:72%;
  height:53%;

  display:flex;

  align-items:center;
  justify-content:center;
}

.polaroid{
  position:relative;

  width:min(290px,80%);
  height:100%;

  padding:9px 9px 24px;

  background:#fffdf7;

  box-shadow:
    0 12px 25px rgba(50,30,20,.2),
    0 2px 5px rgba(50,30,20,.12);

  transform:rotate(-1.3deg);
}

.polaroid::before{
  content:"";

  position:absolute;

  top:-10px;
  left:27%;

  width:46%;
  height:22px;

  background:rgba(220,205,168,.65);

  transform:rotate(-3deg);
}

.photo-placeholder{
  width:100%;
  height:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      135deg,
      #e6dcc8,
      #f7f0df
    );

  color:#9c8c78;

  font-family:Arial,sans-serif;

  font-size:10px;

  letter-spacing:2px;
}

.photo-placeholder img{
  width:100%;
  height:100%;

  object-fit:cover;

  display:block;
}


/* =====================================================
   NAME
===================================================== */

.person-name{
  margin-top:14px;

  font-size:
    clamp(21px,2.8vw,35px);

  font-weight:normal;

  color:#49382d;
}

.heart-line{
  width:60%;

  display:flex;
  align-items:center;

  gap:9px;

  margin:10px auto 7px;

  color:#aa9178;
}

.heart-line::before,
.heart-line::after{
  content:"";

  flex:1;

  height:1px;

  background:#c7b599;
}

.heart-line span{
  font-size:13px;
}

.tags{
  font-family:Arial,sans-serif;

  font-size:8px;

  letter-spacing:1.7px;

  color:#907b63;

  line-height:1.7;
}


/* =====================================================
   RIGHT PAGE — MESSAGE

   IMPORTANT:
   Controlled sizing prevents message from
   pushing the video card off the page.
===================================================== */

.right-content{
  width:100%;
  max-width:450px;

  display:flex;
  flex-direction:column;

  align-items:center;

  justify-content:center;

  min-height:0;
}

.message{
  width:100%;

  max-width:410px;

  font-size:
    clamp(14px,1.45vw,19px);

  line-height:1.48;

  color:#514238;

  font-style:italic;

  margin:0;

  max-height:42%;

  overflow:hidden;
}

.message::before{
  content:"“";

  display:block;

  font-size:34px;

  line-height:.7;

  color:#b8a287;

  margin-bottom:7px;
}

.message-divider{
  width:58px;

  height:1px;

  flex:none;

  background:#b8a287;

  margin:
    12px
    auto
    14px;
}


/* =====================================================
   VIDEO CARD

   NEVER collapses into a thin line.
===================================================== */

.video-card{
  flex:none;

  width:min(420px,90%);

  height:100px;

  min-height:100px;

  border:
    1px solid
    rgba(119,94,67,.28);

  border-radius:8px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.8),
      rgba(234,222,197,.9)
    );

  display:flex;

  align-items:center;
  justify-content:center;

  gap:14px;

  box-shadow:
    0 8px 20px rgba(65,45,28,.11),
    inset 0 1px 0 rgba(255,255,255,.8);

  cursor:pointer;

  position:relative;

  overflow:hidden;
}

.video-card::before{
  content:"";

  position:absolute;
  inset:0;

  background:
    linear-gradient(
      110deg,
      transparent 25%,
      rgba(255,255,255,.35) 50%,
      transparent 75%
    );

  pointer-events:none;
}

.play-button{
  flex:none;

  width:44px;
  height:44px;

  border-radius:50%;

  display:flex;

  align-items:center;
  justify-content:center;

  padding-left:3px;

  background:#5d4939;

  color:white;

  font-family:Arial,sans-serif;

  font-size:16px;

  box-shadow:
    0 5px 12px rgba(50,35,25,.22);
}

.video-text{
  text-align:left;

  min-width:0;
}

.video-title{
  font-size:15px;

  color:#4d3c30;

  white-space:nowrap;
}

.video-subtitle{
  margin-top:5px;

  font-family:Arial,sans-serif;

  font-size:8px;

  letter-spacing:1.4px;

  color:#9a866e;

  white-space:nowrap;
}


/* =====================================================
   BOTANICAL
===================================================== */

.botanical{
  position:absolute;

  width:105px;
  height:82px;

  opacity:.23;

  color:#766a56;

  pointer-events:none;
}

.botanical.bottom-left{
  bottom:8px;
  left:8px;
}

.botanical.bottom-right{
  bottom:8px;
  right:8px;

  transform:scaleX(-1);
}

.botanical svg{
  width:100%;
  height:100%;
}


/* =====================================================
   FRONT / BACK COVER
===================================================== */

.cover{
  position:absolute;

  inset:0;

  display:flex;

  align-items:center;
  justify-content:center;

  text-align:center;

  background:
    radial-gradient(
      ellipse at center,
      rgba(125,80,45,.32),
      transparent 60%
    ),
    linear-gradient(
      135deg,
      #24140e,
      #4a2c1d 45%,
      #21120c
    );

  color:#e8d4ae;

  overflow:hidden;
}

.cover::before{
  content:"";

  position:absolute;

  inset:18px;

  border:
    1px solid
    rgba(215,184,131,.38);

  border-radius:4px;
}

.cover::after{
  content:"";

  position:absolute;

  inset:28px;

  border:
    1px solid
    rgba(215,184,131,.13);

  border-radius:2px;
}

.cover-content{
  position:relative;

  z-index:2;

  padding:30px;
}

.cover-small{
  font-family:Arial,sans-serif;

  font-size:9px;

  letter-spacing:5px;

  color:#c8ad82;

  margin-bottom:18px;
}

.cover-title{
  font-size:
    clamp(26px,4vw,52px);

  letter-spacing:5px;

  font-weight:normal;

  margin:0;
}

.cover-divider{
  width:75px;

  height:1px;

  background:#c4a875;

  margin:23px auto;
}

.cover-subtitle{
  font-size:
    clamp(14px,2vw,22px);

  font-style:italic;

  letter-spacing:2px;

  color:#d6c29f;
}

.cover-heart{
  margin-top:25px;

  font-size:22px;

  color:#c9a879;
}

.open-label{
  margin-top:23px;

  font-family:Arial,sans-serif;

  font-size:8px;

  letter-spacing:3px;

  color:#b99b6d;
}


/* =====================================================
   FLIPPING PAGE

   IMPORTANT FIXES:
   - opaque background
   - backface hidden
   - no transparent faces
   - high z-index
===================================================== */

.flip-page{
  position:absolute;

  top:0;
  bottom:0;

  width:50%;

  z-index:100;

  display:none;

  transform-style:preserve-3d;

  background:#f3e5c9;

  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;

  box-shadow:
    0 0 22px rgba(30,20,12,.28);
}

.flip-page.next{
  right:0;

  transform-origin:left center;
}

.flip-page.previous{
  left:0;

  transform-origin:right center;
}

.flip-page.active{
  display:block;
}


/* BOTH FACES MUST BE OPAQUE */

.flip-face{
  position:absolute;

  inset:0;

  overflow:hidden;

  background:
    radial-gradient(
      ellipse at center,
      rgba(255,255,255,.55),
      transparent 68%
    ),
    linear-gradient(
      90deg,
      #eee0c2,
      #fff8e7 50%,
      #ecddbd
    );

  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
}

.flip-face.back{
  transform:rotateY(180deg);
}


/* =====================================================
   PAGE ANIMATION
===================================================== */

.flip-page.animate-next{
  animation:
    turnNext
    1.05s
    cubic-bezier(.2,.72,.22,1)
    forwards;
}

.flip-page.animate-previous{
  animation:
    turnPrevious
    1.05s
    cubic-bezier(.2,.72,.22,1)
    forwards;
}

@keyframes turnNext{

  0%{
    transform:rotateY(0deg);

    box-shadow:
      0 0 0 rgba(0,0,0,0);
  }

  45%{
    box-shadow:
      -14px 0 28px rgba(25,15,8,.28);
  }

  100%{
    transform:rotateY(-180deg);

    box-shadow:
      0 0 0 rgba(0,0,0,0);
  }
}

@keyframes turnPrevious{

  0%{
    transform:rotateY(0deg);

    box-shadow:
      0 0 0 rgba(0,0,0,0);
  }

  45%{
    box-shadow:
      14px 0 28px rgba(25,15,8,.28);
  }

  100%{
    transform:rotateY(180deg);

    box-shadow:
      0 0 0 rgba(0,0,0,0);
  }
}


/* =====================================================
   COVER FLIP
===================================================== */

.cover-flip{
  position:absolute;

  inset:0;

  z-index:100;

  display:none;

  transform-style:preserve-3d;

  transform-origin:left center;

  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;

  background:#29170f;
}

.cover-flip.active{
  display:block;
}

.cover-flip.animate-open{
  animation:
    coverOpen
    1.15s
    cubic-bezier(.2,.72,.22,1)
    forwards;
}

.cover-flip.animate-close{
  animation:
    coverClose
    1.15s
    cubic-bezier(.2,.72,.22,1)
    forwards;
}

@keyframes coverOpen{

  0%{
    transform:rotateY(0deg);
  }

  45%{
    box-shadow:
      -18px 0 30px rgba(0,0,0,.35);
  }

  100%{
    transform:rotateY(-180deg);
  }
}

@keyframes coverClose{

  0%{
    transform:rotateY(-180deg);
  }

  45%{
    box-shadow:
      18px 0 30px rgba(0,0,0,.35);
  }

  100%{
    transform:rotateY(0deg);
  }
}


/* =====================================================
   NAVIGATION
===================================================== */

.navigation{
  width:min(1100px,97vw);

  margin-top:38px;

  display:grid;

  grid-template-columns:1fr auto 1fr;

  align-items:center;

  gap:20px;
}

.nav-button{

    1px solid

    rgba(32,21,15,.76);

  border-radius:5px;

  font-family:Georgia,serif;

  font-size:14px;

  cursor:pointer;

  transition:
    opacity .2s ease,
    background .2s ease;
}

.nav-button:hover:not(:disabled){
  background:
    rgba(64,43,30,.95);
}

.nav-button:disabled{
  opacity:.25;

  cursor:not-allowed;
}

#nextBtn{
  justify-self:end;
}

#prevBtn{
  justify-self:start;
}

.nav-title{
  text-align:center;

  color:#eadcc4;
}

.nav-main{
  font-size:13px;

  letter-spacing:4px;
}

.nav-sub{
  margin-top:5px;

  font-size:10px;

  letter-spacing:2px;

  opacity:.65;

  font-style:italic;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

  .scene{
    justify-content:flex-start;

    padding:
      22px
      4px
      20px;
  }

  .navigation{
    width:98vw;
  }

  .book-frame{
    padding:9px;
  }

  .book{
    aspect-ratio:2 / 1.40;
  }

  .page-inner{
    padding:
      5%
      6%

  }

  .photo-area{
    width:86%;

  }

  .polaroid{
    width:84%;

    padding:
      6px
      6px
      18px;
  }

  }

  .heart-line{
    margin:
      6px

  }

  .tags{

  }

  .message{
    font-size:10.5px;

  }

    font-size:24px;

  }

  .message-divider{

  }

  .play-button{

  .video-title{

  .video-subtitle{

  }

  .page-number{

  }

  .cover-title{
    font-size:21px;

    letter-spacing:3px;
  }

  .cover-subtitle{

  }

  .cover-small{

  }

  .navigation{
    margin-top:25px;

  }

  .nav-button{

  }

  .nav-main{
    font-size:8px;

    letter-spacing:1.5px;
  }

  .nav-sub{
    font-size:6px;
  }
}

</style>
</head>

/* =====================================================
   BOOK STATES

   0  = FRONT COVER
   1  = SAI
   2  = PERSON 2
   ...
   15 = PERSON 15
   16 = BACK COVER
===================================================== */

const lastState = people.length + 1;

let state = 0;

let animating = false;


/* =====================================================
   SVG BOTANICAL
===================================================== */

function botanical(){

  return `
  <svg viewBox="0 0 120 90" fill="none">

    <path
      d="M8 82 C35 70,50 42,72 10"
      stroke="currentColor"
      stroke-width="1.2"/>

    <path
      d="M34 62 C24 52,19 45,17 36"
      stroke="currentColor"/>

    <path
      d="M47 46 C58 37,65 30,66 20"
      stroke="currentColor"/>

    <path
      d="M24 56 C18 50,11 48,7 48"
      stroke="currentColor"/>

    <path
      d="M55 38 C66 35,74 36,81 40"
      stroke="currentColor"/>

    <ellipse
      cx="18"
      cy="36"
      rx="6"
      ry="3"
      transform="rotate(-35 18 36)"
      stroke="currentColor"/>

    <ellipse
      cx="67"
      cy="20"
      rx="7"
      ry="3"
      transform="rotate(-40 67 20)"
      stroke="currentColor"/>

    <ellipse
      cx="81"
      cy="40"
      rx="7"
      ry="3"
      transform="rotate(18 81 40)"
      stroke="currentColor"/>

  </svg>
  `;
}


/* =====================================================
   PHOTO
===================================================== */

function photoHTML(person){

  if(person.photo){

    return `
      <div class="polaroid">

        <div class="photo-placeholder">

          <img
            src="${person.photo}"
            alt="${person.name}">

        </div>

      </div>
    `;

  }

  return `
    <div class="polaroid">

      <div class="photo-placeholder">
        PHOTO
      </div>

    </div>
  `;
}


/* =====================================================
   VIDEO

   Same HTML structure for EVERY person.
===================================================== */

function videoHTML(){

  return `
    <div
      class="video-card"
      onclick="videoClicked()">

      <div class="play-button">
        ▶
      </div>

      <div class="video-text">

        <div class="video-title">
          Watch Video
        </div>

        <div class="video-subtitle">
          A MEMORY FROM THIS CHAPTER
        </div>

      </div>

    </div>
  `;
}


/* =====================================================
   PERSON LEFT PAGE
===================================================== */

function leftPerson(person,pageNumber){

  return `

    <div class="page-inner">

      <div class="photo-area">

        ${photoHTML(person)}

      </div>

      <div class="person-name">
        ${person.name}
      </div>

      <div class="heart-line">
        <span>♡</span>
      </div>

      <div class="tags">
        ${person.tags}
      </div>

    </div>

    <div class="botanical bottom-left">
      ${botanical()}
    </div>

    <div class="page-number">
      ${pageNumber} / 30
    </div>

  `;
}


/* =====================================================
   PERSON RIGHT PAGE
===================================================== */

function rightPerson(person,pageNumber){

  return `

    <div class="page-inner">

      <div class="right-content">

        <div class="message">
          ${person.message}
        </div>

        <div class="message-divider"></div>

        ${videoHTML()}

      </div>

    </div>

    <div class="botanical bottom-right">
      ${botanical()}
    </div>

    <div class="page-number">
      ${pageNumber} / 30
    </div>

  `;
}


/* =====================================================
   RENDER PERSON SPREAD
===================================================== */

function renderPerson(index){

  const person = people[index];

  const physicalLeft =
    index * 2 + 1;

  const physicalRight =
    physicalLeft + 1;

  document.getElementById("leftPage").innerHTML =
    leftPerson(
      person,
      physicalLeft
    );

  document.getElementById("rightPage").innerHTML =
    rightPerson(
      person,
      physicalRight
    );
}


/* =====================================================
   COVER
===================================================== */

function frontCover(){

  return `
    <div class="cover">

      <div class="cover-content">

        <div class="cover-small">
          A COLLECTION OF MEMORIES
        </div>

        <h1 class="cover-title">
          FAREWELL 2026
        </h1>

        <div class="cover-divider"></div>

        <div class="cover-subtitle">
          Our Memories Together
        </div>

        <div class="cover-heart">
          ♡
        </div>

        <div class="open-label">
          CLICK NEXT TO OPEN
        </div>

      </div>

    </div>
  `;
}


function backCover(){

  return `
    <div class="cover">

      <div class="cover-content">

        <div class="cover-small">
          FAREWELL 2026
        </div>

        <div class="cover-heart">
          ♡
        </div>

        <div class="cover-subtitle">
          Until our stories cross again.
        </div>

      </div>

    </div>
  `;
}


/* =====================================================
   UPDATE NAVIGATION
===================================================== */

function updateButtons(){

  const previous =
    document.getElementById("prevBtn");

  const nextButton =
    document.getElementById("nextBtn");

  previous.disabled =
    animating ||
    state === 0;

  nextButton.disabled =
    animating ||
    state === lastState;

  if(state === 0){

    nextButton.innerHTML =
      "Open Book →";

  }
  else if(state === lastState){

    nextButton.innerHTML =
      "Book Closed";

  }
  else{

    nextButton.innerHTML =
      "Next →";

  }
}


/* =====================================================
   SHOW CURRENT STATE
===================================================== */

function showState(){

  const spread =
    document.getElementById("spread");

  const coverFlip =
    document.getElementById("coverFlip");

  const backCoverElement =
    document.getElementById("backCover");


  /* FRONT COVER */

  if(state === 0){

    spread.style.display =
      "none";

    coverFlip.style.display =
      "block";

    backCoverElement.style.display =
      "none";

  }


  /* PERSON */

  else if(state >= 1 && state <= people.length){

    spread.style.display =
      "grid";

    coverFlip.style.display =
      "none";

    backCoverElement.style.display =
      "none";

    renderPerson(state - 1);

  }


  /* BACK COVER */

  else{

    spread.style.display =
      "none";

    coverFlip.style.display =
      "none";

    backCoverElement.style.display =
      "block";

  }

  updateButtons();
}


/* =====================================================
   OPEN FRONT COVER
===================================================== */

function openBook(){

  if(animating || state !== 0){
    return;
  }

  animating = true;

  const coverFlip =
    document.getElementById("coverFlip");

  coverFlip.innerHTML =
    frontCover();

  coverFlip.style.display =
    "block";

  coverFlip.className =
    "cover-flip active animate-open";


  /*
    At the middle of the turn,
    reveal Sai underneath.
  */

  setTimeout(()=>{

    state = 1;

    document.getElementById("spread").style.display =
      "grid";

    renderPerson(0);

  },570);


  setTimeout(()=>{

    coverFlip.className =
      "cover-flip";

    coverFlip.innerHTML =
      "";

    animating = false;

    updateButtons();

  },1200);

}


/* =====================================================
   NEXT
===================================================== */

function next(){

  if(animating){
    return;
  }


  /* FRONT COVER → SAI */

  if(state === 0){

    openBook();

    return;
  }


  /* LAST PERSON → BACK COVER */

  if(state === people.length){

    closeToBackCover();

    return;
  }


  /* BACK COVER */

  if(state === lastState){

    return;
  }


  /*
    PERSON → NEXT PERSON
  */

  animating = true;

  const flip =
    document.getElementById("flipPage");

  const flipFront =
    document.getElementById("flipFront");

  /*
    Capture current RIGHT page.
  */

  flipFront.innerHTML =
    document.getElementById("rightPage").innerHTML;

  flip.className =
    "flip-page next active animate-next";


  /*
    Change underlying spread while
    turning page is edge-on.
  */

  setTimeout(()=>{

    state++;

    renderPerson(state - 1);

  },520);


  setTimeout(()=>{

    flip.className =
      "flip-page";

    flipFront.innerHTML =
      "";

    animating = false;

    updateButtons();

  },1080);

}


/* =====================================================
   PERSON 15 → BACK COVER
===================================================== */

function closeToBackCover(){

  animating = true;

  const flip =
    document.getElementById("flipPage");

  const flipFront =
    document.getElementById("flipFront");

  /*
    Turn the final RIGHT page.
  */

  flipFront.innerHTML =
    document.getElementById("rightPage").innerHTML;

  flip.className =
    "flip-page next active animate-next";


  setTimeout(()=>{

    document.getElementById("spread").style.display =
      "none";

    state =
      lastState;

    document.getElementById("backCover").style.display =
      "block";

  },520);


  setTimeout(()=>{

    flip.className =
      "flip-page";

    flipFront.innerHTML =
      "";

    animating = false;

    updateButtons();

  },1080);

}


/* =====================================================
   PREVIOUS
===================================================== */

function previous(){

  if(animating){
    return;
  }


  /* BACK COVER → PERSON 15 */

  if(state === lastState){

    openFromBackCover();

    return;
  }


  /* FIRST PERSON → FRONT COVER */

  if(state === 1){

    closeToFrontCover();

    return;
  }


  if(state <= 0){
    return;
  }


  /*
    NORMAL PERSON → PREVIOUS PERSON
  */

  animating = true;

  const flip =
    document.getElementById("flipPage");

  const flipFront =
    document.getElementById("flipFront");

  flipFront.innerHTML =
    document.getElementById("leftPage").innerHTML;

  flip.className =
    "flip-page previous active animate-previous";


  setTimeout(()=>{

    state--;

    renderPerson(state - 1);

  },520);


  setTimeout(()=>{

    flip.className =
      "flip-page";

    flipFront.innerHTML =
      "";

    animating = false;

    updateButtons();

  },1080);

}


/* =====================================================
   FIRST PERSON → FRONT COVER
===================================================== */

function closeToFrontCover(){

  animating = true;

  const flip =
    document.getElementById("flipPage");

  const flipFront =
    document.getElementById("flipFront");

  flipFront.innerHTML =
    document.getElementById("leftPage").innerHTML;

  flip.className =
    "flip-page previous active animate-previous";


  setTimeout(()=>{

    document.getElementById("spread").style.display =
      "none";

    document.getElementById("coverFlip").style.display =
      "block";

    document.getElementById("coverFlip").innerHTML =
      frontCover();

    state = 0;

  },520);


  setTimeout(()=>{

    flip.className =
      "flip-page";

    flipFront.innerHTML =
      "";

    animating = false;

    updateButtons();

  },1080);

}


/* =====================================================
   BACK COVER → PERSON 15
===================================================== */

function openFromBackCover(){

  animating = true;

  const back =
    document.getElementById("backCover");

  back.style.display =
    "block";


  /*
    Hide back cover during the return turn.
  */

  setTimeout(()=>{

    state =
      people.length;

    document.getElementById("spread").style.display =
      "grid";

    renderPerson(people.length - 1);

    back.style.display =
      "none";

  },520);


  setTimeout(()=>{

    animating = false;

    updateButtons();

  },1080);

}


/* =====================================================
   VIDEO CLICK
===================================================== */

function videoClicked(){

  alert(
    "Your OneDrive video will be connected here."
  );

}


/* =====================================================
   START
===================================================== */

showState();

</script>
