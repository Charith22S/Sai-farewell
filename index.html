<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SAI MEMORY BOOK</title>

<style>
/* =========================================================
   GLOBAL
========================================================= */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  min-height: 100%;
}

body {
  background:
    radial-gradient(circle at 50% 20%, #f7ead6 0%, #ead5b9 45%, #d7b994 100%);
  color: #39281e;
  font-family: Georgia, "Times New Roman", serif;
  overflow-x: hidden;
}

/* =========================================================
   BOOK GEOMETRY
   OPEN = 1000 x 600
   SINGLE PAGE / COVER = 500 x 600
========================================================= */

:root {
  --book-width: min(92vw, 1000px);
  --book-height: calc(var(--book-width) * 0.6);
  --page-width: calc(var(--book-width) / 2);

  --paper: #f8f0e3;
  --paper-dark: #eadcc8;
  --ink: #49352a;
  --muted: #846e5b;
  --accent: #9a6755;
  --cover: #684a38;
  --cover-dark: #493124;
}

/* =========================================================
   APP
========================================================= */

.book-app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 35px 18px 25px;
}

/* =========================================================
   BOOK STAGE
========================================================= */

.book-stage {
  position: relative;
  width: var(--book-width);
  height: var(--book-height);
  perspective: 2200px;
  transform-style: preserve-3d;
}

/* =========================================================
   OPEN BOOK
========================================================= */

.book {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
}

/*
  Permanent open spread underneath.
*/
.spread {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  overflow: hidden;
  border-radius: 5px;
  box-shadow:
    0 25px 55px rgba(56, 35, 21, 0.30),
    0 8px 18px rgba(56, 35, 21, 0.18);
}

.page {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background:
    linear-gradient(rgba(255,255,255,.15), rgba(255,255,255,.15)),
    repeating-linear-gradient(
      0deg,
      rgba(120,90,60,.025) 0px,
      rgba(120,90,60,.025) 1px,
      transparent 1px,
      transparent 4px
    ),
    var(--paper);
}

.page.left {
  border-right: 1px solid rgba(90, 65, 45, .16);
}

.page.right {
  border-left: 1px solid rgba(90, 65, 45, .12);
}

.page-inner {
  width: 100%;
  height: 100%;
  padding: clamp(24px, 4vw, 55px);
  display: flex;
  flex-direction: column;
}

/* =========================================================
   CENTER SPINE
========================================================= */

.book-spine-shadow {
  position: absolute;
  left: 50%;
  top: 0;
  width: 18px;
  height: 100%;
  transform: translateX(-50%);
  pointer-events: none;
  z-index: 20;
  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(61, 39, 25, .10),
      rgba(61, 39, 25, .18),
      rgba(61, 39, 25, .06),
      transparent
    );
}

/* =========================================================
   COVER
========================================================= */

.front-cover {
  position: absolute;

  /*
    IMPORTANT:
    The cover is exactly ONE PAGE wide.
    It therefore has exactly the same height as the spread.
  */
  width: var(--page-width);
  height: var(--book-height);

  left: 50%;

  transform-origin: left center;
  transform-style: preserve-3d;

  z-index: 100;

  border-radius: 4px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.05),
      transparent 30%,
      rgba(0,0,0,.08)
    ),
    repeating-linear-gradient(
      90deg,
      rgba(255,255,255,.025) 0,
      rgba(255,255,255,.025) 1px,
      transparent 1px,
      transparent 3px
    ),
    var(--cover);

  box-shadow:
    12px 18px 35px rgba(42, 24, 15, .35);

  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}

/*
  Cover is initially closed.
*/
.front-cover.closed {
  transform: translateX(0) rotateY(0deg);
}

/*
  Cover open state:
  same physical cover, hinged on its left edge.
*/
.front-cover.open {
  transform: translateX(-100%) rotateY(-180deg);
}

/* =========================================================
   COVER FACE
========================================================= */

.cover-face {
  position: absolute;
  inset: 0;
  padding: 30px;

  display: flex;
  align-items: center;
  justify-content: center;

  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}

.cover-front-content {
  width: 100%;
  height: 100%;

  border: 1px solid rgba(255,255,255,.18);

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  text-align: center;
  color: #f7eadb;

  box-shadow:
    inset 0 0 35px rgba(0,0,0,.15);
}

.cover-small {
  font-family: Arial, sans-serif;
  letter-spacing: .28em;
  font-size: 10px;
  opacity: .75;
  margin-bottom: 18px;
}

.cover-title {
  font-size: clamp(28px, 4vw, 48px);
  letter-spacing: .10em;
  margin: 0;
}

.cover-year {
  margin-top: 14px;
  font-size: 16px;
  letter-spacing: .18em;
  opacity: .85;
}

.cover-heart {
  margin-top: 28px;
  font-size: 24px;
}

.cover-back {
  position: absolute;
  inset: 0;
  background: var(--cover-dark);

  transform: rotateY(180deg);

  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}

/* =========================================================
   COVER ANIMATION
========================================================= */

.front-cover.opening {
  animation: openCover .95s cubic-bezier(.22,.61,.36,1) forwards;
}

.front-cover.closing {
  animation: closeCover .95s cubic-bezier(.22,.61,.36,1) forwards;
}

@keyframes openCover {
  from {
    transform: translateX(0) rotateY(0deg);
  }

  to {
    transform: translateX(-100%) rotateY(-180deg);
  }
}

@keyframes closeCover {
  from {
    transform: translateX(-100%) rotateY(-180deg);
  }

  to {
    transform: translateX(0) rotateY(0deg);
  }
}

/* =========================================================
   INTRO PAGE
========================================================= */

.intro-left {
  align-items: center;
  justify-content: center;
  text-align: center;
}

.intro-left .tiny-heart {
  font-size: 28px;
  opacity: .35;
}

.intro-left .botanical {
  margin-top: 25px;
  font-size: 13px;
  letter-spacing: .15em;
  color: var(--muted);
}

.intro-right {
  justify-content: center;
}

.eyebrow {
  font-family: Arial, sans-serif;
  font-size: 10px;
  letter-spacing: .3em;
  color: var(--muted);
  margin-bottom: 18px;
}

.intro-title {
  font-size: clamp(28px, 4vw, 45px);
  font-weight: normal;
  margin: 0 0 22px;
}

.intro-text {
  max-width: 430px;
  font-size: 16px;
  line-height: 1.8;
  color: #6d5848;
}

/* =========================================================
   MEMORY PAGE
========================================================= */

.memory-left {
  align-items: center;
  justify-content: center;
  text-align: center;
}

.memory-right {
  justify-content: center;
}

.photo-wrap {
  position: relative;

  /*
    Authentic upright polaroid.
    Never stretch this into a banner.
  */
  width: min(44%, 230px);
  min-width: 150px;
  aspect-ratio: 4 / 5.1;

  padding: 10px 10px 38px;

  background: #fffaf1;

  box-shadow:
    0 13px 25px rgba(63, 40, 25, .20),
    0 3px 6px rgba(63, 40, 25, .12);

  transform: rotate(-2deg);
}

/* Tape */
.photo-wrap::before {
  content: "";
  position: absolute;

  width: 65px;
  height: 19px;

  top: -9px;
  left: 50%;

  transform: translateX(-50%) rotate(-2deg);

  background: rgba(215, 190, 153, .72);

  box-shadow: 0 2px 3px rgba(70,45,30,.08);
}

.photo {
  width: 100%;
  height: 100%;

  object-fit: cover;

  display: block;

  background:
    linear-gradient(135deg, #e8d9c4, #cdb69a);
}

/*
  If no actual image exists, show a subtle placeholder
  instead of an empty stretched rectangle.
*/
.photo-placeholder {
  width: 100%;
  height: 100%;

  display: flex;
  align-items: center;
  justify-content: center;

  color: #9a836d;

  font-family: Arial, sans-serif;
  font-size: 11px;
  letter-spacing: .12em;

  background:
    radial-gradient(circle at 30% 25%, #f5eadb, transparent 25%),
    linear-gradient(135deg, #e8d9c4, #cdb69a);
}

.person-name {
  margin: 18px 0 6px;

  font-size: clamp(21px, 2.4vw, 31px);
  font-weight: normal;
}

.heart-line {
  color: var(--accent);
  letter-spacing: .3em;
  margin: 5px 0 13px;
}

.tags {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 7px;
}

.tag {
  font-family: Arial, sans-serif;
  font-size: 9px;
  letter-spacing: .12em;

  padding: 5px 9px;

  border: 1px solid rgba(117, 87, 63, .22);
  border-radius: 20px;

  color: #765f4d;
}

/* =========================================================
   RIGHT PAGE TEXT
========================================================= */

.quote {
  max-width: 440px;

  font-size: 1rem;
  line-height: 1.6;

  color: var(--ink);

  margin: 0;
}

.divider {
  width: 75px;
  height: 1px;

  margin: 22px 0;

  background: rgba(113, 78, 55, .28);
}

/* =========================================================
   VIDEO CARD
========================================================= */

.video-card {
  width: min(100%, 390px);

  min-height: 110px;

  margin-top: 8px;

  border: 1px solid rgba(106, 75, 53, .20);

  background: rgba(255,255,255,.38);

  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;

  cursor: pointer;

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    background .2s ease;
}

.video-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 22px rgba(69,45,30,.12);
  background: rgba(255,255,255,.58);
}

.play-button {
  width: 42px;
  height: 42px;

  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  background: var(--accent);
  color: white;

  font-family: Arial, sans-serif;
  font-size: 15px;

  padding-left: 2px;
}

.video-label {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.video-label strong {
  font-size: 14px;
  font-weight: normal;
}

.video-label span {
  font-family: Arial, sans-serif;
  font-size: 9px;
  letter-spacing: .13em;
  color: var(--muted);
}

/* =========================================================
   PAGE TURNING LEAVES
========================================================= */

/*
  These are actual page-sized 3D leaves.
  They rotate around the spine rather than simply swapping content.
*/

.turning-page {
  position: absolute;

  top: 0;
  width: var(--page-width);
  height: var(--book-height);

  z-index: 50;

  transform-style: preserve-3d;

  display: none;

  pointer-events: none;
}

.turning-page.right-turn {
  left: 50%;
  transform-origin: left center;
}

.turning-page.left-turn {
  left: 0;
  transform-origin: right center;
}

.turning-face {
  position: absolute;
  inset: 0;

  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;

  overflow: hidden;

  background: var(--paper);
}

.turning-face.back {
  transform: rotateY(180deg);
}

.turning-page.turn-next {
  display: block;
  animation: turnNext .82s cubic-bezier(.22,.61,.36,1) forwards;
}

.turning-page.turn-prev {
  display: block;
  animation: turnPrev .82s cubic-bezier(.22,.61,.36,1) forwards;
}

@keyframes turnNext {
  from {
    transform: rotateY(0deg);
  }

  to {
    transform: rotateY(-180deg);
  }
}

@keyframes turnPrev {
  from {
    transform: rotateY(0deg);
  }

  to {
    transform: rotateY(180deg);
  }
}

/* =========================================================
   PAGE TURN SHADOW
========================================================= */

.turning-page::after {
  content: "";
  position: absolute;
  inset: 0;

  pointer-events: none;

  background:
    linear-gradient(
      90deg,
      transparent 40%,
      rgba(0,0,0,.12) 50%,
      transparent 62%
    );

  opacity: 0;

  animation: pageShadow .82s ease forwards;
}

@keyframes pageShadow {
  0% { opacity: 0; }
  35% { opacity: .7; }
  70% { opacity: .35; }
  100% { opacity: 0; }
}

/* =========================================================
   NAVIGATION
========================================================= */

.controls {
  width: var(--book-width);

  display: flex;
  justify-content: center;
  align-items: center;

  gap: 10px;

  margin-top: 22px;
}

.controls button {
  border: 1px solid rgba(95,66,45,.25);

  background: rgba(255,249,240,.72);

  color: #513b2c;

  padding: 10px 18px;

  font-family: Arial, sans-serif;
  font-size: 11px;
  letter-spacing: .08em;

  cursor: pointer;

  transition:
    background .2s ease,
    transform .2s ease;
}

.controls button:hover {
  background: #fffaf2;
  transform: translateY(-1px);
}

.controls button:disabled {
  opacity: .4;
  cursor: default;
  transform: none;
}

.page-counter {
  min-width: 70px;
  text-align: center;

  font-family: Arial, sans-serif;
  font-size: 10px;
  letter-spacing: .12em;

  color: #735e4d;
}

/* =========================================================
   OPEN BUTTON
========================================================= */

.open-button {
  position: absolute;

  left: 50%;
  bottom: 35px;

  transform: translateX(-50%);

  border: 1px solid rgba(255,255,255,.35);

  background: rgba(255,255,255,.10);

  color: #f7eadb;

  padding: 12px 23px;

  font-family: Arial, sans-serif;
  font-size: 10px;
  letter-spacing: .17em;

  cursor: pointer;

  transition: background .2s ease;
}

.open-button:hover {
  background: rgba(255,255,255,.18);
}

/* =========================================================
   CLOSED STATE
========================================================= */

body.book-closed .spread,
body.book-closed .book-spine-shadow {
  visibility: hidden;
}

body.book-closed .controls {
  visibility: hidden;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 700px) {
  :root {
    --book-width: 94vw;
  }

  .page-inner {
    padding: 20px;
  }

  .photo-wrap {
    width: 48%;
    min-width: 120px;
  }

  .quote {
    font-size: .9rem;
  }

  .video-card {
    min-height: 82px;
  }

  .controls button {
    padding: 9px 11px;
    font-size: 9px;
  }
}

@media (max-height: 650px) {
  .book-app {
    padding-top: 18px;
  }

  .book-stage {
    width: min(92vw, 850px);
  }
}
</style>

}


function personRightHTML(person) {

  return `
    <div class="memory-right">

      <div class="eyebrow">
        A MEMORY FOR YOU
      </div>

      <p class="quote">
        ${person.quote}
      </p>

      <div class="divider"></div>

      <div
        class="video-card"
        data-video="${person.video || ""}"
        onclick="playVideo(this)"
      >

        <div class="play-button">
          ▶
        </div>

        <div class="video-label">
          <strong>Watch Video</strong>
          <span>A LITTLE MOMENT TO REMEMBER</span>
        </div>

      </div>

    </div>
  `;
}


/* =========================================================
   RENDER SPREAD
========================================================= */

function renderSpread(index) {

  if (index === 0) {

    leftContent.innerHTML = introLeftHTML();
    rightContent.innerHTML = introRightHTML();

    pageCounter.textContent = "INTRO";

  } else {

    const person = people[index - 1];

    leftContent.innerHTML = personLeftHTML(person);
    rightContent.innerHTML = personRightHTML(person);

    pageCounter.textContent =
      `${index} / ${people.length}`;
  }

  previousBtn.disabled = index === 0;
  nextBtn.disabled = false;
}


/* =========================================================
   COVER OPEN
========================================================= */

function openBook() {

  if (isAnimating || isOpen) return;

  isAnimating = true;

  /*
    Render intro BEFORE opening.
    This prevents the blank/instant-swap effect.
  */
  renderSpread(0);

  document.body.classList.remove("book-closed");

  frontCover.classList.remove("closed");
  frontCover.classList.add("opening");

  frontCover.addEventListener(
    "animationend",
    () => {

      frontCover.classList.remove("opening");
      frontCover.classList.add("open");

      isOpen = true;
      isAnimating = false;

    },
    { once: true }
  );
}


/* =========================================================
   CLOSE BOOK
========================================================= */

function closeBook() {

  if (isAnimating || !isOpen) return;

  isAnimating = true;

  /*
    IMPORTANT:
    The cover remains the exact same size and position
    throughout the closing animation.
  */

  frontCover.classList.remove("open");
  frontCover.classList.add("closing");

  frontCover.addEventListener(
    "animationend",
    () => {

      frontCover.classList.remove("closing");
      frontCover.classList.add("closed");

      document.body.classList.add("book-closed");

      currentSpread = 0;
      isOpen = false;
      isAnimating = false;

      renderSpread(0);

    },
    { once: true }
  );
}


/* =========================================================
   PAGE TURN
========================================================= */

function nextPage() {

  if (!isOpen || isAnimating) return;

  /*
    Final page -> physically close the album.
  */
  if (currentSpread === totalSpreads - 1) {
    closeBook();
    return;
  }

  animatePageTurn("next");
}


function previousPage() {

  if (!isOpen || isAnimating) return;

  if (currentSpread === 0) return;

  animatePageTurn("previous");
}


/* =========================================================
   3D PAGE TURN ENGINE
========================================================= */

function animatePageTurn(direction) {

  isAnimating = true;

  const oldIndex = currentSpread;

  const newIndex =
    direction === "next"
      ? currentSpread + 1
      : currentSpread - 1;

  /*
    Save current visible content as the turning leaf.
  */
  turnFront.innerHTML = `
    <div style="
      width:100%;
      height:100%;
      padding:0;
    ">
      ${direction === "next"
        ? leftContent.innerHTML
        : rightContent.innerHTML}
    </div>
  `;

  /*
    Prepare the content that will appear behind it.
  */
  if (direction === "next") {

    renderSpread(newIndex);

    turnBack.innerHTML = `
      <div style="
        width:100%;
        height:100%;
        padding:0;
      ">
        ${rightContent.innerHTML}
      </div>
    `;

    /*
      Restore the new spread underneath after capturing it.
    */
    renderSpread(newIndex);

    turningPage.className =
      "turning-page right-turn turn-next";

  } else {

    renderSpread(newIndex);

    turnBack.innerHTML = `
      <div style="
        width:100%;
        height:100%;
        padding:0;
      ">
        ${leftContent.innerHTML}
      </div>
    `;

    renderSpread(newIndex);

    turningPage.className =
      "turning-page left-turn turn-prev";
  }

  /*
    Finish after real animation.
  */
  turningPage.addEventListener(
    "animationend",
    () => {

      turningPage.className = "turning-page";

      currentSpread = newIndex;

      renderSpread(currentSpread);

      isAnimating = false;

    },
    { once: true }
  );
}


/* =========================================================
   VIDEO
========================================================= */

function playVideo(card) {

  const videoUrl = card.dataset.video;

  if (!videoUrl) {

    /*
      Replace this with the real video URL
      for each person.
    */

    alert("Add this person's video URL in the people array.");

    return;
  }

  window.open(videoUrl, "_blank");
}


/* =========================================================
   EVENTS
========================================================= */

openBookBtn.addEventListener("click", openBook);

previousBtn.addEventListener("click", previousPage);

nextBtn.addEventListener("click", nextPage);

closeBtn.addEventListener("click", closeBook);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener("keydown", event => {

  if (event.key === "ArrowRight") {
    nextPage();
  }

  if (event.key === "ArrowLeft") {
    previousPage();
  }

  if (event.key === "Escape") {
    closeBook();
  }

});


/* =========================================================
   INITIAL STATE
========================================================= */

renderSpread(0);

</script>

</body>
</html>
