<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Farewell 2026 — Our Memories Together</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    font-family:Georgia,"Times New Roman",serif;
    color:#4b3524;

    background:
        linear-gradient(rgba(20,10,5,.45),rgba(20,10,5,.65)),
        repeating-linear-gradient(
            90deg,
            #4a2a17 0,
            #5b351f 90px,
            #402313 180px,
            #59341e 270px
        );
}

/* =====================================================
   DESK
===================================================== */

.scene{
    width:100vw;
    height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:25px;

    perspective:2500px;
}

/* =====================================================
   BOOK AREA
===================================================== */

.book-wrap{

    width:min(1180px,94vw);
    height:min(720px,78vh);

    position:relative;

    transform-style:preserve-3d;
}

.book-shadow{
    position:absolute;

    left:4%;
    right:4%;
    bottom:-7%;

    height:13%;

    background:#000;
    border-radius:50%;

    filter:blur(30px);
    opacity:.65;
}

/* =====================================================
   LEATHER OUTER COVER / BORDER
===================================================== */

.book-frame{

    position:absolute;

    inset:0;

    padding:13px;

    border-radius:15px;

    background:
        linear-gradient(
            90deg,
            #21100c,
            #54261e 5%,
            #30130f 50%,
            #54261e 95%,
            #1d0d09
        );

    box-shadow:
        0 25px 50px rgba(0,0,0,.65),
        inset 0 0 18px rgba(0,0,0,.6);

    z-index:1;
}

/* =====================================================
   OPEN BOOK
===================================================== */

.book{

    position:absolute;

    inset:13px;

    display:grid;

    grid-template-columns:1fr 1fr;

    border-radius:8px;

    overflow:hidden;

    box-shadow:
        inset 0 0 25px rgba(50,25,10,.3);

    background:#ead9b8;

    z-index:5;
}

/* =====================================================
   PAGE
===================================================== */

.page{

    position:relative;

    height:100%;

    overflow:hidden;

    background:

        radial-gradient(
            circle at 25% 20%,
            rgba(130,90,45,.08),
            transparent 30%
        ),

        radial-gradient(
            circle at 80% 80%,
            rgba(130,90,45,.06),
            transparent 30%
        ),

        linear-gradient(
            90deg,
            rgba(100,65,30,.12),
            transparent 10%,
            transparent 90%,
            rgba(100,65,30,.08)
        ),

        #f3e5c8;
}

.left-page{

    border-radius:8px 0 0 8px;

    box-shadow:
        inset -25px 0 35px rgba(60,35,15,.13);
}

.right-page{

    border-radius:0 8px 8px 0;

    box-shadow:
        inset 25px 0 35px rgba(60,35,15,.13);
}

/* =====================================================
   SOFT BOOK GUTTER
===================================================== */

.gutter{

    position:absolute;

    z-index:20;

    left:50%;
    top:0;
    bottom:0;

    width:55px;

    transform:translateX(-50%);

    pointer-events:none;

    background:
        linear-gradient(
            90deg,
            transparent 0%,
            rgba(70,40,18,.06) 15%,
            rgba(50,25,10,.24) 45%,
            rgba(255,255,255,.32) 50%,
            rgba(50,25,10,.20) 55%,
            rgba(70,40,18,.05) 85%,
            transparent
        );

    filter:blur(1px);
}

/* =====================================================
   PAGE CONTENT
===================================================== */

.page-content{

    width:100%;
    height:100%;

    padding:
        clamp(25px,4vw,55px);

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;
}

/* =====================================================
   PHOTO
===================================================== */

.polaroid{

    position:relative;

    width:min(62%,360px);

    height:52%;

    min-height:230px;

    max-height:390px;

    padding:10px 10px 34px;

    background:#fffdf8;

    box-shadow:
        0 12px 25px rgba(40,25,10,.28);

    transform:rotate(-1.5deg);

    flex-shrink:0;
}

.polaroid img{

    width:100%;
    height:100%;

    display:block;

    object-fit:cover;
}

.photo-placeholder{

    width:100%;
    height:100%;

    display:flex;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    background:
        linear-gradient(
            135deg,
            #d9c6a7,
            #b99d75
        );

    color:#70573d;

    font-size:15px;
}

/* =====================================================
   TAPE
===================================================== */

.tape{

    position:absolute;

    width:110px;
    height:25px;

    top:-13px;
    left:50%;

    transform:
        translateX(-50%)
        rotate(-2deg);

    background:rgba(220,202,160,.72);

    z-index:5;

    box-shadow:0 2px 5px rgba(0,0,0,.08);
}

/* =====================================================
   NAME
===================================================== */

.person-name{

    margin-top:18px;

    font-size:
        clamp(28px,4vw,48px);

    font-weight:normal;

    line-height:1.1;
}

.heart-line{

    margin:10px 0;

    color:#80654a;

    font-size:16px;
}

.tags{

    font-size:11px;

    letter-spacing:3px;

    color:#80684e;
}

/* =====================================================
   RIGHT PAGE MESSAGE
===================================================== */

.message-page{

    justify-content:center;

    padding:
        clamp(35px,5vw,75px);
}

.quote{

    max-width:560px;

    font-size:
        clamp(17px,2vw,25px);

    line-height:1.8;

    margin:0 auto;

    color:#503a29;
}

.quote-mark{

    font-size:42px;

    color:#9a7954;

    line-height:1;

    margin-bottom:18px;
}

/* =====================================================
   VIDEO
===================================================== */

.video-card{

    width:min(75%,410px);

    margin-top:28px;

    border:1px solid #b99a6d;

    border-radius:8px;

    overflow:hidden;

    background:#e4d0aa;

    box-shadow:
        0 8px 18px rgba(70,40,20,.15);
}

.video-placeholder{

    height:145px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    color:#654a32;
}

.play{

    width:52px;
    height:52px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#765638;

    color:white;

    font-size:20px;

    margin-bottom:9px;
}

.watch{

    font-size:15px;
}

.video-card video{

    width:100%;

    display:block;
}

/* =====================================================
   BOTANICAL CORNERS
===================================================== */

.botanical{

    position:absolute;

    bottom:18px;

    font-size:42px;

    color:#80694e;

    opacity:.32;

    line-height:1;
}

.botanical.left{
    left:22px;
}

.botanical.right{
    right:22px;

    transform:scaleX(-1);
}

/* =====================================================
   PAGE NUMBERS
===================================================== */

.page-number{

    position:absolute;

    bottom:18px;

    font-size:11px;

    letter-spacing:3px;

    color:#80684e;
}

.left-page .page-number{
    left:50px;
}

.right-page .page-number{
    right:50px;
}

/* =====================================================
   NAVIGATION
===================================================== */

.navigation{

    position:absolute;

    left:-5px;
    right:-5px;

    bottom:-78px;

    height:58px;

    display:grid;

    grid-template-columns:1fr auto 1fr;

    align-items:center;

    z-index:100;
}

.nav-button{

    width:125px;

    padding:11px 18px;

    border-radius:25px;

    border:1px solid #b8935f;

    background:#2f1910;

    color:#efd09a;

    font-family:Georgia,serif;

    cursor:pointer;

    font-size:14px;
}

.nav-button:first-child{
    justify-self:start;
}

.nav-button:last-child{
    justify-self:end;
}

.nav-button:hover{
    background:#472719;
}

.book-title{
    text-align:center;

    color:#edce96;
}

.book-title strong{

    display:block;

    font-size:12px;

    letter-spacing:5px;
}

.book-title span{

    display:block;

    margin-top:4px;

    font-family:"Brush Script MT",
                "Segoe Script",
                cursive;

    font-size:21px;
}

/* =====================================================
   PAGE FLIP OVERLAY
===================================================== */

.flip-page{

    position:absolute;

    top:0;

    width:50%;
    height:100%;

    z-index:50;

    display:none;

    transform-style:preserve-3d;

    perspective:2000px;
}

.flip-page.next{

    left:50%;

    transform-origin:left center;
}

.flip-page.previous{

    left:0;

    transform-origin:right center;
}

.flip-page.animate-next{

    display:block;

    animation:flipNext 1.15s cubic-bezier(.65,.05,.25,1) forwards;
}

.flip-page.animate-previous{

    display:block;

    animation:flipPrevious 1.15s cubic-bezier(.65,.05,.25,1) forwards;
}

.flip-front,
.flip-back{

    position:absolute;

    inset:0;

    backface-visibility:hidden;

    background:#f3e5c8;

    box-shadow:
        0 0 25px rgba(40,20,10,.25);

    overflow:hidden;
}

.flip-back{

    transform:rotateY(180deg);
}

@keyframes flipNext{

    from{
        transform:rotateY(0deg);
    }

    to{
        transform:rotateY(-180deg);
    }
}

@keyframes flipPrevious{

    from{
        transform:rotateY(0deg);
    }

    to{
        transform:rotateY(180deg);
    }
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    .scene{
        padding:8px;
    }

    .book-wrap{

        width:97vw;
        height:66vh;
    }

    .book-frame{
        padding:7px;
    }

    .book{
        inset:7px;
    }

    .page-content{
        padding:13px;
    }

    .polaroid{

        width:80%;

        height:48%;

        min-height:170px;

        padding:7px 7px 25px;
    }

    .tape{

        width:65px;
        height:17px;

        top:-9px;
    }

    .person-name{

        font-size:25px;

        margin-top:10px;
    }

    .heart-line{

        margin:5px 0;

        font-size:12px;
    }

    .tags{

        font-size:7px;

        letter-spacing:1.5px;
    }

    .message-page{

        padding:18px;
    }

    .quote-mark{

        font-size:28px;

        margin-bottom:8px;
    }

    .quote{

        font-size:12px;

        line-height:1.55;
    }

    .video-card{

        width:90%;

        margin-top:14px;
    }

    .video-placeholder{

        height:90px;
    }

    .play{

        width:35px;
        height:35px;

        font-size:14px;
    }

    .watch{

        font-size:11px;
    }

    .botanical{

        font-size:25px;

        bottom:12px;
    }

    .left-page .page-number{
        left:25px;
    }

    .right-page .page-number{
        right:25px;
    }

    .page-number{
        bottom:10px;

        font-size:8px;

        letter-spacing:2px;
    }

    .navigation{

        bottom:-65px;

        height:48px;
    }

    .nav-button{

        width:auto;

        min-width:82px;

        padding:8px 11px;

        font-size:10px;
    }

    .book-title strong{

        font-size:7px;

        letter-spacing:2px;
    }

    .book-title span{

        font-size:13px;
    }
}

</style>
</head>


<body>


<div class="scene">

<div class="book-wrap">

    <div class="book-shadow"></div>

    <!-- DARK LEATHER OUTER COVER -->
    <div class="book-frame"></div>


    <!-- OPEN BOOK -->
    <div class="book" id="book">

        <!-- LEFT PAGE -->
        <div class="page left-page">

            <div class="page-content" id="leftContent"></div>

            <div class="botanical left">❧</div>

            <div class="page-number" id="leftNumber">
                1 / 15
            </div>

        </div>


        <!-- RIGHT PAGE -->
        <div class="page right-page">

            <div class="page-content message-page" id="rightContent"></div>

            <div class="botanical right">❧</div>

            <div class="page-number" id="rightNumber">
                2 / 15
            </div>

        </div>


        <!-- SOFT CENTER GUTTER -->
        <div class="gutter"></div>


        <!-- PAGE FLIP -->
        <div class="flip-page" id="flipPage">

            <div class="flip-front" id="flipFront"></div>

            <div class="flip-back" id="flipBack"></div>

        </div>

    </div>


    <!-- NAVIGATION BELOW BOOK -->
    <div class="navigation">

        <button
            class="nav-button"
            onclick="previousPerson()">

            ← Previous

        </button>


        <div class="book-title">

            <strong>
                FAREWELL 2026
            </strong>

            <span>
                Our Memories Together
            </span>

        </div>


        <button
            class="nav-button"
            onclick="nextPerson()">

            Next →

        </button>

    </div>

</div>

</div>


<script>

/* =====================================================
   15 PEOPLE
   ONE PERSON = ONE COMPLETE TWO-PAGE SPREAD
===================================================== */

const people = [

{
    name:"Sai",
    photo:"",
    tags:"FRIEND • DREAMER • INSPIRATION",
    message:"Some people make our journey beautiful simply by being part of it. You have brought so much positivity, laughter and kindness into our lives. Thank you for being you. May your dreams always be big and your heart always be happy.",
    video:""
},

{
    name:"Person 2",
    photo:"",
    tags:"FRIEND • LAUGHTER • MEMORIES",
    message:"The memories we created together will always have a special place in our hearts. Every conversation, every laugh and every little moment will be remembered.",
    video:""
},

{
    name:"Person 3",
    photo:"",
    tags:"FRIEND • SMILES • MEMORIES",
    message:"Goodbyes are not the end. They are simply the beginning of another beautiful chapter. Wherever life takes you, may happiness always follow.",
    video:""
},

{
    name:"Person 4",
    photo:"",
    tags:"FRIEND • JOY • ADVENTURE",
    message:"Thank you for all the laughter, memories and beautiful moments. Life was definitely more enjoyable because you were part of our journey.",
    video:""
},

{
    name:"Person 5",
    photo:"",
    tags:"FRIEND • KINDNESS • MEMORIES",
    message:"Some friendships become memories that stay with us forever. Thank you for being a wonderful part of this chapter.",
    video:""
},

{
    name:"Person 6",
    photo:"",
    tags:"LAUGHTER • FRIENDSHIP • FUN",
    message:"From the funniest moments to the unforgettable memories, there will always be a special place in our hearts for the time we shared.",
    video:""
},

{
    name:"Person 7",
    photo:"",
    tags:"FRIEND • SUPPORT • SMILES",
    message:"Thank you for every smile, every conversation and every moment that made this journey special.",
    video:""
},

{
    name:"Person 8",
    photo:"",
    tags:"MEMORIES • FRIENDSHIP • JOY",
    message:"Years may pass and places may change, but beautiful memories have a way of staying with us forever.",
    video:""
},

{
    name:"Person 9",
    photo:"",
    tags:"FRIEND • LAUGHTER • ADVENTURE",
    message:"Here is to all the adventures we shared and all the wonderful moments still waiting for us in the future.",
    video:""
},

{
    name:"Person 10",
    photo:"",
    tags:"FRIEND • DREAMER • SMILES",
    message:"May your next chapter be filled with exciting opportunities, wonderful people and countless reasons to smile.",
    video:""
},

{
    name:"Person 11",
    photo:"",
    tags:"FRIENDSHIP • MEMORIES • HEART",
    message:"Thank you for being part of our story. The memories we made together will always remain a beautiful part of our lives.",
    video:""
},

{
    name:"Person 12",
    photo:"",
    tags:"LAUGHTER • FRIENDSHIP • MOMENTS",
    message:"Some moments become special simply because of the people who were there. Thank you for making those moments unforgettable.",
    video:""
},

{
    name:"Person 13",
    photo:"",
    tags:"FRIEND • MEMORIES • DREAMS",
    message:"Wherever your journey takes you next, may it be filled with success, happiness and beautiful new memories.",
    video:""
},

{
    name:"Person 14",
    photo:"",
    tags:"FRIENDSHIP • JOY • MEMORIES",
    message:"Farewells may be difficult, but they remind us just how meaningful the journey has been. Thank you for every wonderful memory.",
    video:""
},

{
    name:"Person 15",
    photo:"",
    tags:"FOREVER • FRIENDSHIP • MEMORIES",
    message:"And finally, thank you for being part of this beautiful chapter. The journey continues, but these memories will always stay with us.",
    video:""
}

];


/* =====================================================
   STATE
===================================================== */

let current = 0;
let animating = false;


/* =====================================================
   ELEMENTS
===================================================== */

const leftContent =
document.getElementById("leftContent");

const rightContent =
document.getElementById("rightContent");

const leftNumber =
document.getElementById("leftNumber");

const rightNumber =
document.getElementById("rightNumber");

const flipPage =
document.getElementById("flipPage");

const flipFront =
document.getElementById("flipFront");

const flipBack =
document.getElementById("flipBack");


/* =====================================================
   PHOTO
===================================================== */

function photoHTML(person){

    if(person.photo){

        return `
            <div class="polaroid">

                <div class="tape"></div>

                <img
                    src="${person.photo}"
                    alt="${person.name}"
                >

            </div>
        `;

    }

    return `
        <div class="polaroid">

            <div class="tape"></div>

            <div class="photo-placeholder">

                <div style="font-size:35px">
                    📷
                </div>

                <div>
                    Photo will be added
                </div>

            </div>

        </div>
    `;
}


/* =====================================================
   VIDEO
===================================================== */

function videoHTML(person){

    if(person.video){

        return `
            <div class="video-card">

                <video
                    controls
                    playsinline
                    src="${person.video}">
                </video>

            </div>
        `;

    }

    return `
        <div class="video-card">

            <div class="video-placeholder">

                <div class="play">
                    ▶
                </div>

                <div class="watch">
                    Watch Video
                </div>

                <small>
                    Video coming soon
                </small>

            </div>

        </div>
    `;
}


/* =====================================================
   RENDER CURRENT PERSON
===================================================== */

function renderPerson(){

    const person = people[current];


    /* LEFT PAGE */

    leftContent.innerHTML = `

        ${photoHTML(person)}

        <div class="person-name">
            ${person.name}
        </div>

        <div class="heart-line">
            ─── ♥ ───
        </div>

        <div class="tags">
            ${person.tags}
        </div>

    `;


    /* RIGHT PAGE */

    rightContent.innerHTML = `

        <div class="quote-mark">
            “
        </div>

        <div class="quote">
            ${person.message}
        </div>

        ${videoHTML(person)}

    `;


    /*
       IMPORTANT:
       Each person uses TWO page numbers.
    */

    const pageLeft =
        current * 2 + 1;

    const pageRight =
        current * 2 + 2;

    leftNumber.innerHTML =
        `${pageLeft} / 30`;

    rightNumber.innerHTML =
        `${pageRight} / 30`;
}


/* =====================================================
   NEXT
===================================================== */

function nextPerson(){

    if(animating) return;

    if(current >= people.length - 1) return;

    animating = true;


    /*
       Put the current RIGHT page
       on the physical turning sheet.
    */

    flipFront.innerHTML =
        rightContent.innerHTML;


    /*
       Make the back of the turning
       page look like paper.
    */

    flipBack.innerHTML = `
        <div style="
            width:100%;
            height:100%;
            background:#f3e5c8;
        "></div>
    `;


    flipPage.className =
        "flip-page next";


    void flipPage.offsetWidth;


    flipPage.classList.add(
        "animate-next"
    );


    /*
       Halfway through the turn,
       prepare the next spread underneath.
    */

    setTimeout(function(){

        current++;

        renderPerson();

    },580);


    /*
       Finish animation.
    */

    setTimeout(function(){

        flipPage.className =
            "flip-page";

        animating = false;

    },1200);
}


/* =====================================================
   PREVIOUS
===================================================== */

function previousPerson(){

    if(animating) return;

    if(current <= 0) return;

    animating = true;


    /*
       Put current LEFT page on
       the turning sheet.
    */

    flipFront.innerHTML =
        leftContent.innerHTML;


    flipBack.innerHTML = `
        <div style="
            width:100%;
            height:100%;
            background:#f3e5c8;
        "></div>
    `;


    flipPage.className =
        "flip-page previous";


    void flipPage.offsetWidth;


    flipPage.classList.add(
        "animate-previous"
    );


    setTimeout(function(){

        current--;

        renderPerson();

    },580);


    setTimeout(function(){

        flipPage.className =
            "flip-page";

        animating = false;

    },1200);
}


/* =====================================================
   START
===================================================== */

renderPerson();

</script>

</body>
</html>
