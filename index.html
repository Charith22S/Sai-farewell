<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farewell 2026</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:#24150f;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Georgia,serif;
  overflow:hidden;
}

.scene{
  width:100%;
  max-width:1000px;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  perspective:2000px;
}

/* BOOK */

.book{
  width:80%;
  max-width:650px;
  height:70%;
  position:relative;
}

/* COVER */

.cover{
  position:absolute;
  width:70%;
  height:85%;
  left:15%;
  top:7%;
  background:linear-gradient(135deg,#702f29,#321313);
  border:3px solid #b78a48;
  border-radius:8px;
  color:#f0d294;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  z-index:10;
  transform-origin:left center;
  transition:transform 1.2s ease,opacity 1.2s ease;
  box-shadow:
    10px 15px 30px rgba(0,0,0,.6),
    inset 0 0 20px rgba(0,0,0,.4);
}

.cover.open{
  transform:rotateY(-110deg);
  opacity:0;
  pointer-events:none;
}

.cover-content h1{
  font-size:55px;
  margin:10px 0;
}

.cover-content h2{
  font-weight:normal;
  font-style:italic;
}

.cover-content .line{
  font-size:28px;
  margin:25px 0;
}

.open{
  position:absolute;
  bottom:-65px;
  left:50%;
  transform:translateX(-50%);
  padding:13px 25px;
  border:0;
  border-radius:30px;
  background:#f4e7cf;
  color:#3b281d;
  font-weight:bold;
  cursor:pointer;
}

/* OPEN BOOK */

.book-pages{
  position:absolute;
  width:100%;
  height:100%;
  top:0;
  left:0;
  display:flex;
  opacity:0;
  transition:opacity .7s ease;
}

.book-pages.show{
  opacity:1;
}

.page{
  width:50%;
  height:85%;
  margin-top:7%;
  background:#f3e6ca;
  position:relative;
  padding:30px;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  box-shadow:inset 0 0 30px rgba(80,50,20,.15);
}

.left{
  border-radius:10px 0 0 10px;
  border-right:1px solid #b99b70;
}

.right{
  border-radius:0 10px 10px 0;
}

.spine{
  position:absolute;
  left:50%;
  top:7%;
  height:85%;
  width:15px;
  transform:translateX(-50%);
  background:linear-gradient(
    90deg,
    transparent,
    rgba(70,40,20,.4),
    white,
    transparent
  );
  z-index:5;
}

.content{
  width:100%;
}

.number{
  font-size:12px;
  letter-spacing:3px;
  color:#80684e;
  margin-bottom:15px;
}

.photo{
  width:65%;
  max-width:220px;
  aspect-ratio:4/5;
  object-fit:cover;
  border:8px solid white;
  box-shadow:0 8px 15px rgba(0,0,0,.2);
  margin-bottom:15px;
}

.photo-placeholder{
  width:65%;
  max-width:220px;
  aspect-ratio:4/5;
  margin:0 auto 15px;
  background:#d6c2a2;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#70583f;
}

.content h2{
  font-size:28px;
  font-weight:normal;
}

.message{
  font-size:15px;
  line-height:1.6;
  max-width:330px;
  margin:auto;
}

.video{
  margin:15px auto 0;
  padding:9px 15px;
  border:1px solid #b89c74;
  display:inline-block;
  font-size:12px;
  color:#665039;
}

/* CONTROLS */

.controls{
  position:absolute;
  bottom:2%;
  left:0;
  width:100%;
  display:flex;
  justify-content:center;
  gap:10px;
  z-index:20;
}

.controls button{
  padding:9px 15px;
  border-radius:20px;
  border:1px solid #b99a70;
  background:#f0dfc0;
  cursor:pointer;
}

/* MOBILE */

@media(max-width:600px){

  .book{
    width:96%;
    height:75%;
  }

  .cover{
    width:78%;
    left:11%;
  }

  .cover-content h1{
    font-size:40px;
  }

  .page{
    padding:12px;
  }

  .content h2{
    font-size:20px;
  }

  .message{
    font-size:11px;
  }

  .photo,
  .photo-placeholder{
    width:75%;
  }

  .controls button{
    font-size:10px;
    padding:7px 10px;
  }
}
</style>
</head>

<body>

<div class="scene">

<div class="book">

<!-- COVER -->

<div class="cover" id="cover">

<div class="cover-content">

<div>F A R E W E L L</div>

<h1>2026</h1>

<h2>Our Memories Together</h2>

<div class="line">❦ ♥ ❦</div>

</div>

<button class="open" id="openBook">
📖 OPEN BOOK
</button>

</div>


<!-- PAGES -->

<div class="book-pages" id="pages">

<div class="page left">

<div class="content" id="leftContent"></div>

</div>

<div class="page right">

<div class="content" id="rightContent"></div>

</div>

<div class="spine"></div>

</div>


<!-- CONTROLS -->

<div class="controls">

<button id="previous">
← Previous
</button>

<button id="next">
Next →
</button>

<button id="close">
Close
</button>

</div>

</div>

</div>


<script>

const people = [

{
name:"Sai",
photo:"",
message:"Some people make our journey beautiful simply by being part of it. ❤️"
},

{
name:"Person 2",
photo:"",
message:"The memories we created together will always have a special place in our hearts."
},

{
name:"Person 3",
photo:"",
message:"Goodbyes are not the end. They are the beginning of a beautiful new journey."
},

{
name:"Person 4",
photo:"",
message:"Thank you for all the laughter, memories and beautiful moments."
}

];


let current = 0;


const cover =
document.getElementById("cover");

const pages =
document.getElementById("pages");

const left =
document.getElementById("leftContent");

const right =
document.getElementById("rightContent");


function personPage(person,index){

let image="";

if(person.photo){

image=
'<img class="photo" src="' +
person.photo +
'" alt="' +
person.name +
'">';

}else{

image=
'<div class="photo-placeholder">📷<br>Photo will be added</div>';

}

return `

<div class="number">
${index+1} / ${people.length}
</div>

${image}

<h2>
${person.name}
</h2>

<div>
❧
</div>

<p class="message">
“${person.message}”
</p>

<div class="video">
▶ Video coming soon
</div>

`;

}


function intro(){

return `

<div class="number">
OUR STORY
</div>

<div style="font-size:50px">
♥
</div>

<h2>
Every chapter<br>
has a story...
</h2>

<div>
❦
</div>

<p class="message">
And you made ours special.
</p>

`;

}


function ending(){

return `

<div class="number">
THE END
</div>

<div style="font-size:50px">
♥
</div>

<h2>
But the memories<br>
will stay forever.
</h2>

<div>
❦
</div>

<p class="message">
Farewell 2026
</p>

`;

}


function render(){

if(current===0){

left.innerHTML=intro();

right.innerHTML=
personPage(people[0],0);

}

else if(current < people.length){

left.innerHTML=
personPage(
people[current-1],
current-1
);

right.innerHTML=
personPage(
people[current],
current
);

}

else{

left.innerHTML=
personPage(
people[people.length-1],
people.length-1
);

right.innerHTML=
ending();

}

}


/* OPEN */

document
.getElementById("openBook")
.onclick=function(){

cover.classList.add("open");

pages.classList.add("show");

current=0;

render();

};


/* NEXT */

document
.getElementById("next")
.onclick=function(){

if(current < people.length){

current++;

render();

}

};


/* PREVIOUS */

document
.getElementById("previous")
.onclick=function(){

if(current>0){

current--;

render();

}

};


/* CLOSE */

document
.getElementById("close")
.onclick=function(){

cover.classList.remove("open");

pages.classList.remove("show");

current=0;

};


render();

</script>

</body>
</html>
