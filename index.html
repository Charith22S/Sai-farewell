<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farewell 2026 - Our Memories Together</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
}

body{
    background:
    radial-gradient(circle at center,#5b3823 0%,#28160d 70%);
    font-family:Georgia,"Times New Roman",serif;
    color:#4b3424;
    overflow:hidden;
}

/* =========================
   MAIN STAGE
========================= */

.stage{
    width:100vw;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    perspective:2500px;
}

/* =========================
   BOOK
========================= */

.book{
    position:relative;
    width:min(94vw,1200px);
    height:min(82vh,760px);
}

/* wooden shadow */

.book-shadow{
    position:absolute;
    width:88%;
    height:8%;
    bottom:-4%;
    left:6%;
    background:#000;
    filter:blur(28px);
    opacity:.65;
    border-radius:50%;
}

/* =========================
   COVER
========================= */

.cover{
    position:absolute;
    z-index:50;

    width:62%;
    height:88%;

    left:19%;
    top:6%;

    border-radius:8px 15px 15px 8px;

    background:
    linear-gradient(
        90deg,
        rgba(0,0,0,.35),
        transparent 10%
    ),
    linear-gradient(
        135deg,
        #6c3029,
        #451916 55%,
        #29100f
    );

    border:2px solid #b98b4b;

    box-shadow:
    15px 25px 45px rgba(0,0,0,.65),
    inset 0 0 25px rgba(0,0,0,.4);

    transform-origin:left center;

    transition:
    transform 1.5s cubic-bezier(.7,0,.2,1),
    opacity 1s;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;

    color:#edcf91;
}

.cover:after{
    content:"";
    position:absolute;
    inset:14px;
    border:1px solid #b98b4b;
    border-radius:5px;
}

.cover.open{
    transform:rotateY(-110deg);
    opacity:0;
    pointer-events:none;
}

.cover-content{
    position:relative;
    z-index:2;
}

.cover-small{
    letter-spacing:7px;
    font-size:clamp(13px,2vw,20px);
}

.cover h1{
    font-size:clamp(50px,7vw,90px);
    margin:15px 0;
}

.cover-title{
    font-size:clamp(22px,3vw,36px);
    font-style:italic;
}

.ornament{
    font-size:32px;
    margin:25px 0;
}

.open-button{
    position:absolute;
    z-index:100;

    left:50%;
    bottom:-75px;

    transform:translateX(-50%);

    border:none;
    border-radius:30px;

    padding:15px 30px;

    background:#f4e5c7;

    color:#493221;

    font-weight:bold;
    font-size:15px;

    box-shadow:0 7px 20px #0008;

    cursor:pointer;
}

/* =========================
   OPEN BOOK
========================= */

.book-open{
    position:absolute;
    inset:0;

    opacity:0;
    pointer-events:none;

    transition:opacity .7s;
}

.book-open.visible{
    opacity:1;
    pointer-events:auto;
}

/* =========================
   SPREAD
========================= */

.spread{
    position:absolute;

    left:1%;
    right:1%;
    top:2%;
    bottom:8%;

    display:grid;

    grid-template-columns:1fr 1fr;

    background:#ead9b9;

    border-radius:10px;

    box-shadow:
    0 25px 45px #0009,
    inset 0 0 30px #76502d44;

    overflow:hidden;
}

/* paper */

.page{
    position:relative;

    height:100%;

    padding:
    clamp(25px,4vw,60px);

    background:
    radial-gradient(
        circle at 30% 25%,
        rgba(130,90,45,.09),
        transparent 30%
    ),
    linear-gradient(
        90deg,
        rgba(80,50,20,.10),
        transparent 10%,
        transparent 90%,
        rgba(80,50,20,.08)
    ),
    #f3e6cb;
}

.left-page{
    border-right:1px solid #bda47e;
    border-radius:10px 0 0 10px;
}

.right-page{
    border-radius:0 10px 10px 0;
}

/* center spine */

.spine{
    position:absolute;

    left:50%;
    top:0;
    bottom:0;

    width:24px;

    transform:translateX(-50%);

    z-index:10;

    background:
    linear-gradient(
        90deg,
        transparent,
        rgba(75,45,25,.35),
        rgba(255,255,255,.55),
        rgba(75,45,25,.25),
        transparent
    );

    pointer-events:none;
}

/* =========================
   LEFT PAGE
========================= */

.left-content{
    height:100%;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    text-align:center;
}

.photo-frame{
    width:min(70%,360px);
    aspect-ratio:4/5;

    background:#fff;

    padding:12px;

    box-shadow:
    0 12px 25px rgba(50,30,15,.25);

    transform:rotate(-1.5deg);

    margin-bottom:25px;
}

.photo{
    width:100%;
    height:100%;
    object-fit:cover;
}

.photo-placeholder{
    width:100%;
    height:100%;

    background:#d8c5a5;

    display:flex;
    justify-content:center;
    align-items:center;

    color:#80684e;

    font-size:16px;
}

.person-name{
    font-size:clamp(30px,4vw,52px);

    font-weight:normal;

    margin:5px 0 12px;
}

.person-line{
    font-size:13px;

    letter-spacing:4px;

    color:#80684e;
}

/* =========================
   RIGHT PAGE
========================= */

.right-content{
    height:100%;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    padding:5%;
}

.decor{
    font-size:25px;
    margin-bottom:25px;
}

.message{
    max-width:550px;

    font-size:clamp(17px,2vw,25px);

    line-height:1.8;

    color:#513b29;
}

.heart{
    margin:25px 0;

    font-size:24px;
}

.video-button{
    width:min(75%,350px);

    padding:18px;

    border:1px solid #b99a70;

    border-radius:8px;

    background:#ead8b8;

    color:#59422e;

    font-family:Georgia,serif;

    font-size:17px;

    cursor:pointer;

    box-shadow:
    0 5px 12px rgba(70,40,20,.12);
}

.video-button span{
    display:block;
    font-size:30px;
    margin-bottom:6px;
}

/* =========================
   PAGE NUMBER
========================= */

.page-number{
    position:absolute;

    bottom:20px;

    left:50%;

    transform:translateX(-50%);

    font-size:13px;

    letter-spacing:3px;

    color:#8a7052;
}

/* =========================
   NAVIGATION
========================= */

.navigation{
    position:absolute;

    left:0;
    right:0;

    bottom:-65px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    z-index:100;
}

.nav-button{
    border:1px solid #b89563;

    background:#3a2115;

    color:#f1d49b;

    padding:12px 25px;

    border-radius:30px;

    font-family:Georgia,serif;

    font-size:15px;

    cursor:pointer;
}

.nav-center{
    color:#e5c78e;

    letter-spacing:4px;

    font-size:14px;
}

/* =========================
   PAGE TURN
========================= */

.turn-page{
    position:absolute;

    z-index:30;

    left:50%;
    top:0;

    width:50%;
    height:100%;

    transform-origin:left center;

    transform-style:preserve-3d;

    display:none;

    transition:
    transform 1.2s cubic-bezier(.65,.05,.25,1);
}

.turn-page.flip{
    display:block;
    transform:rotateY(-180deg);
}

.turn-front,
.turn-back{
    position:absolute;

    inset:0;

    backface-visibility:hidden;

    background:#f3e6cb;

    padding:40px;

    box-shadow:
    inset 0 0 30px rgba(80,50,20,.15);
}

.turn-back{
    transform:rotateY(180deg);
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .book{
        width:96vw;
        height:72vh;
    }

    .cover{
        width:82%;
        left:9%;
    }

    .spread{
        top:1%;
        bottom:12%;
    }

    .page{
        padding:15px;
    }

    .photo-frame{
        width:82%;
        padding:7px;
        margin-bottom:15px;
    }

    .person-name{
        font-size:24px;
    }

    .person-line{
        font-size:8px;
        letter-spacing:2px;
    }

    .message{
        font-size:12px;
        line-height:1.55;
    }

    .decor{
        margin-bottom:10px;
    }

    .heart{
        margin:12px;
    }

    .video-button{
        width:90%;
        padding:10px;
        font-size:12px;
    }

    .video-button span{
        font-size:20px;
    }

    .navigation{
        bottom:-55px;
    }

    .nav-button{
        padding:8px 13px;
        font-size:11px;
    }

    .nav-center{
        font-size:9px;
        letter-spacing:2px;
    }
}
</style>
</head>

<body>

<div class="stage">

<div class="book">

<div class="book-shadow"></div>


<!-- =========================
     COVER
========================= -->

<div class="cover" id="cover">

<div class="cover-content">

<div class="cover-small">
FAREWELL
</div>

<h1>
2026
</h1>

<div class="cover-title">
Our Memories Together
</div>

<div class="ornament">

</div>

</div>

<button

onclick="openBook()">

</div>


<!-- =========================

<div class="book-open" id="bookOpen">

<div class="spread">

<!-- LEFT -->

<div class="page left-page">

id="leftContent">
</div>

</div>


<!-- RIGHT -->

<div class="page right-page">

<div class="right-content"
id="rightContent">
</div>

</div>


<div class="spine"></div>


<!-- REAL FLIPPING PAGE -->

<div class="turn-page"
id="turnPage">

<div class="turn-front"
id="turnFront">
</div>

<div class="turn-back"
id="turnBack">
</div>

</div>

</div>


<!-- NAVIGATION -->

<div class="navigation">

<button
class="nav-button"
onclick="previousPerson()">

← Previous

</button>


<div
class="nav-center"
id="counter">

1 / 15

</div>


<button
class="nav-button"
onclick="nextPerson()">

Next →

</button>

</div>

</div>

</div>

</div>


<script>

/* ======================================================
   STATE
====================================================== */

let current = 0;


/* ======================================================
   ELEMENTS
====================================================== */

const cover =
document.getElementById("cover");

const bookOpen =
document.getElementById("bookOpen");

const leftContent =
document.getElementById("leftContent");

const rightContent =
document.getElementById("rightContent");

const counter =
document.getElementById("counter");

const turnPage =
document.getElementById("turnPage");

const turnFront =
document.getElementById("turnFront");

const turnBack =
document.getElementById("turnBack");


/* ======================================================
   PHOTO
====================================================== */

function photoHTML(person){

    if(person.photo){

        return `
        <div class="photo-frame">
            <img
            class="photo"
            src="${person.photo}"
            alt="${person.name}">
        </div>
        `;

    }

    return `
    <div class="photo-frame">

        <div class="photo-placeholder">
            📷<br><br>
            Add photo here
        </div>

    </div>
    `;
}


/* ======================================================
   RENDER PERSON
====================================================== */

function renderPerson(){

    const person =
    people[current];


    /* LEFT PAGE */

    leftContent.innerHTML = `

        ${photoHTML(person)}

        <div class="person-name">
            ${person.name}
        </div>

        <div class="person-line">
            ${person.line}
        </div>

    `;


    /* RIGHT PAGE */

    let videoHTML = "";

    if(person.video){

        videoHTML = `

        <button
        class="video-button"
        onclick="window.open('${person.video}','_blank')">

            <span>▶</span>

            Watch Video

        </button>

        `;

    }else{

        videoHTML = `

        <button
        class="video-button"
        onclick="alert('Video coming soon ❤️')">

            <span>▶</span>

            Watch Video

        </button>

        `;

    }


    rightContent.innerHTML = `

        <div class="decor">
            ─── ♥ ───
        </div>

        <div class="message">
            ${person.message}
        </div>

        <div class="heart">
            ♥
        </div>

        ${videoHTML}

    `;


    counter.innerHTML =
    `${current + 1} / ${people.length}`;

}


/* ======================================================
   OPEN
====================================================== */

function openBook(){

    cover.classList.add("open");

    setTimeout(function(){

        bookOpen.classList.add("visible");

    },500);

    current = 0;

    renderPerson();

}


/* ======================================================
   NEXT
====================================================== */

function nextPerson(){

    if(current >= people.length - 1){

        return;

    }


    /* Save current spread */

    turnFront.innerHTML =
    rightContent.innerHTML;


    turnBack.innerHTML =
    leftContent.innerHTML;


    current++;


    /* Start page flip */

    turnPage.classList.remove("flip");

    void turnPage.offsetWidth;

    turnPage.classList.add("flip");


    setTimeout(function(){

        renderPerson();

        turnPage.classList.remove("flip");

    },1100);

}


/* ======================================================
   PREVIOUS
====================================================== */

function previousPerson(){

    if(current <= 0){

        return;

    }

    current--;

    renderPerson();

}


/* ======================================================
   START
====================================================== */

renderPerson();

</script>
