<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAI MEMORY BOOK</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    overflow-x: hidden;

    background: #2c2724;

    font-family: Georgia, "Times New Roman", serif;
    color: #3d3027;
}


/* =========================================================
   VARIABLES
========================================================= */

:root {

    --book-width: min(92vw, 1000px);
    --book-height: min(calc(92vw * .60), 600px);

    --page-width: calc(var(--book-width) / 2);

    --paper: #fdfbf7;
    --paper-alt: #f5f0eb;

    --brown: #604535;
    --brown-dark: #34271f;

    --gold: #c6a46a;

    --shadow:
        0 25px 60px rgba(0,0,0,.40),
        0 8px 20px rgba(0,0,0,.25);

    --flip-duration: 760ms;
}


/* =========================================================
   APPLICATION
========================================================= */

.book-app {

    width: 100%;
    min-height: 100vh;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    padding: 25px 15px;
}


/* =========================================================
   BOOK STAGE

   IMPORTANT:
   The stage itself NEVER changes dimensions while opening
   or flipping pages.

   This prevents the portrait -> landscape jump.
========================================================= */

.book-stage {

    position: relative;

    width: var(--book-width);
    height: var(--book-height);

    flex-shrink: 0;

    perspective: 1800px;
    perspective-origin: 50% 50%;

    transform-style: preserve-3d;

    isolation: isolate;
}


/* =========================================================
   OPEN BOOK
========================================================= */

.book-spread {

    position: absolute;

    inset: 0;

    display: grid;

    grid-template-columns: 1fr 1fr;

    overflow: hidden;

    background: var(--paper);

    border-radius: 5px;

    box-shadow: var(--shadow);

    transform-style: preserve-3d;

    z-index: 1;
}


/* =========================================================
   STATIC PAGE
========================================================= */

.book-page {

    position: relative;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background:
        linear-gradient(
            rgba(255,255,255,.18),
            rgba(255,255,255,.18)
        ),
        repeating-linear-gradient(
            0deg,
            rgba(100,70,40,.025) 0px,
            rgba(100,70,40,.025) 1px,
            transparent 1px,
            transparent 4px
        ),
        var(--paper);

    transform-style: preserve-3d;
}

.book-page.left {
    border-right: 1px solid rgba(70,50,35,.15);
}

.book-page.right {
    border-left: 1px solid rgba(70,50,35,.10);
}


.page-content {

    width: 100%;
    height: 100%;

    padding: clamp(25px, 4vw, 55px);
}


/* =========================================================
   SPINE
========================================================= */

.spine {

    position: absolute;

    top: 0;
    left: 50%;

    width: 18px;
    height: 100%;

    transform:
        translateX(-50%)
        translateZ(3px);

    pointer-events: none;

    z-index: 20;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(50,35,25,.12),
            rgba(50,35,25,.20),
            rgba(50,35,25,.08),
            transparent
        );
}


/* =========================================================
   PHYSICAL PAGE LEAF

   This is the important part.

   ONE physical sheet
   TWO physical faces
========================================================= */

.page-leaf {

    position: absolute;

    top: 0;

    width: var(--page-width);
    height: var(--book-height);

    display: none;

    pointer-events: none;

    transform-style: preserve-3d;

    will-change: transform;

    z-index: 300;

    contain: layout style paint;
}


/* RIGHT PAGE TURNING LEFT */

.page-leaf.next {

    left: 50%;

    transform-origin: left center;

    transform:
        rotateY(0deg)
        translateZ(8px);
}


/* LEFT PAGE TURNING RIGHT */

.page-leaf.previous {

    left: 0;

    transform-origin: right center;

    transform:
        rotateY(0deg)
        translateZ(8px);
}


/* =========================================================
   PAGE FACES

   NEVER allow the opposite face to bleed through.
========================================================= */

.page-front,
.page-back {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: var(--paper);

    transform-style: preserve-3d;

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;

    will-change: transform;

    isolation: isolate;
}


/* Front */

.page-front {

    transform:
        rotateY(0deg)
        translateZ(.1px);
}


/* Back */

.page-back {

    transform:
        rotateY(180deg)
        translateZ(.1px);

    background: var(--paper);
}


/* =========================================================
   FLIP SHADOW

   Uses opacity only.
   No filter.
   No repaint-heavy brightness animation.
========================================================= */

.page-leaf::after {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    z-index: 20;

    background:
        linear-gradient(
            90deg,
            transparent 20%,
            rgba(0,0,0,.16) 50%,
            transparent 80%
        );

    opacity: 0;

    transition:
        opacity var(--flip-duration) ease;

    will-change: opacity;
}


/* =========================================================
   ANIMATION STATES

   JavaScript controls the transform directly.
========================================================= */

.page-leaf.flipping {

    display: block;
}


/* =========================================================
   COVER

   Exactly one page wide.
========================================================= */

.cover {

    position: absolute;

    top: 0;
    left: 50%;

    width: var(--page-width);
    height: var(--book-height);

    transform-origin: left center;

    transform-style: preserve-3d;

    will-change: transform;

    z-index: 400;

    border-radius: 4px;

    background: var(--brown);

    box-shadow:
        10px 18px 35px rgba(0,0,0,.40);

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;

    transition:
        transform 900ms cubic-bezier(.22,.61,.36,1);
}


/* Closed */

.cover.closed {

    transform:
        translateX(0)
        rotateY(0deg);
}


/* Open */

.cover.open {

    transform:
        translateX(-100%)
        rotateY(-180deg);
}


/* =========================================================
   COVER FACES
========================================================= */

.cover-face {

    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 28px;

    transform-style: preserve-3d;

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
}


.cover-front {

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.05),
            transparent 35%,
            rgba(0,0,0,.10)
        ),
        var(--brown);

    color: #f5e9da;
}


.cover-back {

    background: var(--paper-alt);

    color: var(--brown);

    transform:
        rotateY(180deg);
}


/* =========================================================
   COVER DESIGN
========================================================= */

.cover-frame {

    width: 100%;
    height: 100%;

    border: 1px solid rgba(255,255,255,.20);

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;
}


.cover-eyebrow {

    font-family: Arial, sans-serif;

    font-size: 10px;

    letter-spacing: .28em;

    opacity: .75;

    margin-bottom: 18px;
}


.cover-title {

    margin: 0;

    font-size: clamp(27px,4vw,48px);

    font-weight: normal;

    letter-spacing: .08em;
}


.cover-subtitle {

    margin-top: 15px;

    font-size: 14px;

    letter-spacing: .18em;

    opacity: .85;
}


.cover-heart {

    margin-top: 25px;

    font-size: 25px;
}


/* =========================================================
   OPEN BOOK BUTTON
========================================================= */

.open-book-button {

    position: absolute;

    bottom: 35px;
    left: 50%;

    transform:
        translateX(-50%);

    border: 1px solid rgba(255,255,255,.35);

    background: rgba(255,255,255,.10);

    color: #fff5e9;

    padding: 11px 20px;

    font-family: Arial, sans-serif;

    font-size: 10px;

    letter-spacing: .16em;

    cursor: pointer;

    transition:
        background .2s ease,
        transform .2s ease;
}

.open-book-button:hover {

    background: rgba(255,255,255,.20);

    transform:
        translateX(-50%)
        translateY(-1px);
}


/* =========================================================
   INTRO
========================================================= */

.intro-left {

    width: 100%;
    height: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;
}


.intro-left .memory-word {

    font-size: clamp(30px,4vw,50px);

    letter-spacing: .12em;

    color: var(--brown);
}


.intro-left .decor {

    margin-top: 20px;

    color: #9d8168;

    letter-spacing: .3em;
}


.intro-right {

    width: 100%;
    height: 100%;

    display: flex;

    flex-direction: column;

    justify-content: center;
}


.eyebrow {

    font-family: Arial, sans-serif;

    font-size: 10px;

    letter-spacing: .25em;

    color: #92755d;

    margin-bottom: 15px;
}


.intro-title {

    margin: 0 0 20px;

    font-size: clamp(28px,4vw,46px);

    font-weight: normal;
}


.intro-copy {

    max-width: 440px;

    font-size: 16px;

    line-height: 1.8;

    color: #6b5645;
}


/* =========================================================
   PERSON LEFT
========================================================= */

.person-left {

    width: 100%;
    height: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;
}


/* =========================================================
   POLAROID
========================================================= */

.polaroid {

    position: relative;

    width: min(42%,220px);

    min-width: 145px;

    aspect-ratio: 4 / 5;

    padding: 9px 9px 34px;

    background: #fffdf8;

    box-shadow:
        0 12px 25px rgba(50,35,25,.22),
        0 2px 5px rgba(50,35,25,.12);

    transform: rotate(-2deg);
}


.polaroid::before {

    content: "";

    position: absolute;

    top: -9px;
    left: 50%;

    width: 65px;
    height: 18px;

    transform:
        translateX(-50%)
        rotate(-2deg);

    background: rgba(207,183,148,.78);

    z-index: 5;
}


.polaroid-image {

    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;

    background:
        linear-gradient(
            135deg,
            #e9ddcd,
            #cdb79c
        );
}


.photo-placeholder {

    width: 100%;
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            135deg,
            #eadfce,
            #cdb89f
        );

    color: #806b58;

    font-family: Arial, sans-serif;

    font-size: 10px;

    letter-spacing: .12em;
}


.person-name {

    margin: 18px 0 6px;

    font-size: clamp(20px,2.5vw,30px);

    font-weight: normal;
}


.person-divider {

    color: #a1775d;

    margin: 3px 0 10px;

    letter-spacing: .2em;
}


.tags {

    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    gap: 6px;
}


.tag {

    border: 1px solid rgba(96,69,53,.25);

    border-radius: 20px;

    padding: 5px 9px;

    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: .08em;

    color: #705b49;
}


/* =========================================================
   PERSON RIGHT
========================================================= */

.person-right {

    width: 100%;
    height: 100%;

    display: flex;

    flex-direction: column;

    justify-content: center;
}


.tribute {

    max-width: 450px;

    margin: 0;

    font-size: 1rem;

    line-height: 1.6;

    color: #49382d;
}


.small-divider {

    width: 65px;
    height: 1px;

    margin: 22px 0;

    background: rgba(96,69,53,.30);
}


/* =========================================================
   VIDEO
========================================================= */

.video-card {

    width: min(100%,390px);

    min-height: 105px;

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 15px;

    border: 1px solid rgba(96,69,53,.22);

    background: rgba(255,255,255,.48);

    cursor: pointer;

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}


.video-card:hover {

    transform: translateY(-2px);

    box-shadow:
        0 10px 22px rgba(50,35,25,.13);
}


.play {

    width: 42px;
    height: 42px;

    border-radius: 50%;

    background: var(--brown);

    color: #fff;

    display: flex;

    align-items: center;
    justify-content: center;

    font-family: Arial, sans-serif;

    padding-left: 2px;
}


.video-text {

    display: flex;

    flex-direction: column;

    gap: 4px;
}


.video-text strong {

    font-weight: normal;

    font-size: 14px;
}


.video-text span {

    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: .12em;

    color: #8b725c;
}


/* =========================================================
   NAVIGATION
========================================================= */

.controls {

    margin-top: 22px;

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 7px;

    padding: 8px 24px;

    background: rgba(30,26,23,.95);

    border-radius: 30px;

    box-shadow:
        0 8px 25px rgba(0,0,0,.30);

    opacity: 1;

    transition:
        opacity .25s ease;
}


.controls button {

    border: 0;

    background: transparent;

    color: #f5f0eb;

    font-family: Arial, sans-serif;

    font-weight: 500;

    font-size: .95rem;

    padding: 9px 13px;

    border-radius: 20px;

    cursor: pointer;

    transition:
        background .2s ease,
        color .2s ease;
}


.controls button:hover:not(:disabled) {

    background: rgba(255,255,255,.10);

    color: #fff;
}


.controls button:disabled {

    opacity: .35;

    cursor: default;
}


.spread-counter {

    min-width: 105px;

    text-align: center;

    color: #d8bb7d;

    font-family: Arial, sans-serif;

    font-size: .85rem;

    font-weight: 500;
}


/* =========================================================
   CLOSED BOOK

   Hide the entire open-book layer behind the cover.
========================================================= */

body.closed .book-spread,
body.closed .spine,
body.closed .page-leaf {

    visibility: hidden;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width:700px) {

    :root {

        --book-width: 94vw;

        --book-height: calc(94vw * .60);
    }

    .book-app {

        padding: 20px 8px;
    }

    .page-content {

        padding: 20px;
    }

    .polaroid {

        width: 48%;
    }

    .tribute {

        font-size: .88rem;
    }

    .video-card {

        min-height: 80px;
    }

    .controls {

        padding: 6px 10px;
    }

    .controls button {

        font-size: .75rem;

        padding: 8px;
    }

    .spread-counter {

        min-width: 75px;

        font-size: .7rem;
    }
}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    .cover {

        transition-duration: 1ms;
    }

}

</style>
</head>

/* =========================================================

        return `

                    </h2>

                    <p class="intro-copy">

                        Every chapter has a story...

                        <br><br>

                        And you made ours special.

                        <br><br>

                        A collection of memories,
                        laughter and moments we'll
                        always carry with us.

                    </p>

                </div>

            </div>

        `;
    }


    const person = spread.person;


    return `

        <div class="page-content">

            <div class="person-right">

                <div class="eyebrow">
                    A MEMORY FOR YOU
                </div>


                <p class="tribute">
                    ${person.message}
                </p>


                <div class="small-divider"></div>


                <div
                    class="video-card"
                    data-video="${person.video || ""}"
                    onclick="watchVideo(this)"
                >

                    <div class="play">
                        ▶
                    </div>


                    <div class="video-text">

                        <strong>
                            Watch Video
                        </strong>

                        <span>
                            A LITTLE MOMENT TO REMEMBER
                        </span>

                    </div>

                </div>

            </div>

        </div>

    `;
}


/* =========================================================
   RENDER SPREAD
========================================================= */

function renderSpread(index) {

    const spread = spreads[index];

    if (!spread) return;


    leftPage.innerHTML =
        leftPageHTML(spread);


    rightPage.innerHTML =
        rightPageHTML(spread);


    updateNavigation();
}


/* =========================================================
   NAVIGATION
========================================================= */

function updateNavigation() {

    spreadCounter.textContent =
        `Spread ${currentSpread} of ${spreads.length - 1}`;


    previousButton.disabled =
        !bookOpen ||
        currentSpread === 0;


    closeButton.disabled =
        !bookOpen;


    if (
        currentSpread ===
        spreads.length - 1
    ) {

        nextButton.textContent =
            "Close Book";

    } else {

        nextButton.textContent =
            "Next →";
    }


    nextButton.disabled =
        !bookOpen;
}


/* =========================================================
   OPEN BOOK
========================================================= */

function openBook() {

    if (animating || bookOpen) return;


    animating = true;


    currentSpread = 0;

    renderSpread(currentSpread);


    document.body.classList.remove("closed");


    cover.classList.remove("closed");
    cover.classList.remove("open");


    /*
       Force browser to recognize the starting state
       before starting the transition.
    */

    void cover.offsetWidth;


    requestAnimationFrame(() => {

        cover.classList.add("open");

    });


    cover.addEventListener(
        "transitionend",
        finishOpening,
        { once: true }
    );
}


function finishOpening(event) {

    if (
        event.propertyName !== "transform"
    ) return;


    bookOpen = true;

    animating = false;


    cover.classList.remove("closed");

    cover.classList.add("open");


    updateNavigation();
}


/* =========================================================
   CLOSE BOOK
========================================================= */

function closeBook() {

    if (
        animating ||
        !bookOpen
    ) return;


    animating = true;


    cover.classList.remove("open");


    void cover.offsetWidth;


    requestAnimationFrame(() => {

        cover.classList.add("closed");

    });


    cover.addEventListener(
        "transitionend",
        finishClosing,
        { once: true }
    );
}


function finishClosing(event) {

    if (
        event.propertyName !== "transform"
    ) return;


    bookOpen = false;

    animating = false;


    currentSpread = 0;


    pageLeaf.className =
        "page-leaf";


    pageFront.innerHTML = "";
    pageBack.innerHTML = "";


    document.body.classList.add("closed");


    cover.classList.remove("open");
    cover.classList.add("closed");


    renderSpread(0);

    updateNavigation();
}


/* =========================================================
   START PAGE TURN
========================================================= */

function turnSpread(direction) {

    if (
        animating ||
        !bookOpen
    ) return;


    const destinationIndex =
        direction === "next"

            ? currentSpread + 1

            : currentSpread - 1;


    if (
        destinationIndex < 0 ||
        destinationIndex >= spreads.length
    ) return;


    animating = true;


    /*
       ----------------------------------------------------
       IMPORTANT:

       Build BOTH physical faces BEFORE animation.

       NEXT:
       front = current RIGHT page
       back  = destination LEFT page

       PREVIOUS:
       front = current LEFT page
       back  = destination RIGHT page
       ----------------------------------------------------
    */

    if (direction === "next") {

        pageFront.innerHTML =
            rightPageHTML(
                spreads[currentSpread]
            );


        pageBack.innerHTML =
            leftPageHTML(
                spreads[destinationIndex]
            );


        pageLeaf.className =
            "page-leaf next flipping";


        pageLeaf.style.zIndex = "500";


        void pageLeaf.offsetWidth;


        requestAnimationFrame(() => {

            pageLeaf.style.transform =
                "rotateY(-180deg) translateZ(8px)";

            pageLeaf.style.setProperty(
                "--flip-direction",
                "-1"
            );

            pageLeaf.classList.add(
                "flip-shadow"
            );

        });

    } else {

        pageFront.innerHTML =
            leftPageHTML(
                spreads[currentSpread]
            );


        pageBack.innerHTML =
            rightPageHTML(
                spreads[destinationIndex]
            );


        pageLeaf.className =
            "page-leaf previous flipping";


        pageLeaf.style.zIndex = "500";


        void pageLeaf.offsetWidth;


        requestAnimationFrame(() => {

            pageLeaf.style.transform =
                "rotateY(180deg) translateZ(8px)";

            pageLeaf.classList.add(
                "flip-shadow"
            );

        });

    }


    pageLeaf.addEventListener(
        "transitionend",
        function finishPageTurn(event) {

            if (
                event.propertyName !==
                "transform"
            ) return;


            currentSpread =
                destinationIndex;


            /*
               Remove physical sheet.
               Then render the new permanent spread.
            */

            pageLeaf.style.transform =
                "";


            pageLeaf.className =
                "page-leaf";


            pageLeaf.style.zIndex =
                "";


            pageFront.innerHTML = "";
            pageBack.innerHTML = "";


            renderSpread(
                currentSpread
            );


            animating = false;

        },
        {
            once: true
        }
    );
}


/* =========================================================
   NEXT
========================================================= */

function nextSpread() {

    if (
        !bookOpen ||
        animating
    ) return;


    /*
       Person 15 -> physically close book.
    */

    if (
        currentSpread ===
        spreads.length - 1
    ) {

        closeBook();

        return;
    }


    turnSpread("next");
}


/* =========================================================
   PREVIOUS
========================================================= */

function previousSpread() {

    if (
        !bookOpen ||
        animating
    ) return;


    if (
        currentSpread === 0
    ) return;


    turnSpread("previous");
}


/* =========================================================
   VIDEO
========================================================= */

function watchVideo(card) {

    const url =
        card.dataset.video;


    if (!url) {

        alert(
            "Add this person's video URL in the people array."
        );

        return;
    }


    window.open(
        url,
        "_blank",
        "noopener,noreferrer"
    );
}


/* =========================================================
   BUTTONS
========================================================= */

openButton.addEventListener(
    "click",
    openBook
);


previousButton.addEventListener(
    "click",
    previousSpread
);


nextButton.addEventListener(
    "click",
    nextSpread
);


closeButton.addEventListener(
    "click",
    closeBook
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "ArrowRight"
        ) {

            nextSpread();
        }


        if (
            event.key === "ArrowLeft"
        ) {

            previousSpread();
        }


        if (
            event.key === "Escape"
        ) {

            closeBook();
        }

    }
);


/* =========================================================
   INITIAL STATE
========================================================= */

renderSpread(0);

document.body.classList.add("closed");

cover.classList.add("closed");

updateNavigation();

</script>

</body>
</html>
