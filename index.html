<style>
*{

}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
}

body{
  background:

  color:#3c3029;
  font-family:Georgia,"Times New Roman",serif;
  overflow-x:hidden;
}

/* WOOD GRAIN */
body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.18;
  background:
    repeating-linear-gradient(
      7deg,
      transparent 0px,
      transparent 9px,

      transparent 12px

}

/* =========================
   MAIN SCENE
========================= */

.scene{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:30px 12px 24px;
}

.book-wrap{
  width:min(1100px,96vw);
  position:relative;
}

/* shadow under entire book */
.book-shadow{
  position:absolute;
  left:3%;
  right:3%;
  bottom:-28px;
  height:45px;
  background:rgba(0,0,0,.48);
  filter:blur(18px);
  border-radius:50%;
}

/* =========================
   LEATHER BOOK
========================= */

.book-frame{
  position:relative;
  padding:18px;
  border-radius:12px;

  background:
    linear-gradient(
      90deg,
      #17100d 0%,
      #4b3022 4%,
      #241610 9%,
      #17100d 50%,
      #241610 91%,
      #4b3022 96%,
      #17100d 100%
    );

  box-shadow:
    0 22px 45px rgba(0,0,0,.55),
    inset 0 0 0 2px rgba(255,255,255,.04),
    inset 0 0 0 5px rgba(0,0,0,.35);
}

.book{
  position:relative;
  width:100%;
  aspect-ratio:2 / 1.18;
  display:grid;
  grid-template-columns:1fr 1fr;
  overflow:hidden;
  border-radius:5px;

  background:#eee1c5;

  box-shadow:
    inset 0 0 20px rgba(70,45,25,.18);
}

/* =========================
   PAPER
========================= */

.page{
  position:relative;
  overflow:hidden;
  min-width:0;

  background:
    radial-gradient(
      ellipse at center,
      rgba(255,255,255,.5),
      transparent 65%
    ),

    inset 0 0 35px rgba(89,61,33,.08);
}

/* left/right subtle paper edge */
.page.left{
  border-right:1px solid rgba(86,62,40,.08);
}

.page.right{
  border-left:1px solid rgba(86,62,40,.06);
}

/* =========================
   CENTER GUTTER
========================= */

.gutter{
  position:absolute;
  top:0;
  bottom:0;
  left:50%;
  width:34px;
  transform:translateX(-50%);
  z-index:8;
  pointer-events:none;

  background:
    linear-gradient(
      90deg,
      rgba(70,45,25,.03),
      rgba(55,35,20,.15),
      rgba(255,255,255,.08),
      rgba(55,35,20,.14),
      rgba(70,45,25,.03)

  filter:blur(.2px);
}

/* =========================
   PAGE CONTENT
========================= */

.page-inner{

  inset:0;
  padding:7% 9%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

  font-size:11px;
  letter-spacing:2px;
  color:#9a8972;
}

.page.left .page-number{
  left:20px;
}

.page.right .page-number{

}

/* =========================
   INTRO
========================= */

.message-divider{

.play-button{

/* =========================

.signature{

/* =========================
   FLIP PAGE
========================= */

.flip-page{
  position:absolute;
  top:0;
  bottom:0;
  width:50%;

  z-index:30;

  display:none;

  transform-style:preserve-3d;

  /* VERY IMPORTANT */
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;

  background:#f3e5c9;

  box-shadow:
    0 0 18px rgba(40,25,15,.20);
}

.flip-page.next{
  right:0;
  transform-origin:left center;
}

.flip-page.previous{
  left:0;
  transform-origin:right center;
}

.flip-page.active{
  display:block;
}

/* both faces */
.flip-face{
  position:absolute;
  inset:0;

  overflow:hidden;

  background:
    radial-gradient(
      ellipse at center,
      rgba(255,255,255,.55),
      transparent 68%
    ),
    linear-gradient(
      90deg,
      #eee0c2,
      #fff8e7 50%,
      #ecddbd
    );

  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
}

.flip-face.back{
  transform:rotateY(180deg);
}

.flip-page.animate-next{
  animation:turnNext 1.05s cubic-bezier(.22,.7,.25,1) forwards;
}

.flip-page.animate-prev{
  animation:turnPrev 1.05s cubic-bezier(.22,.7,.25,1) forwards;
}

@keyframes turnNext{
  0%{
    transform:rotateY(0deg);
  }

  45%{
    box-shadow:
      -12px 0 24px rgba(30,20,12,.28);
  }

  100%{
    transform:rotateY(-180deg);
    box-shadow:
      0 0 0 rgba(0,0,0,0);
  }
}

@keyframes turnPrev{
  0%{
    transform:rotateY(0deg);
  }

  45%{
    box-shadow:
      12px 0 24px rgba(30,20,12,.28);
  }

  100%{
    transform:rotateY(180deg);
    box-shadow:
      0 0 0 rgba(0,0,0,0);
  }
}

/* =====================================================

===================================================== */

function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

/* =====================================================
   RENDER SPREAD
===================================================== */

function renderSpread(index){

  const left = document.getElementById("leftPage");
  const right = document.getElementById("rightPage");

  /* INTRO */
  if(index === 0){

    left.innerHTML = introLeft();
    right.innerHTML = introRight();

  }

  /* PEOPLE */
  else if(index >= 1 && index <= people.length){

    const person = people[index - 1];

    const leftNumber = 3 + ((index - 1) * 2);
    const rightNumber = leftNumber + 1;

    left.innerHTML =
      personLeft(person,leftNumber);

    right.innerHTML =
      personRight(person,rightNumber);

  }

  /* OUTRO */
  else{

    left.innerHTML = outroLeft();
    right.innerHTML = outroRight();

  }

  updateNavigation();
}


/* =====================================================
   NAVIGATION STATE
===================================================== */

function updateNavigation(){

  document.getElementById("prevBtn").disabled =
    currentSpread === 0 || animating;

  document.getElementById("nextBtn").disabled =
    currentSpread === totalSpreads - 1 || animating;
}


/* =====================================================
   NEXT SPREAD
===================================================== */

function nextSpread(){

  if(
    animating ||
    currentSpread >= totalSpreads - 1
  ){
    return;
  }

  animating = true;

  const flipPage =
    document.getElementById("flipPage");

  const flipFront =
    document.getElementById("flipFront");

  /*
    Copy the CURRENT right page.

    The page itself becomes the physical leaf
    that turns from right → left.
  */

  flipFront.innerHTML =
    document.getElementById("rightPage").innerHTML;

  flipPage.className =
    "flip-page next active animate-next";

  /*
    Change underlying spread slightly after
    the leaf reaches the middle.

    At that moment the flipping leaf is edge-on,
    preventing old content from bleeding through.
  */

  setTimeout(()=>{

    currentSpread++;

    renderSpread(currentSpread);

  },520);


  /*
    Remove the physical turning leaf after
    the animation has completely finished.
  */

  setTimeout(()=>{

    flipPage.className =
      "flip-page";

    flipFront.innerHTML = "";

    animating = false;

    updateNavigation();

  },1080);

}


/* =====================================================
   PREVIOUS SPREAD
===================================================== */

function previousSpread(){

  if(
    animating ||
    currentSpread <= 0
  ){
    return;
  }

  animating = true;

  const flipPage =
    document.getElementById("flipPage");

  const flipFront =
    document.getElementById("flipFront");

  /*
    Copy CURRENT left page.

    It turns from left → right.
  */

  flipFront.innerHTML =
    document.getElementById("leftPage").innerHTML;

  flipPage.className =
    "flip-page previous active animate-prev";


  setTimeout(()=>{

    currentSpread--;

    renderSpread(currentSpread);

  },520);


  setTimeout(()=>{

    flipPage.className =
      "flip-page";

    flipFront.innerHTML = "";

    animating = false;

    updateNavigation();

  },1080);

}
