<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Farewell 2026 ❤️</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Georgia, "Times New Roman", serif;
    background: #f6efe5;
    color: #3d2b24;
    overflow-x: hidden;
}

/* ---------- COVER ---------- */

.cover {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 30px;
    background:
        radial-gradient(circle at top, #fffaf3, #ead9c5);
}

.cover-box {
    max-width: 700px;
    padding: 50px 30px;
}

.small-title {
    letter-spacing: 5px;
    font-size: 15px;
    margin-bottom: 20px;
}

.cover h1 {
    font-size: clamp(55px, 12vw, 110px);
    letter-spacing: 5px;
    font-weight: normal;
    margin-bottom: 15px;
}

.cover h2 {
    font-size: clamp(22px, 5vw, 40px);
    font-weight: normal;
    margin-bottom: 40px;
}

.heart {
    color: #b45f68;
}

.open-btn {
    border: 1px solid #3d2b24;
    background: transparent;
    padding: 16px 35px;
    font-family: inherit;
    font-size: 16px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: 0.3s;
}

.open-btn:hover {
    background: #3d2b24;
    color: white;
    transform: scale(1.05);
}

/* ---------- MEMORY BOOK ---------- */

#memorySection {
    display: none;
    min-height: 100vh;
    padding: 50px 20px;
}

.header {
    text-align: center;
    margin-bottom: 40px;
}

.header h2 {
    font-size: 42px;
    font-weight: normal;
}

.header p {
    margin-top: 10px;
    opacity: 0.7;
}

/* ---------- PERSON CARD ---------- */

.book {
    max-width: 900px;
    margin: auto;
}

.person-card {
    background: #fffaf4;
    border-radius: 5px;
    box-shadow: 0 15px 40px rgba(70, 45, 30, 0.15);
    padding: 35px;
    text-align: center;
    animation: pageIn 0.6s ease;
}

@keyframes pageIn {
    from {
        opacity: 0;
        transform: translateX(40px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

.person-number {
    font-size: 14px;
    letter-spacing: 3px;
    opacity: 0.6;
    margin-bottom: 10px;
}

.person-name {
    font-size: 40px;
    font-weight: normal;
    margin-bottom: 25px;
}

.photo-frame {
    width: min(100%, 600px);
    margin: auto;
    overflow: hidden;
    border-radius: 4px;
    background: #eadfd2;
}

.photo-frame img {
    width: 100%;
    display: block;
    max-height: 600px;
    object-fit: cover;
}

.message {
    max-width: 650px;
    margin: 30px auto;
    font-size: 20px;
    line-height: 1.7;
    font-style: italic;
}

/* ---------- VIDEO ---------- */

.video-box {
    margin: 30px auto;
    max-width: 650px;
    padding: 30px;
    background: #f1e7db;
    border-radius: 5px;
}

.video-icon {
    font-size: 45px;
    margin-bottom: 10px;
}

.video-box h3 {
    font-size: 22px;
    font-weight: normal;
    margin-bottom: 8px;
}

.video-box p {
    opacity: 0.65;
}

/* ---------- NAVIGATION ---------- */

.navigation {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    margin-top: 35px;
}

.nav-btn {
    background: #3d2b24;
    color: white;
    border: none;
    padding: 13px 24px;
    cursor: pointer;
    font-family: inherit;
    border-radius: 3px;
}

.nav-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
}

.page-count {
    min-width: 80px;
    text-align: center;
}

/* ---------- FINAL PAGE ---------- */

.final-page {
    display: none;
    text-align: center;
    padding: 80px 20px;
    animation: pageIn 0.7s ease;
}

.final-page h2 {
    font-size: 55px;
    font-weight: normal;
    margin-bottom: 20px;
}

.final-page p {
    font-size: 22px;
    line-height: 1.7;
}

.big-heart {
    font-size: 70px;
    margin: 30px;
}

/* ---------- FLOATING HEARTS ---------- */

.floating-heart {
    position: fixed;
    bottom: -30px;
    font-size: 20px;
    animation: floatHeart 5s linear forwards;
    pointer-events: none;
    z-index: 10;
}

@keyframes floatHeart {
    0% {
        transform: translateY(0) rotate(0);
        opacity: 0;
    }

    15% {
        opacity: 1;
    }

    100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

/* ---------- MOBILE ---------- */

@media (max-width: 600px) {

    .cover-box {
        padding: 30px 15px;
    }

    .cover h1 {
        font-size: 55px;
    }

    .cover h2 {
        font-size: 23px;
    }

    #memorySection {
        padding: 30px 12px;
    }

    .header h2 {
        font-size: 32px;
    }

    .person-card {
        padding: 20px 15px;
    }

    .person-name {
        font-size: 32px;
    }

    .message {
        font-size: 17px;
    }

    .navigation {
        gap: 10px;
    }

    .nav-btn {
        padding: 11px 16px;
    }

    .final-page h2 {
        font-size: 40px;
    }
}
</style>
</head>

<body>

<!-- ================= COVER ================= -->

<section class="cover" id="cover">

    <div class="cover-box">

        <div class="small-title">
            FAREWELL 2026
        </div>

        <h1>
            OUR<br>
            MEMORIES
        </h1>

        <h2>
            Together <span class="heart">♥</span>
        </h2>

        <button class="open-btn" onclick="openBook()">
            OPEN MEMORY BOOK
        </button>

    </div>

</section>


<!-- ================= MEMORY SECTION ================= -->

<section id="memorySection">

    <div class="header">

        <div class="small-title">
            FAREWELL 2026
        </div>

        <h2>
            Our Memories Together
            <span class="heart">♥</span>
        </h2>

        <p>
            Every person. Every memory. Every moment.
        </p>

    </div>


    <div class="book">

        <div id="personCard" class="person-card">

            <!-- Content generated by JavaScript -->

        </div>


        <div class="navigation">

            <button
                class="nav-btn"
                id="previousBtn"
                onclick="previousPerson()">
                ← Previous
            </button>

            <div class="page-count" id="pageCount">
                1 / 1
            </div>

            <button
                class="nav-btn"
                id="nextBtn"
                onclick="nextPerson()">
                Next →
            </button>

        </div>


        <div class="final-page" id="finalPage">

            <div class="big-heart">❤️</div>

            <h2>
                THE END
            </h2>

            <p>
                But the memories<br>
                will stay forever.
            </p>

            <p style="margin-top:25px;">
                ✨ Farewell 2026 ✨
            </p>

        </div>

    </div>

</section>


<script>

/* ==================================================
   YOUR PEOPLE
   ==================================================

   You only need to edit this section later.

   For now, replace the names and messages.

   Photos will be added later.
   Videos will be added later.
================================================== */

const people = [

    {
        name: "Sai",
        photo: "",
        message:
        "Some people make our journey beautiful simply by being part of it. ❤️"
    },

    {
        name: "Person 2",
        photo: "",
        message:
        "The memories we created together will always have a special place in our hearts."
    },

    {
        name: "Person 3",
        photo: "",
        message:
        "Goodbyes are not the end. They are the beginning of a new journey."
    },

    {
        name: "Person 4",
        photo: "",
        message:
        "Thank you for all the laughter, memories and beautiful moments."
    }

];


/* ==================================================
   WEBSITE LOGIC
================================================== */

let currentPerson = 0;


/* OPEN BOOK */

function openBook() {

    document.getElementById("cover").style.display = "none";

    document.getElementById("memorySection").style.display = "block";

    showPerson(0);

    startHearts();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* SHOW PERSON */

function showPerson(index) {

    currentPerson = index;

    const person = people[index];

    const card = document.getElementById("personCard");

    let photoHTML = "";

    if (person.photo !== "") {

        photoHTML = `
            <div class="photo-frame">
                <img
                    src="${person.photo}"
                    alt="${person.name}"
                >
            </div>
        `;

    } else {

        photoHTML = `
            <div class="photo-frame"
                 style="
                    height:280px;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    font-size:22px;
                    opacity:.6;
                 ">
                📸 Photo coming soon
            </div>
        `;

    }


    card.innerHTML = `

        <div class="person-number">
            MEMORY ${index + 1}
        </div>

        <div class="person-name">
            ${person.name}
        </div>

        ${photoHTML}

        <div class="message">
            "${person.message}"
        </div>

        <div class="video-box">

            <div class="video-icon">
                🎥
            </div>

            <h3>
                Video coming soon
            </h3>

            <p>
                This beautiful memory will be added here.
            </p>

        </div>

    `;


    document.getElementById("pageCount").innerText =
        `${index + 1} / ${people.length}`;


    document.getElementById("previousBtn").disabled =
        index === 0;


    document.getElementById("nextBtn").disabled =
        index === people.length - 1;


    document.getElementById("finalPage").style.display = "none";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* NEXT */

function nextPerson() {

    if (currentPerson < people.length - 1) {

        showPerson(currentPerson + 1);

    } else {

        showFinalPage();

    }

}


/* PREVIOUS */

function previousPerson() {

    if (currentPerson > 0) {

        showPerson(currentPerson - 1);

    }

}


/* FINAL PAGE */

function showFinalPage() {

    document.getElementById("personCard").style.display = "none";

    document.querySelector(".navigation").style.display = "none";

    document.getElementById("finalPage").style.display = "block";

    createConfetti();

}


/* FLOATING HEARTS */

function createHeart() {

    const heart = document.createElement("div");

    heart.className = "floating-heart";

    heart.innerHTML = Math.random() > 0.5 ? "♥" : "♡";

    heart.style.left =
        Math.random() * 100 + "vw";

    heart.style.fontSize =
        (15 + Math.random() * 20) + "px";

    heart.style.animationDuration =
        (4 + Math.random() * 4) + "s";

    document.body.appendChild(heart);

    setTimeout(() => {

        heart.remove();

    }, 8000);

}


function startHearts() {

    setInterval(() => {

        createHeart();

    }, 1200);

}


/* SIMPLE CONFETTI */

function createConfetti() {

    for (let i = 0; i < 80; i++) {

        const confetti =
            document.createElement("div");

        confetti.style.position = "fixed";

        confetti.style.width = "8px";

        confetti.style.height = "8px";

        confetti.style.background =
            ["#b45f68", "#d7a46d", "#7b8f8a", "#9b7e6b"]
            [Math.floor(Math.random() * 4)];

        confetti.style.left =
            Math.random() * 100 + "vw";

        confetti.style.top = "-10px";

        confetti.style.zIndex = "100";

        document.body.appendChild(confetti);

        const duration =
            2000 + Math.random() * 3000;

        confetti.animate(
            [
                {
                    transform: "translateY(0) rotate(0deg)"
                },
                {
                    transform:
                        `translateY(110vh) rotate(${Math.random() * 1000}deg)`
                }
            ],
            {
                duration: duration,
                easing: "linear"
            }
        );

        setTimeout(() => {
            confetti.remove();
        }, duration);

    }

}


/* KEYBOARD NAVIGATION */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "ArrowRight") {

            nextPerson();

        }

        if (event.key === "ArrowLeft") {

            previousPerson();

        }

    }
);

</script>

</body>
</html>
