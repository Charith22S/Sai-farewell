<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SAI MEMORY BOOK</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  min-height: 100%;
}

body {
  background:
    radial-gradient(
      circle at center,
      #403731 0%,
      #2b2623 70%
    );

  color: #342a25;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  overflow-x: hidden;
}


/* =========================================================
   RESPONSIVE BOOK VARIABLES
========================================================= */

:root {

  --book-width:
    min(92vw, 1000px);

  --book-height:
    min(
      calc(92vw * 0.6),
      600px
    );

  --page-width:
    calc(var(--book-width) / 2);

  --paper: #f5eddf;
  --paper-dark: #e8dac4;
  --ink: #3b302a;
  --brown: #4a3024;
  --gold: #b99663;
}


/* =========================================================
   DESKTOP / LAPTOP
========================================================= */

@media (min-width: 901px) {

  :root {

    --book-width:
      min(92vw, 1000px);

    --book-height:
      min(
        calc(var(--book-width) * 0.6),
        600px
      );
  }
}


/* =========================================================
   TABLET / PHONE LANDSCAPE
========================================================= */

@media (min-width: 501px) and (max-width: 900px) {

  :root {

    --book-width:
      min(94vw, 900px);

    --book-height:
      calc(var(--book-width) * 0.6);
  }
}


/* =========================================================
   PHONE PORTRAIT
========================================================= */

@media (max-width: 500px) {

  :root {

    --book-width: 96vw;

    --book-height:
      calc(var(--book-width) * 0.6);
  }
}


/* =========================================================
   APP
========================================================= */

.book-app {

  width: 100%;

  min-height: 100vh;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  padding:
    clamp(10px, 3vw, 30px);
}


/* =========================================================
   BOOK STAGE
========================================================= */

.book-stage {

  position: relative;

  width: var(--book-width);

  height: var(--book-height);

  perspective: 2200px;

  transform-style: preserve-3d;

  z-index: 1;
}


/* =========================================================
   STATIC OPEN BOOK
========================================================= */

.book-spread {

  position: absolute;

  inset: 0;

  display: grid;

  grid-template-columns: 1fr 1fr;

  overflow: hidden;

  border-radius: 5px;

  background: var(--paper);

  box-shadow:
    0 30px 60px rgba(0,0,0,.45),
    0 8px 15px rgba(0,0,0,.3);

  transform-style: preserve-3d;

  z-index: 10;
}


/* =========================================================
   STATIC PAGES
========================================================= */

.book-page {

  position: relative;

  width: 100%;
  height: 100%;

  overflow: hidden;

  padding:
    clamp(16px, 4vw, 45px);

  background:
    radial-gradient(
      circle at 20% 20%,
      rgba(150,110,70,.07) 0 1px,
      transparent 2px
    ),
    radial-gradient(
      circle at 80% 70%,
      rgba(120,90,60,.05) 0 1px,
      transparent 2px
    ),
    var(--paper);

  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}

.book-page.left {
  border-right:
    1px solid rgba(70,50,35,.12);
}

.book-page.right {
  border-left:
    1px solid rgba(70,50,35,.12);
}


/* =========================================================
   SPINE
========================================================= */

.spine {

  position: absolute;

  left: 50%;
  top: 0;

  width: 3px;
  height: 100%;

  transform:
    translateX(-50%);

  background:
    linear-gradient(
      to right,
      rgba(0,0,0,.18),
      rgba(255,255,255,.18),
      rgba(0,0,0,.15)
    );

  z-index: 30;

  pointer-events: none;
}


/* =========================================================
   PAGE CONTENT
========================================================= */

.page-content {

  width: 100%;
  height: 100%;

  min-width: 0;
  min-height: 0;

  display: flex;

  flex-direction: column;

  justify-content: center;

  position: relative;
}


/* =========================================================
   INTRO LEFT
========================================================= */

.intro-left {

  align-items: center;

  text-align: center;
}

.intro-left .small {

  letter-spacing: 5px;

  font-size:
    clamp(8px, 1.2vw, 12px);

  color: #806d5a;

  margin-bottom:
    clamp(10px, 2vw, 20px);
}

.intro-left h1 {

  font-size:
    clamp(25px, 5vw, 65px);

  letter-spacing:
    clamp(2px, .7vw, 7px);

  font-weight: normal;
}

.intro-left .line {

  width:
    clamp(45px, 8vw, 100px);

  height: 1px;

  background: var(--gold);

  margin:
    clamp(12px, 2vw, 25px) auto;
}


/* =========================================================
   INTRO RIGHT
========================================================= */

.intro-right {
  justify-content: center;
}

.chapter {

  font-size:
    clamp(8px, 1.2vw, 12px);

  letter-spacing:
    clamp(2px, .5vw, 4px);

  color: #90734e;

  margin-bottom:
    clamp(8px, 2vw, 18px);
}

.intro-title {

  font-size:
    clamp(20px, 4vw, 48px);

  margin-bottom:
    clamp(10px, 2vw, 25px);

  font-weight: normal;
}

.intro-text {

  width: 100%;

  max-width: 420px;

  font-size:
    clamp(10px, 1.8vw, 18px);

  line-height: 1.8;

  color: #55483e;
}


/* =========================================================
   PERSON LEFT
========================================================= */

.person-left {

  align-items: center;

  text-align: center;
}

.polaroid {

  width:
    clamp(
      90px,
      22vw,
      220px
    );

  aspect-ratio: 4 / 5;

  background: #fff;

  padding:
    clamp(5px, 1vw, 10px)
    clamp(5px, 1vw, 10px)
    clamp(25px, 3vw, 45px);

  box-shadow:
    0 15px 30px rgba(0,0,0,.25);

  transform: rotate(-2deg);

  position: relative;

  flex-shrink: 0;
}

.polaroid-image {

  width: 100%;
  height: 100%;

  display: flex;

  align-items: center;

  justify-content: center;

  overflow: hidden;

  background:
    linear-gradient(
      135deg,
      #d8c7b0,
      #efe5d5
    );

  color: #7a6755;

  font-size:
    clamp(7px, 1.2vw, 13px);
}

.polaroid-image img {

  width: 100%;
  height: 100%;

  object-fit: cover;
}

.tape {

  position: absolute;

  width:
    clamp(35px, 7vw, 70px);

  height:
    clamp(11px, 2vw, 22px);

  background:
    rgba(218,195,150,.75);

  top:
    clamp(-10px, -1vw, -5px);

  left: 50%;

  transform:
    translateX(-50%)
    rotate(2deg);

  z-index: 2;
}


/* =========================================================
   PERSON DIVIDER
========================================================= */

.person-divider {

  width:
    clamp(35px, 7vw, 70px);

  height: 1px;

  background: var(--gold);

  margin:
    clamp(10px, 2vw, 20px) auto;
}


/* =========================================================
   TAGS
========================================================= */

.tags {

  display: flex;

  flex-wrap: wrap;

  justify-content: center;

  gap:
    clamp(3px, .6vw, 7px);
}

.tag {

  border:
    1px solid #c9b89d;

  border-radius: 20px;

  padding:
    clamp(3px, .6vw, 6px)
    clamp(6px, 1vw, 12px);

  font-size:
    clamp(6px, .9vw, 11px);

  color: #715f4e;
}


/* =========================================================
   PERSON RIGHT
========================================================= */

.person-right {

  justify-content: center;

  align-items: center;

  min-height: 0;

  height: 100%;

  overflow: hidden;
}


/* =========================================================
   MESSAGE TITLE
========================================================= */

.message-title {

  width: 100%;

  max-width: 420px;

  flex: 0 0 auto;

  font-size:
    clamp(9px, 1.2vw, 15px);

  letter-spacing:
    clamp(1px, .5vw, 4px);

  color: #90734e;

  margin-bottom:
    clamp(8px, 1.5vw, 15px);

  text-align: center;

  overflow-wrap: anywhere;

  word-break: break-word;
}


/* =========================================================
   MESSAGE
========================================================= */

.message {

  width: 100%;

  max-width: 420px;

  /*
     FIXED READING WINDOW

     Long messages stay inside this box
     and scroll vertically.
  */

  height: 300px;

  max-height: 300px;

  flex:
    0 1 300px;

  overflow-y: scroll;

  overflow-x: hidden;

  font-size: 18px;

  line-height: 1.55;

  color: #40342d;

  padding:
    0 10px 0 3px;

  text-align: left;

  overflow-wrap: anywhere;

  word-wrap: break-word;

  /* Firefox */
  scrollbar-width: thin;

  scrollbar-color:
    #8f7658
    #eee8df;
}


/* =========================================================
   MESSAGE SCROLLBAR
   CHROME / EDGE / SAFARI
========================================================= */

.message::-webkit-scrollbar {

  width: 6px;
}

.message::-webkit-scrollbar-track {

  background:
    #eee8df;

  border-radius: 10px;
}

.message::-webkit-scrollbar-thumb {

  background:
    #8f7658;

  border-radius: 10px;
}

.message::-webkit-scrollbar-thumb:hover {

  background:
    #6f5840;
}


/* =========================================================
   HEART
========================================================= */

.message-heart {

  flex:
    0 0 auto;

  font-size:
    clamp(13px, 2vw, 22px);

  margin:
    clamp(5px, 1vw, 12px) 0 0;

  color: #8f5c52;
}


/* =========================================================
   PHYSICAL TURNING PAGE
========================================================= */

.page-leaf {

  position: absolute;

  top: 0;

  width: var(--page-width);

  height: var(--book-height);

  display: block;

  transform-style: preserve-3d;

  pointer-events: none;

  visibility: hidden;

  will-change: transform;

  transition:
    transform
    760ms
    cubic-bezier(.22,.61,.36,1);

  z-index: 500;

  transform:
    translateZ(20px);
}

.page-leaf.next {

  left: 50%;

  transform-origin:
    left center;
}

.page-leaf.previous {

  left: 0;

  transform-origin:
    right center;
}

.page-leaf.flipping {

  visibility: visible;
}


/* =========================================================
   PAGE LEAF FACES
========================================================= */

.page-front,
.page-back {

  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background:
    radial-gradient(
      circle at 20% 20%,
      rgba(150,110,70,.07) 0 1px,
      transparent 2px
    ),
    var(--paper);

  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;

  transform-style: preserve-3d;

  box-shadow:
    0 5px 15px rgba(0,0,0,.18);

  padding:
    clamp(16px, 4vw, 45px);
}

.page-back {
  transform:
    rotateY(180deg);
}


/* =========================================================
   COVER
========================================================= */

.cover {

  position: absolute;

  top: 0;
  left: 50%;

  width: var(--page-width);

  height: var(--book-height);

  transform-origin:
    left center;

  transform-style:
    preserve-3d;

  z-index: 1000;

  transition:
    transform
    900ms
    cubic-bezier(.22,.61,.36,1);

  box-shadow:
    8px 10px 25px rgba(0,0,0,.35);

  pointer-events: auto;
}

.cover.closed {

  transform:
    translateX(0)
    rotateY(0deg);
}

.cover.open {

  transform:
    translateX(-100%)
    rotateY(-180deg);
}


/* =========================================================
   COVER FACES
========================================================= */

.cover-face {

  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;

  transform-style:
    preserve-3d;
}

.cover-front {

  background:
    linear-gradient(
      135deg,
      #563729,
      #39251d
    );

  color: #ead8b6;

  display: flex;

  align-items: center;

  justify-content: center;

  text-align: center;

  padding:
    clamp(12px, 3vw, 30px);
}

.cover-back {

  transform:
    rotateY(180deg);

  background:
    linear-gradient(
      135deg,
      #f1e5d2,
      #e4d4bb
    );
}

.cover-content {

  width: 100%;
}

.cover-small {

  font-size:
    clamp(6px, 1.1vw, 11px);

  letter-spacing:
    clamp(2px, .5vw, 5px);

  margin-bottom:
    clamp(8px, 2vw, 25px);

  opacity: .8;
}

.cover-title {

  font-size:
    clamp(17px, 4vw, 45px);

  letter-spacing:
    clamp(1px, .4vw, 3px);

  line-height: 1.3;
}

.cover-year {

  margin-top:
    clamp(7px, 2vw, 18px);

  font-size:
    clamp(6px, 1.2vw, 13px);

  letter-spacing:
    clamp(2px, .4vw, 4px);

  color: #c6a775;
}

.cover-heart {

  font-size:
    clamp(14px, 2.5vw, 26px);

  margin:
    clamp(8px, 2vw, 25px) 0;
}

.open-button {

  border:
    1px solid #c6a775;

  background: transparent;

  color: #ead8b6;

  padding:
    clamp(6px, 1.2vw, 12px)
    clamp(8px, 2vw, 20px);

  font-family: inherit;

  font-size:
    clamp(6px, 1.1vw, 12px);

  letter-spacing:
    clamp(1px, .3vw, 2px);

  cursor: pointer;

  transition:
    background .2s ease,
    color .2s ease;
}

.open-button:hover {

  background: #ead8b6;

  color: #39251d;
}


/* =========================================================
   CONTROLS
========================================================= */

.controls {

  position: relative;

  z-index: 2000;

  pointer-events: auto;

  margin-top:
    clamp(10px, 2vw, 22px);

  display: flex;

  align-items: center;

  justify-content: center;

  flex-wrap: wrap;

  gap:
    clamp(4px, 1vw, 10px);

  padding:
    clamp(5px, 1vw, 10px)
    clamp(7px, 1.5vw, 15px);

  border-radius: 40px;

  background:
    rgba(20,16,14,.9);

  box-shadow:
    0 8px 25px rgba(0,0,0,.35);

  transition:
    opacity .25s ease;
}

.controls button {

  position: relative;

  z-index: 2001;

  pointer-events: auto;

  cursor: pointer;

  border:
    1px solid rgba(230,215,190,.35);

  background:
    rgba(255,255,255,.08);

  color: #f4eadb;

  padding:
    clamp(7px, 1vw, 10px)
    clamp(8px, 1.5vw, 15px);

  border-radius: 20px;

  font-family: inherit;

  font-size:
    clamp(8px, 1vw, 12px);

  min-height: 38px;

  transition:
    background .2s ease,
    opacity .2s ease;
}

.controls button:hover:not(:disabled) {

  background:
    rgba(255,255,255,.18);
}

.controls button:disabled {

  opacity: .35;

  cursor: default;
}

#spreadCounter {

  min-width:
    clamp(65px, 10vw, 110px);

  text-align: center;

  color: #d7c5aa;

  font-size:
    clamp(7px, 1vw, 12px);
}


/* =========================================================
   CLOSED STATE
========================================================= */

body.closed .book-spread,
body.closed .spine,
body.closed .page-leaf {

  visibility: hidden;
}

body.closed .controls {

  opacity: 0;

  pointer-events: none;
}


/* =========================================================
   PHONE PORTRAIT
========================================================= */

@media (max-width: 500px) {

  .book-app {

    padding:
      12px 5px 18px;
  }

  .book-page {

    padding:
      12px;
  }

  .page-front,
  .page-back {

    padding:
      12px;
  }

  .intro-text {

    line-height: 1.45;
  }

  .message {

    /*
       Smaller reading window on phones
    */

    height: 180px;

    max-height: 180px;

    flex-basis: 180px;

    font-size: 14px;

    line-height: 1.45;

    padding-right: 8px;
  }

  .message::-webkit-scrollbar {

    width: 5px;
  }

  .message-title {

    margin-bottom: 7px;

    font-size: 9px;
  }

  .message-heart {

    margin-top: 5px;
  }

  .controls {

    width: 96vw;

    border-radius: 18px;
  }

  .controls button {

    min-height: 40px;
  }
}


/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media (max-width: 360px) {

  :root {

    --book-width: 97vw;

    --book-height:
      calc(var(--book-width) * .6);
  }

  .book-page {

    padding: 9px;
  }

  .page-front,
  .page-back {

    padding: 9px;
  }

  .intro-left h1 {

    font-size: 19px;
  }

  .intro-text {

    font-size: 8px;
  }

  .message {

    height: 145px;

    max-height: 145px;

    flex-basis: 145px;

    font-size: 12px;

    line-height: 1.35;

    padding-right: 7px;
  }

  .message::-webkit-scrollbar {

    width: 5px;
  }

  .message-title {

    font-size: 8px;
  }

  .polaroid {

    width: 80px;
  }

  .tag {

    padding: 2px 5px;

    font-size: 6px;
  }

  .controls button {

    padding:
      6px 7px;

    font-size: 8px;
  }

  #spreadCounter {

    min-width: 58px;
  }
}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

  .cover,
  .page-leaf,
  .open-button,
  .controls button {

    transition-duration:
      .01ms !important;
  }
}

</style>
</head>

/* =========================================================
   SPREADS
========================================================= */

const spreads = [

  {
    type: "intro"
  },

  ...people.map(person => ({
    type: "person",
    person
  }))

];


/* =========================================================
   DOM
========================================================= */

const cover =
  document.getElementById("cover");

const openButton =
  document.getElementById("openButton");

const previousButton =
  document.getElementById("previousButton");

const nextButton =
  document.getElementById("nextButton");

const closeButton =
  document.getElementById("closeButton");

const spreadCounter =
  document.getElementById("spreadCounter");

const leftPage =
  document.getElementById("leftPage");

const rightPage =
  document.getElementById("rightPage");

const pageLeaf =
  document.getElementById("pageLeaf");

const pageFront =
  document.getElementById("pageFront");

const pageBack =
  document.getElementById("pageBack");


/* =========================================================
   STATE
========================================================= */

let currentSpread = 0;

let bookOpen = false;

let animating = false;


/* =========================================================
   INTRO
========================================================= */

function createIntroLeft() {

  return `

    <div class="page-content intro-left">

      <div class="small">
        OUR MEMORIES
      </div>

      <h1>
        MEMORIES
      </h1>

      <div class="line"></div>

      <div>
        ♥
      </div>

    </div>

  `;
}


function createIntroRight() {

  return `

    <div class="page-content intro-right">

      <div class="chapter">
        CHAPTER ONE
      </div>

      <div class="intro-title">
        OUR STORY
      </div>

      <div class="intro-text">

        A little collection of people,
        laughter, conversations and
        moments that made this chapter
        unforgettable.

      </div>

    </div>

  `;
}


/* =========================================================
   PERSON LEFT
   NAME REMOVED
========================================================= */

function createPersonLeft(person) {

  const imageHTML =
    person.image

      ? `<img
           src="${person.image}"
           alt="${person.name}"
         >`

      : `<span>Your photo</span>`;


  const tagsHTML =
    person.tags
      .map(
        tag =>
          `<span class="tag">${tag}</span>`
      )
      .join("");


  return `

    <div class="page-content person-left">

      <div class="polaroid">

        <div class="tape"></div>

        <div class="polaroid-image">

          ${imageHTML}

        </div>

      </div>


      <div class="person-divider"></div>


      <div class="tags">

        ${tagsHTML}

      </div>

    </div>

  `;
}


/* =========================================================
   PERSON RIGHT
   NAME IS THE HEADING
========================================================= */

function createPersonRight(person) {

  return `

    <div class="page-content person-right">

      <div class="message-title">

        ${person.name}

      </div>


      <div class="message">

        ${person.message}

      </div>


      <div class="message-heart">
        ♥
      </div>

    </div>

  `;
}


/* =========================================================
   PAGE HTML
========================================================= */

function leftHTML(index) {

  const spread =
    spreads[index];

  if (!spread) return "";


  if (
    spread.type === "intro"
  ) {

    return createIntroLeft();

  }


  return createPersonLeft(
    spread.person
  );

}


function rightHTML(index) {

  const spread =
    spreads[index];

  if (!spread) return "";


  if (
    spread.type === "intro"
  ) {

    return createIntroRight();

  }


  return createPersonRight(
    spread.person
  );

}


/* =========================================================
   RENDER
========================================================= */

function renderSpread(index) {

  if (
    index < 0 ||
    index >= spreads.length
  ) {

    return;

  }


  const spread =
    spreads[index];


  if (
    spread.type === "intro"
  ) {

    leftPage.innerHTML =
      createIntroLeft();

    rightPage.innerHTML =
      createIntroRight();

  }

  else {

    leftPage.innerHTML =
      createPersonLeft(
        spread.person
      );

    rightPage.innerHTML =
      createPersonRight(
        spread.person
      );

  }


  updateNavigation();

}


/* =========================================================
   OPEN
========================================================= */

function openBook() {

  if (
    bookOpen ||
    animating
  ) {

    return;

  }


  animating = true;

  currentSpread = 0;


  renderSpread(0);


  document.body.classList.remove(
    "closed"
  );


  cover.classList.remove(
    "open"
  );

  cover.classList.add(
    "closed"
  );


  void cover.offsetWidth;


  requestAnimationFrame(() => {

    cover.classList.remove(
      "closed"
    );

    cover.classList.add(
      "open"
    );

  });


  setTimeout(() => {

    bookOpen = true;

    animating = false;

    updateNavigation();

  }, 950);

}


/* =========================================================
   CLOSE
========================================================= */

function closeBook() {

  if (
    !bookOpen ||
    animating
  ) {

    return;

  }


  animating = true;


  cover.classList.remove(
    "closed"
  );

  cover.classList.add(
    "open"
  );


  void cover.offsetWidth;


  requestAnimationFrame(() => {

    cover.classList.remove(
      "open"
    );

    cover.classList.add(
      "closed"
    );

  });


  setTimeout(() => {

    bookOpen = false;

    currentSpread = 0;


    pageLeaf.className =
      "page-leaf";

    pageLeaf.style.transform =
      "";

    pageLeaf.style.zIndex =
      "";


    pageFront.innerHTML =
      "";

    pageBack.innerHTML =
      "";


    document.body.classList.add(
      "closed"
    );


    renderSpread(0);


    animating = false;

    updateNavigation();

  }, 950);

}


/* =========================================================
   PAGE TURN
========================================================= */

function turnSpread(direction) {

  if (
    !bookOpen ||
    animating
  ) {

    return;

  }


  const destination =
    currentSpread + direction;


  if (
    destination < 0 ||
    destination >= spreads.length
  ) {

    return;

  }


  animating = true;


  /* =======================================================
     NEXT
  ======================================================= */

  if (
    direction === 1
  ) {

    pageFront.innerHTML =
      rightHTML(
        currentSpread
      );


    pageBack.innerHTML =
      leftHTML(
        destination
      );


    pageLeaf.className =
      "page-leaf next flipping";


    pageLeaf.style.zIndex =
      "600";


    pageLeaf.style.transform =
      "rotateY(0deg)";


    void pageLeaf.offsetWidth;


    requestAnimationFrame(() => {

      pageLeaf.style.transform =
        "rotateY(-180deg)";

    });

  }


  /* =======================================================
     PREVIOUS
  ======================================================= */

  else {

    pageFront.innerHTML =
      leftHTML(
        currentSpread
      );


    pageBack.innerHTML =
      rightHTML(
        destination
      );


    pageLeaf.className =
      "page-leaf previous flipping";


    pageLeaf.style.zIndex =
      "600";


    pageLeaf.style.transform =
      "rotateY(0deg)";


    void pageLeaf.offsetWidth;


    requestAnimationFrame(() => {

      pageLeaf.style.transform =
        "rotateY(180deg)";

    });

  }


  /* =======================================================
     FINISH
  ======================================================= */

  setTimeout(() => {

    currentSpread =
      destination;


    pageLeaf.className =
      "page-leaf";


    pageLeaf.style.transform =
      "";

    pageLeaf.style.zIndex =
      "";


    pageFront.innerHTML =
      "";

    pageBack.innerHTML =
      "";


    renderSpread(
      currentSpread
    );


    animating = false;


    updateNavigation();

  }, 800);

}


/* =========================================================
   NEXT
========================================================= */

function nextSpread() {

  if (
    !bookOpen ||
    animating
  ) {

    return;

  }


  if (
    currentSpread >=
    spreads.length - 1
  ) {

    closeBook();

    return;

  }


  turnSpread(1);

}


/* =========================================================
   PREVIOUS
========================================================= */

function previousSpread() {

  if (
    !bookOpen ||
    animating
  ) {

    return;

  }


  if (
    currentSpread <= 0
  ) {

    return;

  }


  turnSpread(-1);

}


/* =========================================================
   NAVIGATION UI
========================================================= */

function updateNavigation() {

  spreadCounter.textContent =
    `Spread ${
      currentSpread + 1
    } of ${
      spreads.length
    }`;


  previousButton.disabled =
    !bookOpen ||
    currentSpread === 0 ||
    animating;


  nextButton.disabled =
    !bookOpen ||
    animating;


  closeButton.disabled =
    !bookOpen ||
    animating;

}


/* =========================================================
   BUTTON EVENTS
========================================================= */

openButton.addEventListener(
  "click",
  openBook
);


previousButton.addEventListener(
  "click",
  previousSpread
);


nextButton.addEventListener(
  "click",
  nextSpread
);


closeButton.addEventListener(
  "click",
  closeBook
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if (!bookOpen) {

      return;

    }


    if (
      event.key === "ArrowRight"
    ) {

      nextSpread();

    }


    if (
      event.key === "ArrowLeft"
    ) {

      previousSpread();

    }


    if (
      event.key === "Escape"
    ) {

      closeBook();

    }

  }
);


/* =========================================================
   INITIALIZE
========================================================= */

renderSpread(0);

document.body.classList.add(
  "closed"
);

cover.classList.remove(
  "open"
);

cover.classList.add(
  "closed"
);

bookOpen = false;

animating = false;

updateNavigation();

</script>
