<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sai Memory Book • Farewell 2026</title>

<style>
/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family: Georgia, "Times New Roman", serif;

    background:
        radial-gradient(
            circle at 50% 40%,
            #f7f2e9 0%,
            #e2d8c8 55%,
            #c4b6a2 100%
        );

    color: #3d2d25;

    overflow-x: hidden;
}


/* =========================================================
   VARIABLES

   OPEN BOOK = 16:9

   One page = half of open book.
   Therefore each closed cover has a 8:9 ratio.
========================================================= */

:root {
    --book-width: min(92vw, 1120px);
    --book-height: calc(var(--book-width) * 0.5625);

    --page-width: calc(var(--book-width) / 2);

    --leather-dark: #24110e;
    --leather-mid: #4d2720;
    --leather-light: #66352b;

    --gold: #d8b982;
    --gold-dark: #a88455;

    --paper: #f8f3ea;
    --paper-dark: #eee5d7;

    --text: #44332a;
    --muted: #887665;
}


/* =========================================================
   STAGE
========================================================= */

.stage {
    width: 100%;
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 50px 25px 110px;

    perspective: 2500px;
}


/* =========================================================
   CLOSED BOOK

   IMPORTANT:
   This is exactly HALF the width of the open album.
========================================================= */

.closed-book {
    position: relative;

    width: var(--page-width);
    height: var(--book-height);

    transform-style: preserve-3d;

    transform:
        rotateY(-7deg)
        rotateX(2deg);

    filter:
        drop-shadow(
            25px 30px 25px rgba(0,0,0,.28)
        );

    animation: closedAppear .8s ease;
}

@keyframes closedAppear {
    from {
        opacity: 0;
        transform:
            rotateY(-15deg)
            rotateX(5deg)
            translateY(20px);
    }

    to {
        opacity: 1;
        transform:
            rotateY(-7deg)
            rotateX(2deg);
    }
}


/* =========================================================
   LEATHER COVER
========================================================= */

.leather-cover {
    position: absolute;

    inset: 0;

    border-radius:
        7px
        12px
        12px
        7px;

    background:
        linear-gradient(
            135deg,
            #21100d 0%,
            #4b251e 25%,
            #66352a 46%,
            #3b1b17 72%,
            #1b0907 100%
        );

    box-shadow:
        inset 4px 0 0 rgba(255,255,255,.05),
        inset -6px 0 0 rgba(0,0,0,.40),
        7px 7px 0 #25110e,
        12px 12px 0 #180806;

    overflow: hidden;
}

.leather-cover::before {
    content: "";

    position: absolute;

    inset: 20px;

    border:
        1px solid
        rgba(225,184,120,.55);

    border-radius: 5px;

    pointer-events: none;
}

.leather-cover::after {
    content: "";

    position: absolute;

    inset: 0;

    background:
        repeating-linear-gradient(
            105deg,
            rgba(255,255,255,.018) 0,
            rgba(255,255,255,.018) 1px,
            transparent 1px,
            transparent 5px
        );

    pointer-events: none;
}


/* =========================================================
   COVER CONTENT
========================================================= */

.cover-content {
    position: absolute;

    inset: 40px;

    z-index: 5;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    color: var(--gold);
}

.cover-eyebrow {
    font-size: 10px;

    letter-spacing: 4px;

    opacity: .8;

    margin-bottom: 22px;
}

.cover-title {
    font-size:
        clamp(26px, 4vw, 43px);

    line-height: 1.15;

    letter-spacing: 3px;

    font-weight: 500;
}

.cover-farewell {
    margin-top: 16px;

    font-size: 15px;

    letter-spacing: 2px;
}

.cover-subtitle {
    margin-top: 5px;

    font-size: 14px;

    font-style: italic;

    letter-spacing: .5px;
}

.cover-heart {
    margin-top: 25px;

    font-size: 32px;
}

.open-button {
    margin-top: 35px;

    padding: 12px 20px;

    border:
        1px solid
        rgba(225,184,120,.65);

    background:
        rgba(0,0,0,.08);

    color: var(--gold);

    font-family: Georgia, serif;

    font-size: 11px;

    letter-spacing: 2px;

    cursor: pointer;

    transition:
        background .3s ease,
        transform .3s ease;
}

.open-button:hover {
    background:
        rgba(225,184,120,.12);

    transform:
        translateY(-2px);
}


/* =========================================================
   OPEN BOOK
========================================================= */

.book {
    position: relative;

    width: var(--book-width);
    height: var(--book-height);

    max-width: 100%;

    transform-style: preserve-3d;

    filter:
        drop-shadow(
            0 28px 30px rgba(0,0,0,.23)
        );
}


/* =========================================================
   TWO-PAGE SPREAD
========================================================= */

.spread {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: grid;

    grid-template-columns:
        1fr
        1fr;

    transform-style: preserve-3d;

    transition:
        transform .7s ease;
}

.page {
    position: relative;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background:
        radial-gradient(
            ellipse at center,
            #fffdf9 0%,
            #f2eadf 100%
        );

    box-shadow:
        inset 0 0 35px
        rgba(80,55,30,.07);
}

.page::after {
    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    background:
        repeating-linear-gradient(
            0deg,
            transparent 0,
            transparent 5px,
            rgba(70,45,25,.012) 6px
        );
}

.left-page {
    border-radius:
        9px
        0
        0
        9px;
}

.right-page {
    border-radius:
        0
        9px
        9px
        0;
}


/* =========================================================
   SPINE
========================================================= */

.spine {
    position: absolute;

    z-index: 30;

    top: 0;
    bottom: 0;

    left: 50%;

    width: 3px;

    transform:
        translateX(-50%);

    background:
        linear-gradient(
            to right,
            rgba(0,0,0,.14),
            rgba(255,255,255,.75),
            rgba(0,0,0,.07)
        );

    box-shadow:
        0 0 8px rgba(0,0,0,.08);
}


/* =========================================================
   INTRO LEFT
========================================================= */

.intro-left {
    display: flex;

    justify-content: center;

    align-items: center;
}

.quiet-heart {
    font-size: 28px;

    color: #b99a6d;

    opacity: .30;
}


/* =========================================================
   INTRO RIGHT
========================================================= */

.intro-right {
    padding:
        clamp(35px, 6vw, 75px);

    display: flex;

    align-items: center;
}

.intro-content {
    width: 100%;
}

.eyebrow {
    font-size: 10px;

    letter-spacing: 4px;

    color: #a48761;
}

.intro-title {
    margin:
        15px 0 18px;

    font-size:
        clamp(34px, 5vw, 55px);

    font-weight: 400;

    letter-spacing: 2px;
}

.gold-line {
    width: 60px;

    height: 1px;

    background: #b69668;

    margin:
        20px 0 28px;
}

.intro-main {
    margin: 0;

    font-size:
        clamp(19px, 2.3vw, 26px);

    line-height: 1.5;
}

.intro-highlight {
    margin:
        4px 0 22px;

    font-size:
        clamp(22px, 2.7vw, 30px);

    font-style: italic;

    color: #8c6945;
}

.intro-description {
    max-width: 440px;

    font-size: 15px;

    line-height: 1.9;

    color: #76665b;
}

.intro-heart {
    margin-top: 25px;

    color: #a48761;

    font-size: 27px;
}


/* =========================================================
   PERSON LEFT
========================================================= */

.person-left {
    padding:
        clamp(25px, 4vw, 50px);
}

.photo-frame {
    width: 100%;

    height: 64%;

    padding: 8px;

    border:
        1px solid #cdb590;

    background: #ebe0d0;

    box-shadow:
        0 12px 25px
        rgba(0,0,0,.13);
}

.photo-frame img {
    width: 100%;

    height: 100%;

    object-fit: cover;

    display: block;
}

.person-info {
    position: relative;

    padding-top: 17px;
}

.person-number {
    position: absolute;

    right: 0;

    top: 18px;

    font-size: 10px;

    letter-spacing: 2px;

    color: #a88b69;
}

.person-name {
    margin: 0;

    font-size:
        clamp(25px, 3vw, 36px);

    font-weight: 400;

    color: #392921;
}

.heart-line {
    margin:
        6px 0 13px;

    font-size: 14px;

    font-style: italic;

    color: #816547;
}

.tags {
    display: flex;

    flex-wrap: wrap;

    gap: 6px;
}

.tag {
    padding:
        5px 9px;

    border:
        1px solid #d1bda0;

    border-radius: 20px;

    font-size: 8px;

    letter-spacing: 1px;

    color: #856d52;
}


/* =========================================================
   PERSON RIGHT
========================================================= */

.person-right {
    padding:
        clamp(30px, 5vw, 68px);

    display: flex;

    align-items: center;
}

.tribute {
    width: 100%;
}

.tribute-label {
    font-size: 9px;

    letter-spacing: 3px;

    color: #a38661;

    margin-bottom: 23px;
}

.tribute-message {
    font-size:
        clamp(15px, 1.8vw, 19px);

    line-height: 1.85;

    color: #4d3a31;

    white-space: pre-line;
}

.divider {
    display: flex;

    align-items: center;

    gap: 10px;

    margin:
        28px 0;
}

.divider-line {
    width: 50px;

    height: 1px;

    background: #d0bb9c;
}

.divider-heart {
    color: #a98960;
}


/* =========================================================
   VIDEO CARD
========================================================= */

.video-card {
    width: 100%;

    display: flex;

    align-items: center;

    gap: 14px;

    padding:
        15px 18px;

    border:
        1px solid #d0bda1;

    background:
        rgba(255,255,255,.35);

    text-decoration: none;

    color: #49372e;

    transition:
        transform .25s ease,
        background .25s ease;
}

.video-card:hover {
    transform:
        translateY(-3px);

    background:
        rgba(255,255,255,.72);
}

.video-icon {
    width: 40px;

    height: 40px;

    flex-shrink: 0;

    border-radius: 50%;

    display: flex;

    justify-content: center;

    align-items: center;

    background: #896846;

    color: white;

    font-size: 11px;
}

.video-text small {
    display: block;

    font-size: 7px;

    letter-spacing: 2px;

    color: #9f825e;
}

.video-text strong {
    display: block;

    margin-top: 3px;

    font-size: 15px;

    font-weight: 400;
}

.video-arrow {
    margin-left: auto;

    font-size: 19px;

    color: #967551;
}


/* =========================================================
   NAVIGATION

   CLOSE BOOK ALWAYS VISIBLE
========================================================= */

.navigation {
    position: absolute;

    z-index: 100;

    left: 0;
    right: 0;

    bottom: -67px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 12px;
}

.nav-button {
    padding:
        9px 15px;

    border:
        1px solid rgba(120,90,60,.30);

    background:
        rgba(255,255,255,.38);

    color: #5c4838;

    font-family: Georgia, serif;

    font-size: 11px;

    letter-spacing: .7px;

    cursor: pointer;

    transition:
        background .25s ease,
        transform .25s ease;
}

.nav-button:hover {
    background:
        rgba(255,255,255,.72);

    transform:
        translateY(-2px);
}

.nav-button:disabled {
    opacity: .28;

    cursor: default;

    transform: none;
}

.close-button {
    border-color:
        rgba(139,100,62,.65);

    color: #795638;
}

.page-count {
    padding:
        0 7px;

    color: #9d876d;

    font-size: 9px;

    letter-spacing: 2px;
}


/* =========================================================
   INTRO NEXT
========================================================= */

.intro-next {
    position: absolute;

    z-index: 50;

    right: 25px;

    bottom: 22px;
}


/* =========================================================
   OPENING CONTAINER
========================================================= */

.opening-container {
    position: relative;

    width: var(--book-width);
    height: var(--book-height);

    transform-style: preserve-3d;
}


/* The spread is already behind the cover. */

.opening-cover {
    position: absolute;

    z-index: 100;

    top: 0;

    left: 50%;

    width: var(--page-width);

    height: var(--book-height);

    transform-origin: left center;

    transform-style: preserve-3d;

    animation:
        openingCover
        1.25s
        cubic-bezier(.65,0,.35,1)
        forwards;

    backface-visibility: hidden;
}

@keyframes openingCover {

    0% {
        transform:
            translateX(0)
            rotateY(0deg);
    }

    100% {
        transform:
            translateX(-100%)
            rotateY(-180deg);
    }
}


/* =========================================================
   CLOSING CONTAINER
========================================================= */

.closing-container {
    position: relative;

    width: var(--book-width);
    height: var(--book-height);

    transform-style: preserve-3d;
}


/*
   During closing, the cover starts at the
   left half of the open book and folds
   toward the right side around the spine.
*/

.closing-cover {
    position: absolute;

    z-index: 100;

    top: 0;

    left: 0;

    width: var(--page-width);

    height: var(--book-height);

    transform-origin: right center;

    transform-style: preserve-3d;

    animation:
        closingCover
        1.25s
        cubic-bezier(.65,0,.35,1)
        forwards;

    backface-visibility: hidden;
}

@keyframes closingCover {

    0% {
        transform:
            translateX(0)
            rotateY(180deg);
    }

    100% {
        transform:
            translateX(0)
            rotateY(0deg);
    }
}


/*
   The pages visually compress behind
   the closing cover.
*/

.closing-container .spread {
    animation:
        pagesClose
        1.25s
        cubic-bezier(.65,0,.35,1)
        forwards;
}

@keyframes pagesClose {

    0% {
        transform:
            scaleX(1);
        transform-origin: left center;
    }

    100% {
        transform:
            scaleX(.5);
        transform-origin: left center;
    }
}


/* =========================================================
   CLOSING MESSAGE
========================================================= */

.closing-page-content {
    position: absolute;

    inset: 0;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    color: #80694f;
}

.closing-heart {
    font-size: 35px;
}

.closing-title {
    margin-top: 15px;

    font-size: 23px;

    font-style: italic;

    font-weight: 400;
}


/* =========================================================
   PAGE TURN
========================================================= */

.page-turn {
    animation:
        pageTurn .55s ease;
}

@keyframes pageTurn {

    0% {
        transform:
            rotateY(0deg);
    }

    35% {
        transform:
            rotateY(-4deg)
            translateX(-4px);
    }

    100% {
        transform:
            rotateY(0deg);
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 800px) {

    :root {
        --book-width: 94vw;
        --book-height: calc(var(--book-width) * 0.5625);
    }

    .stage {
        padding:
            30px
            15px
            100px;
    }

    .intro-right {
        padding: 28px;
    }

    .person-left {
        padding: 25px;
    }

    .person-right {
        padding: 28px;
    }

    .tribute-message {
        font-size: 14px;
        line-height: 1.65;
    }

    .person-name {
        font-size: 25px;
    }

    .navigation {
        gap: 5px;
    }

    .nav-button {
        padding:
            8px 9px;

        font-size: 9px;
    }
}


/* =========================================================
   SMALL MOBILE

   Still maintain landscape album geometry.
========================================================= */

@media (max-width: 600px) {

    .stage {
        align-items: center;

        padding:
            25px
            10px
            90px;
    }

    /*
       We intentionally DO NOT turn the album
       into a portrait layout.
    */

    .book,
    .opening-container,
    .closing-container {
        width: 96vw;

        height:
            calc(96vw * .5625);
    }

    .closed-book {
        width:
            calc(96vw / 2);

        height:
            calc(96vw * .5625);
    }

    .intro-right {
        padding: 18px;
    }

    .intro-title {
        font-size: 24px;
    }

    .intro-main {
        font-size: 13px;
    }

    .intro-highlight {
        font-size: 16px;
    }

    .intro-description {
        font-size: 10px;
        line-height: 1.6;
    }

    .intro-next {
        right: 10px;
        bottom: 10px;
    }

    .person-left {
        padding: 14px;
    }

    .person-right {
        padding: 17px;
    }

    .photo-frame {
        height: 58%;
        padding: 5px;
    }

    .person-name {
        font-size: 17px;
    }

    .heart-line {
        font-size: 9px;
    }

    .tag {
        font-size: 6px;
        padding: 3px 6px;
    }

    .tribute-label {
        font-size: 6px;
        letter-spacing: 1.5px;
        margin-bottom: 10px;
    }

    .tribute-message {
        font-size: 9px;
        line-height: 1.55;
    }

    .divider {
        margin: 12px 0;
    }

    .video-card {
        padding: 8px;
        gap: 7px;
    }

    .video-icon {
        width: 25px;
        height: 25px;
        font-size: 7px;
    }

    .video-text small {
        font-size: 5px;
    }

    .video-text strong {
        font-size: 9px;
    }

    .video-arrow {
        font-size: 12px;
    }

    .navigation {
        bottom: -52px;
    }

    .nav-button {
        font-size: 7px;
        padding: 6px 7px;
    }

    .page-count {
        font-size: 7px;
    }
}
</style>
</head>

    {
        name: "Person 11",
        photo: "images/person11.jpg",

        heart:
            "Good times become great memories ♡",

        tags: [
            "GOOD TIMES",
            "2026"
        ],

        message:
`Thank you for every conversation,
every laugh and every unforgettable day.`,

        video: "#"
    },

    {
        name: "Person 12",
        photo: "images/person12.jpg",

        heart:
            "Some memories never fade ♡",

        tags: [
            "MEMORIES",
            "FRIENDSHIP"
        ],

        message:
`Years from now, we may forget the details,
but we'll remember how these moments felt.`,

        video: "#"
    },

    {
        name: "Person 13",
        photo: "images/person13.jpg",

        heart:
            "One more beautiful memory to keep ♡",

        tags: [
            "MEMORIES",
            "TOGETHER"
        ],

        message:
`Thank you for adding your own special
colour to this chapter of our story.`,

        video: "#"
    },

    {
        name: "Person 14",
        photo: "images/person14.jpg",

        heart:
            "A special memory from a special journey ♡",

        tags: [
            "FRIENDSHIP",
            "FAREWELL"
        ],

        message:
`Every person leaves something behind.
Thank you for leaving behind
so many wonderful memories.`,

        video: "#"
    },

    {
        name: "Person 15",
        photo: "images/person15.jpg",

        heart:
            "And this memory stays with us ♡",

        tags: [
            "MEMORIES",
            "FOREVER"
        ],

        message:
`As this chapter comes to an end,
we take all these memories with us.

Thank you for being part of the story.`,

        video: "#"
    }

];


/* =========================================================
   STATE
========================================================= */

let currentPage = 0;

let isClosing = false;


/* =========================================================
   APP
========================================================= */

const app = document.getElementById("app");


/* =========================================================
   COVER
========================================================= */

function coverHTML(showButton = false) {

    return `
        <div class="leather-cover">

            <div class="cover-content">

                <div class="cover-eyebrow">
                    FAREWELL 2026
                </div>

                <div class="cover-title">
                    SAI MEMORY BOOK
                </div>

                <div class="cover-farewell">
                    Farewell 2026
                </div>

                <div class="cover-subtitle">
                    Our Memories Together
                </div>

                <div class="cover-heart">
                    ♡
                </div>

                ${
                    showButton
                    ?
                    `
                    <button
                        class="open-button"
                        onclick="openBook()"
                    >
                        OPEN BOOK →
                    </button>
                    `
                    :
                    ``
                }

            </div>

        </div>
    `;
}


/* =========================================================
   CLOSED STATE
========================================================= */

function renderClosed() {

    app.innerHTML = `

        <main class="stage">

            <div class="closed-book">

                ${coverHTML(true)}

            </div>

        </main>
    `;
}


/* =========================================================
   INTRO CONTENT
========================================================= */

function introHTML() {

    return `

        <div class="intro-content">

            <div class="eyebrow">
                A COLLECTION OF MEMORIES
            </div>

            <h1 class="intro-title">
                OUR STORY
            </h1>

            <div class="gold-line"></div>

            <p class="intro-main">
                Every chapter has a story...
            </p>

            <p class="intro-highlight">
                And you made ours special.
            </p>

            <p class="intro-description">
                A collection of memories, laughter
                and moments we'll always carry with us.
            </p>

            <div class="intro-heart">
                ♡
            </div>

        </div>
    `;
}


/* =========================================================
   OPEN BOOK
========================================================= */

function openBook() {

    app.innerHTML = `

        <main class="stage">

            <div class="opening-container">

                <!-- Underlying spread -->

                <div class="spread">

                    <div class="page left-page intro-left">

                        <div class="quiet-heart">
                            ♡
                        </div>

                    </div>

                    <div class="page right-page intro-right">

                        ${introHTML()}

                    </div>

                </div>

                <div class="spine"></div>


                <!-- FRONT COVER -->

                <div class="opening-cover">

                    ${coverHTML(false)}

                </div>

            </div>

        </main>
    `;


    /*
       Wait for the cover to physically open.
    */

    setTimeout(() => {

        renderIntro();

    }, 1300);
}


/* =========================================================
   INTRO
========================================================= */

function renderIntro() {

    app.innerHTML = `

        <main class="stage">

            <div class="book">

                <div class="spread">

                    <div class="page left-page intro-left">

                        <div class="quiet-heart">
                            ♡
                        </div>

                    </div>

                    <div class="page right-page intro-right">

                        ${introHTML()}

                        <button
                            class="nav-button intro-next"
                            onclick="showPerson(0)"
                        >
                            Next →
                        </button>

                    </div>

                </div>

                <div class="spine"></div>

            </div>

        </main>
    `;
}


/* =========================================================
   PERSON HTML
========================================================= */

function personHTML(person, index) {

    return `

        <div class="spread page-turn">

            <!-- =========================================
                 LEFT
            ========================================== -->

            <div class="page left-page person-left">

                <div class="photo-frame">

                    <img
                        src="${person.photo}"
                        alt="${person.name}"
                        onerror="
                            this.src =
                            'https://via.placeholder.com/900x600?text='
                            + encodeURIComponent('${person.name}')
                        "
                    >

                </div>

                <div class="person-info">

                    <div class="person-number">
                        ${String(index + 1).padStart(2, "0")}
                    </div>

                    <h2 class="person-name">
                        ${person.name}
                    </h2>

                    <p class="heart-line">
                        ${person.heart}
                    </p>

                    <div class="tags">

                        ${
                            person.tags
                                .map(
                                    tag =>
                                    `<span class="tag">${tag}</span>`
                                )
                                .join("")
                        }

                    </div>

                </div>

            </div>


            <!-- =========================================
                 RIGHT
            ========================================== -->

            <div class="page right-page person-right">

                <div class="tribute">

                    <div class="tribute-label">
                        A LITTLE SOMETHING FOR YOU
                    </div>

                    <div class="tribute-message">
                        ${person.message}
                    </div>

                    <div class="divider">

                        <span class="divider-line"></span>

                        <span class="divider-heart">
                            ♡
                        </span>

                        <span class="divider-line"></span>

                    </div>


                    <a
                        class="video-card"
                        href="${person.video}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >

                        <div class="video-icon">
                            ▶
                        </div>

                        <div class="video-text">

                            <small>
                                MEMORY
                            </small>

                            <strong>
                                Watch Video
                            </strong>

                        </div>

                        <div class="video-arrow">
                            →
                        </div>

                    </a>

                </div>

            </div>

        </div>
    `;
}


/* =========================================================
   SHOW PERSON
========================================================= */

function showPerson(index) {

    currentPage = index;

    const person = people[index];

    app.innerHTML = `

        <main class="stage">

            <div class="book">

                ${personHTML(person, index)}

                <div class="spine"></div>


                <!-- =====================================
                     NAVIGATION
                ====================================== -->

                <div class="navigation">

                    <button
                        class="nav-button"
                        onclick="previousPerson()"
                        ${index === 0 ? "disabled" : ""}
                    >
                        ← Previous
                    </button>


                    <div class="page-count">
                        ${index + 1} / ${people.length}
                    </div>


                    <button
                        class="nav-button"
                        onclick="nextPerson()"
                    >
                        ${
                            index === people.length - 1
                            ? "Next →"
                            : "Next →"
                        }
                    </button>


                    <!-- ALWAYS AVAILABLE -->

                    <button
                        class="nav-button close-button"
                        onclick="closeBook()"
                    >
                        Close Book
                    </button>

                </div>

            </div>

        </main>
    `;
}


/* =========================================================
   NEXT PERSON
========================================================= */

function nextPerson() {

    if (currentPage < people.length - 1) {

        showPerson(currentPage + 1);

    } else {

        /*
           On Person 15, Next physically closes
           the album.
        */

        closeBook();

    }
}


/* =========================================================
   PREVIOUS PERSON
========================================================= */

function previousPerson() {

    if (currentPage > 0) {

        showPerson(currentPage - 1);

    }
}


/* =========================================================
   CLOSE BOOK
========================================================= */

function closeBook() {

    if (isClosing) {
        return;
    }

    isClosing = true;


    /*
       Start from the currently open spread.

       The cover is positioned over the LEFT page
       and rotates around the spine.
    */

    app.innerHTML = `

        <main class="stage">

            <div class="closing-container">

                <!-- Current spread -->

                <div class="spread">

                    <div class="page left-page">

                        <div class="closing-page-content">

                            <div class="closing-heart">
                                ♡
                            </div>

                        </div>

                    </div>


                    <div class="page right-page">

                        <div class="closing-page-content">

                            <div class="closing-heart">
                                ♡
                            </div>

                            <div class="closing-title">
                                Until the next chapter...
                            </div>

                        </div>

                    </div>

                </div>

                <div class="spine"></div>


                <!-- COVER FOLDS SHUT -->

                <div class="closing-cover">

                    ${coverHTML(false)}

                </div>

            </div>

        </main>
    `;


    /*
       After the physical animation completes,
       render the original closed cover.
    */

    setTimeout(() => {

        isClosing = false;

        renderClosed();

    }, 1300);
}


/* =========================================================
   INITIAL STATE
========================================================= */

renderClosed();

</script>

</body>
</html>
