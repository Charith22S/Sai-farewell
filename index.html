<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAI MEMORY BOOK</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    background: #2c2724;
    font-family: Georgia, "Times New Roman", serif;
    color: #3d3027;
}

/* =========================================================
   VIEWPORT
========================================================= */

.book-app {
    width: 100%;
    min-height: 100vh;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    padding: 30px 20px;
}

/* =========================================================
   BOOK GEOMETRY

   OPEN BOOK:
   1000 x 600

   SINGLE PAGE:
   500 x 600

   Everything is derived from the same geometry.
========================================================= */

:root {
    --book-width: min(92vw, 1000px);
    --book-height: min(
        calc(92vw * 0.6),
        600px
    );

    --page-width: calc(var(--book-width) / 2);

    --paper: #fdfbf7;
    --paper-alt: #f5f0eb;

    --brown: #604535;
    --brown-dark: #34271f;

    --gold: #c6a46a;

    --shadow:
        0 25px 60px rgba(0,0,0,.40),
        0 8px 20px rgba(0,0,0,.25);
}

/* =========================================================
   STAGE
========================================================= */

.book-stage {
    position: relative;

    width: var(--book-width);
    height: var(--book-height);

    flex-shrink: 0;

    perspective: 2200px;
    transform-style: preserve-3d;
}

/* =========================================================
   OPEN SPREAD
========================================================= */

.book-spread {
    position: absolute;
    inset: 0;

    display: grid;
    grid-template-columns: 1fr 1fr;

    overflow: hidden;

    background: #fdfbf7;

    border-radius: 5px;

    box-shadow: var(--shadow);
}

/* =========================================================
   INDIVIDUAL PAGES
========================================================= */

.book-page {
    position: relative;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background:
        linear-gradient(
            rgba(255,255,255,.18),
            rgba(255,255,255,.18)
        ),
        repeating-linear-gradient(
            0deg,
            rgba(100,70,40,.025) 0px,
            rgba(100,70,40,.025) 1px,
            transparent 1px,
            transparent 4px
        ),
        var(--paper);
}

.book-page.left {
    border-right: 1px solid rgba(70,50,35,.15);
}

.book-page.right {
    border-left: 1px solid rgba(70,50,35,.10);
}

.page-content {
    width: 100%;
    height: 100%;

    padding: clamp(25px, 4vw, 55px);
}

/* =========================================================
   SPINE
========================================================= */

.spine {
    position: absolute;

    top: 0;
    left: 50%;

    width: 18px;
    height: 100%;

    transform: translateX(-50%);

    z-index: 10;

    pointer-events: none;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(50,35,25,.12),
            rgba(50,35,25,.20),
            rgba(50,35,25,.08),
            transparent
        );
}

/* =========================================================
   COVER

   EXACTLY ONE PAGE WIDE.
========================================================= */

.cover {
    position: absolute;

    left: 50%;
    top: 0;

    width: var(--page-width);
    height: var(--book-height);

    transform-origin: left center;

    transform-style: preserve-3d;

    z-index: 100;

    background: #604535;

    border-radius: 4px;

    box-shadow:
        10px 18px 35px rgba(0,0,0,.40);

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
}

/* Closed */
.cover.closed {
    transform:
        translateX(0)
        rotateY(0deg);
}

/* Open */
.cover.open {
    transform:
        translateX(-100%)
        rotateY(-180deg);
}

/* Opening animation */
.cover.opening {
    animation:
        openCover
        .95s
        cubic-bezier(.22,.61,.36,1)
        forwards;
}

/* Closing animation */
.cover.closing {
    animation:
        closeCover
        .95s
        cubic-bezier(.22,.61,.36,1)
        forwards;
}

@keyframes openCover {
    from {
        transform:
            translateX(0)
            rotateY(0deg);
    }

    to {
        transform:
            translateX(-100%)
            rotateY(-180deg);
    }
}

@keyframes closeCover {
    from {
        transform:
            translateX(-100%)
            rotateY(-180deg);
    }

    to {
        transform:
            translateX(0)
            rotateY(0deg);
    }
}

/* =========================================================
   COVER FACES
========================================================= */

.cover-face {
    position: absolute;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 28px;

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
}

.cover-front {
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.05),
            transparent 35%,
            rgba(0,0,0,.10)
        ),
        #604535;

    color: #f5e9da;
}

.cover-back {
    background: #f5f0eb;

    transform: rotateY(180deg);

    color: #604535;
}

/* =========================================================
   COVER DESIGN
========================================================= */

.cover-frame {
    width: 100%;
    height: 100%;

    border: 1px solid rgba(255,255,255,.20);

    display: flex;
    flex-direction: column;
    justify-content: center;

.cover-eyebrow {

.cover-title {

.cover-subtitle {

.cover-heart {

/* =========================================================
   OPEN BUTTON
========================================================= */

.open-book-button {

    left: 50%;

    font-size: 10px;

}

.open-book-button:hover {
    background: rgba(255,255,255,.20);

    transform:

}

/* =========================================================
   INTRO
========================================================= */

.intro-left {

.intro-right {

.intro-copy {

/* =========================================================

========================================================= */

    align-items: center;
    justify-content: center;

/* =========================================================
   POLAROID

   IMPORTANT:
   Vertical 4:5 shape.
========================================================= */

.polaroid {
    position: relative;

    width: min(42%, 220px);

    min-width: 145px;

    aspect-ratio: 4 / 5;

    padding: 9px 9px 34px;

    background: #fffdf8;

    box-shadow:
        0 12px 25px rgba(50,35,25,.22),
        0 2px 5px rgba(50,35,25,.12);

    transform: rotate(-2deg);
}

/* Tape */
.polaroid::before {
    content: "";

    position: absolute;

    top: -9px;
    left: 50%;

    width: 65px;
    height: 18px;

    transform:
        translateX(-50%)
        rotate(-2deg);

    background: rgba(207,183,148,.78);

    z-index: 5;
}

.polaroid-image {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;

    background:
        linear-gradient(
            135deg,
            #e9ddcd,
            #cdb79c
        );
}

.photo-placeholder {
    width: 100%;
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            135deg,
            #eadfce,
            #cdb89f

    color: #806b58;

    font-family: Arial, sans-serif;

    font-size: 10px;

    letter-spacing: .12em;
}

.person-name {

    font-size: clamp(20px,2.5vw,30px);

    font-weight: normal;
}

.person-divider {
    color: #a1775d;

}

.tags {

    justify-content: center;

.tag {

    font-size: 9px;

    letter-spacing: .08em;

    color: #705b49;

/* =========================================================
   PERSON RIGHT
========================================================= */

.person-right {

    height: 100%;

    display: flex;
    flex-direction: column;

    justify-content: center;

.tribute {

.small-divider {

/* =========================================================
   VIDEO CARD
========================================================= */

.video-card {

    align-items: center;
    justify-content: center;

    gap: 15px;

    border: 1px solid rgba(96,69,53,.22);

.video-card:hover {

}

.play {

    color: #fff;

    align-items: center;
    justify-content: center;

    padding-left: 2px;
}

.video-text {
    display: flex;
    flex-direction: column;

    gap: 4px;
}

.video-text strong {
    font-weight: normal;

    font-size: 14px;
}

.video-text span {
    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: .12em;

    color: #8b725c;
}

/* =========================================================
   PAGE TURN LEAF

   TWO COMPLETELY SEPARATE FACES.

   This prevents mirrored text / ghosting.
========================================================= */

.page-leaf {
    position: absolute;

    top: 0;

    width: var(--page-width);
    height: var(--book-height);

    display: none;

    z-index: 50;

    transform-style: preserve-3d;

    pointer-events: none;
}

/* Next = right page turns toward left */
.page-leaf.next {
    left: 50%;

    transform-origin: left center;
}

/* Previous = left page turns toward right */
.page-leaf.previous {
    left: 0;

    transform-origin: right center;
}

.page-leaf.animating-next {
    display: block;

    animation:
        pageNext
        .85s
        cubic-bezier(.22,.61,.36,1)
        forwards;
}

.page-leaf.animating-previous {
    display: block;

    animation:
        pagePrevious
        .85s
        cubic-bezier(.22,.61,.36,1)
        forwards;
}

/* =========================================================
   PAGE FACES
========================================================= */

.page-front,
.page-back {
    position: absolute;

    inset: 0;

    overflow: hidden;

    background: #fdfbf7;

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;

    transform-style: preserve-3d;
}

.page-back {
    transform: rotateY(180deg);
}

/* =========================================================
   TURN ANIMATIONS
========================================================= */

@keyframes pageNext {

    0% {
        transform: rotateY(0deg);
        filter: brightness(1);
    }

    35% {
        filter: brightness(.86);
    }

    70% {
        filter: brightness(.95);
    }

    100% {
        transform: rotateY(-180deg);
        filter: brightness(1);
    }
}

@keyframes pagePrevious {

    0% {
        transform: rotateY(0deg);
        filter: brightness(1);
    }

    35% {
        filter: brightness(.86);
    }

    70% {
        filter: brightness(.95);
    }

    100% {
        transform: rotateY(180deg);
        filter: brightness(1);
    }
}

/* =========================================================
   TURNING PAGE SHADOW
========================================================= */

.page-leaf::after {
    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    background:
        linear-gradient(
            90deg,
            transparent 25%,
            rgba(0,0,0,.12) 50%,
            transparent 75%
        );

    opacity: 0;

    animation:
        turningShadow
        .85s
        ease-in-out
        forwards;
}

@keyframes turningShadow {

    0% {
        opacity: 0;
    }

    35% {
        opacity: .75;
    }

    70% {
        opacity: .30;
    }

    100% {
        opacity: 0;
    }
}

/* =========================================================
   NAVIGATION
========================================================= */

.controls {
    margin-top: 22px;

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 7px;

    padding: 8px 24px;

    background: rgba(30,26,23,.92);

    backdrop-filter: blur(8px);

    -webkit-backdrop-filter: blur(8px);

    border-radius: 30px;

    box-shadow:
        0 8px 25px rgba(0,0,0,.30);

    transition: opacity .25s ease;
}

.controls button {
    border: 0;

    background: transparent;

    color: #f5f0eb;

    font-family: Arial, sans-serif;

    font-weight: 500;

    font-size: .95rem;

    padding: 9px 13px;

    cursor: pointer;

    transition:

        color .2s ease;
}

.controls button:hover:not(:disabled) {
    background: rgba(255,255,255,.10);

    color: #fff;
}

.controls button:disabled {
    opacity: .35;

    cursor: default;
}

.spread-counter {
    min-width: 105px;

    text-align: center;

    color: #d8bb7d;

    font-family: Arial, sans-serif;

    font-size: .85rem;

    font-weight: 500;
}

/* =========================================================
   CLOSED STATE
========================================================= */

body.closed .book-spread,
body.closed .spine,
body.closed .page-leaf {
    visibility: hidden;
}

body.closed .controls {
    visibility: hidden;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    :root {
        --book-width: 94vw;
        --book-height: calc(94vw * .6);
    }

    .book-app {
        padding: 20px 10px;
    }

    .page-content {
        padding: 20px;
    }

    .polaroid {
        width: 48%;
    }

    .tribute {
        font-size: .88rem;
    }

    .video-card {
        min-height: 80px;
    }

    .controls {
        padding: 6px 10px;
    }

    .controls button {
        font-size: .75rem;
        padding: 8px 8px;
    }

    .spread-counter {
        min-width: 75px;
        font-size: .7rem;
    }
}
</style>
</head>

            <p class="intro-copy">

                Every chapter has a story...

                <br><br>

                And you made ours special.

                <br><br>

                A collection of memories,
                laughter and moments we'll
                always carry with us.

            </p>

        </div>
    `;
}


/* =========================================================
   PERSON SPREAD
========================================================= */

function renderPerson(person) {

    const photo = person.image

        ? `
            <img
                class="polaroid-image"
                src="${person.image}"
                alt="${person.name}">
          `

        : `
            <div class="photo-placeholder">
                YOUR PHOTO
            </div>
          `;


    leftPage.innerHTML = `

        <div class="person-left">

            <div class="polaroid">
                ${photo}
            </div>

            <h2 class="person-name">
                ${person.name}
            </h2>

            <div class="person-divider">
                ♡ ─── ♡
            </div>

            <div class="tags">

                ${person.tags.map(tag => `
                    <span class="tag">
                        ${tag}
                    </span>
                `).join("")}

            </div>

        </div>
    `;


    rightPage.innerHTML = `

        <div class="person-right">

            <div class="eyebrow">
                A MEMORY FOR YOU
            </div>

            <p class="tribute">
                ${person.message}
            </p>

            <div class="small-divider"></div>

            <div
                class="video-card"
                data-video="${person.video || ""}"
                onclick="watchVideo(this)"
            >

                <div class="play">
                    ▶
                </div>

                <div class="video-text">

                    <strong>
                        Watch Video
                    </strong>

                    <span>
                        A LITTLE MOMENT TO REMEMBER
                    </span>

                </div>

            </div>

        </div>
    `;
}


/* =========================================================
   RENDER CURRENT SPREAD
========================================================= */

function renderSpread(index) {

    const spread = spreads[index];

    if (!spread) return;


    if (spread.type === "intro") {

        renderIntro();

    } else {

        renderPerson(spread.person);

    }


    updateNavigation();
}


/* =========================================================
   NAVIGATION UI
========================================================= */

function updateNavigation() {

    /*
      Spread count starts at 0 for intro.
    */

    spreadCounter.textContent =
        `Spread ${currentSpread} of ${spreads.length - 1}`;


    previousButton.disabled =
        currentSpread === 0;


    nextButton.textContent =
        currentSpread === spreads.length - 1
            ? "Close Book"
            : "Next →";
}


/* =========================================================
   OPEN BOOK
========================================================= */

function openBook() {

    if (animating || bookOpen) return;

    animating = true;


    /*
      Render intro before the physical cover opens.
    */

    currentSpread = 0;

    renderSpread(0);


    document.body.classList.remove("closed");


    cover.classList.remove("closed");

    cover.classList.add("opening");


    cover.addEventListener(
        "animationend",
        function finishOpening() {

            cover.classList.remove("opening");

            cover.classList.add("open");

            bookOpen = true;

            animating = false;

        },
        { once: true }
    );
}


/* =========================================================
   CLOSE BOOK
========================================================= */

function closeBook() {

    if (animating || !bookOpen) return;

    animating = true;


    /*
      SAME cover geometry.
      SAME hinge.
      Reverse the exact opening animation.
    */

    cover.classList.remove("open");

    cover.classList.add("closing");


    cover.addEventListener(
        "animationend",
        function finishClosing() {

            cover.classList.remove("closing");

            cover.classList.add("closed");


            document.body.classList.add("closed");


            bookOpen = false;

            currentSpread = 0;

            renderSpread(0);

            animating = false;

        },
        { once: true }
    );
}


/* =========================================================
   NEXT SPREAD
========================================================= */

function nextSpread() {

    if (!bookOpen || animating) return;


    /*
      Final spread:
      Next physically closes the book.
    */

    if (
        currentSpread ===
        spreads.length - 1
    ) {

        closeBook();

        return;
    }


    turnSpread("next");
}


/* =========================================================
   PREVIOUS SPREAD
========================================================= */

function previousSpread() {

    if (!bookOpen || animating) return;


    if (currentSpread === 0) return;


    turnSpread("previous");
}


/* =========================================================
   ACTUAL SPREAD TURN
========================================================= */

function turnSpread(direction) {

    animating = true;


    const oldSpread = currentSpread;


    const newSpread =
        direction === "next"
            ? currentSpread + 1
            : currentSpread - 1;


    /*
      -------------------------------------------------------
      IMPORTANT

      The turning leaf contains TWO independent faces.

      We capture the page being physically turned,
      rather than putting both spread contents into one
      container.
      -------------------------------------------------------
    */

    if (direction === "next") {

        /*
          The RIGHT page is the page physically turning.
        */

        pageFront.innerHTML =
            rightPage.innerHTML;


        /*
          Back of the leaf shows the LEFT side of the
          destination spread.
        */

        const destination =
            spreads[newSpread];


        pageBack.innerHTML =
            createLeftPage(destination);


        pageLeaf.className =
            "page-leaf next animating-next";

    } else {

        /*
          The LEFT page is physically turning.
        */

        pageFront.innerHTML =
            leftPage.innerHTML;


        /*
          Back of leaf shows the RIGHT side of destination.
        */

        const destination =
            spreads[newSpread];


        pageBack.innerHTML =
            createRightPage(destination);


        pageLeaf.className =
            "page-leaf previous animating-previous";
    }


    /*
      IMPORTANT:
      Do NOT change the visible spread until the
      animation has completed.
    */

    pageLeaf.addEventListener(
        "animationend",
        function finishTurn() {

            currentSpread = newSpread;

            pageLeaf.className =
                "page-leaf";


            renderSpread(currentSpread);


            animating = false;

        },
        { once: true }
    );
}


/* =========================================================
   CREATE LEFT PAGE FOR TURNING LEAF
========================================================= */

function createLeftPage(spread) {

    if (spread.type === "intro") {

        return `
            <div class="page-content">
                ${`
                    <div class="intro-left">
                        <div class="memory-word">
                            MEMORIES
                        </div>
                        <div class="decor">
                            ✦ &nbsp; ♡ &nbsp; ✦
                        </div>
                    </div>
                `}
            </div>
        `;
    }


    const person = spread.person;


    const photo =
        person.image

            ? `
                <img
                    class="polaroid-image"
                    src="${person.image}"
                    alt="${person.name}">
              `

            : `
                <div class="photo-placeholder">
                    YOUR PHOTO
                </div>
              `;


    return `
        <div class="page-content">

            <div class="person-left">

                <div class="polaroid">
                    ${photo}
                </div>

                <h2 class="person-name">
                    ${person.name}
                </h2>

                <div class="person-divider">
                    ♡ ─── ♡
                </div>

                <div class="tags">
                    ${person.tags.map(tag => `
                        <span class="tag">
                            ${tag}
                        </span>
                    `).join("")}
                </div>

            </div>

        </div>
    `;
}


/* =========================================================
   CREATE RIGHT PAGE FOR TURNING LEAF
========================================================= */

function createRightPage(spread) {

    if (spread.type === "intro") {

        return `
            <div class="page-content">

                <div class="intro-right">

                    <div class="eyebrow">
                        CHAPTER ONE
                    </div>

                    <h2 class="intro-title">
                        OUR STORY
                    </h2>

                    <p class="intro-copy">
                        Every chapter has a story...
                        <br><br>
                        And you made ours special.
                        <br><br>
                        A collection of memories,
                        laughter and moments we'll
                        always carry with us.
                    </p>

                </div>

            </div>
        `;
    }


    const person = spread.person;


    return `
        <div class="page-content">

            <div class="person-right">

                <div class="eyebrow">
                    A MEMORY FOR YOU
                </div>

                <p class="tribute">
                    ${person.message}
                </p>

                <div class="small-divider"></div>

                <div class="video-card">

                    <div class="play">
                        ▶
                    </div>

                    <div class="video-text">

                        <strong>
                            Watch Video
                        </strong>

                        <span>
                            A LITTLE MOMENT TO REMEMBER
                        </span>

                    </div>

                </div>

            </div>

        </div>
    `;
}


/* =========================================================
   VIDEO
========================================================= */

function watchVideo(card) {

    const url =
        card.dataset.video;


    if (!url) {

        alert(
            "Add this person's video URL in the people array."
        );

        return;
    }


    window.open(
        url,
        "_blank"
    );
}


/* =========================================================
   BUTTON EVENTS
========================================================= */

openButton.addEventListener(
    "click",
    openBook
);


previousButton.addEventListener(
    "click",
    previousSpread
);


nextButton.addEventListener(
    "click",
    nextSpread
);


closeButton.addEventListener(
    "click",
    closeBook
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (event.key === "ArrowRight") {
            nextSpread();
        }

        if (event.key === "ArrowLeft") {
            previousSpread();
        }

        if (event.key === "Escape") {
            closeBook();
        }

    }
);


/* =========================================================
   INITIALIZE
========================================================= */

renderSpread(0);

</script>

</body>
</html>
