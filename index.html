<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SAI MEMORY BOOK</title>

<style>
/* =========================================================
   RESET
========================================================= */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  min-height: 100%;
}

body {
  background:
    radial-gradient(circle at center, #403731 0%, #2b2623 70%);
  color: #342a25;
  font-family: Georgia, "Times New Roman", serif;
  overflow-x: hidden;
}

/* =========================================================
   VARIABLES
========================================================= */

:root {
  --book-width: min(92vw, 1000px);
  --book-height: min(calc(92vw * 0.6), 600px);
  --page-width: calc(var(--book-width) / 2);

  --paper: #f5eddf;
  --paper-dark: #e8dac4;
  --ink: #3b302a;
  --brown: #4a3024;
  --gold: #b99663;
}

/* =========================================================
   APP
========================================================= */

.book-app {
  width: 100%;
  min-height: 100vh;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  padding: 25px 15px;
}

/* =========================================================
   BOOK STAGE
========================================================= */

.book-stage {
  position: relative;

  width: var(--book-width);
  height: var(--book-height);

  perspective: 2200px;
  transform-style: preserve-3d;

  z-index: 1;
}

/* =========================================================
   STATIC OPEN BOOK
========================================================= */

.book-spread {
  position: absolute;
  inset: 0;

  display: grid;
  grid-template-columns: 1fr 1fr;

  overflow: hidden;

  border-radius: 5px;

  background: var(--paper);

  box-shadow:
    0 30px 60px rgba(0,0,0,.45),
    0 8px 15px rgba(0,0,0,.3);

  transform-style: preserve-3d;

  z-index: 10;
}

/* =========================================================
   PAGES
========================================================= */

.book-page {
  position: relative;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background:
    radial-gradient(
      circle at 20% 20%,
      rgba(150,110,70,.07) 0 1px,
      transparent 2px
    ),
    radial-gradient(
      circle at 80% 70%,
      rgba(120,90,60,.05) 0 1px,
      transparent 2px
    ),
    var(--paper);

  padding: 45px;

  backface-visibility: hidden;
}

.book-page.left {
  border-right: 1px solid rgba(70,50,35,.12);
}

.book-page.right {
  border-left: 1px solid rgba(70,50,35,.12);
}

/* =========================================================
   SPINE
========================================================= */

.spine {
  position: absolute;

  left: 50%;
  top: 0;

  width: 3px;
  height: 100%;

  transform: translateX(-50%);

  background:
    linear-gradient(
      to right,
      rgba(0,0,0,.18),
      rgba(255,255,255,.18),
      rgba(0,0,0,.15)
    );

  z-index: 30;

  pointer-events: none;
}

/* =========================================================
   PAGE CONTENT
========================================================= */

.page-content {
  width: 100%;
  height: 100%;

  display: flex;
  flex-direction: column;
  justify-content: center;

  position: relative;
}

/* =========================================================
   INTRO
========================================================= */

.intro-left {
  align-items: center;
  text-align: center;
}

.intro-left .small {
  letter-spacing: 5px;
  font-size: 12px;
  color: #806d5a;
  margin-bottom: 20px;
}

.intro-left h1 {
  font-size: clamp(38px, 5vw, 65px);
  letter-spacing: 7px;
  font-weight: normal;
}

.intro-left .line {
  width: 100px;
  height: 1px;
  background: var(--gold);
  margin: 25px auto;
}

.intro-right {
  justify-content: center;
}

.chapter {
  font-size: 12px;
  letter-spacing: 4px;
  color: #90734e;
  margin-bottom: 18px;
}

.intro-title {
  font-size: clamp(30px, 4vw, 48px);
  margin-bottom: 25px;
  font-weight: normal;
}

.intro-text {
  max-width: 420px;
  font-size: 18px;
  line-height: 1.8;
  color: #55483e;
}

/* =========================================================
   PERSON PAGE
========================================================= */

.person-left {
  align-items: center;
  text-align: center;
}

.polaroid {
  width: min(220px, 65%);
  aspect-ratio: 4 / 5;

  background: #fff;

  padding: 10px 10px 45px;

  box-shadow:
    0 15px 30px rgba(0,0,0,.25);

  transform: rotate(-2deg);

  position: relative;
}

.polaroid-image {
  width: 100%;
  height: 100%;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;

  background:
    linear-gradient(
      135deg,
      #d8c7b0,
      #efe5d5
    );

  color: #7a6755;
  font-size: 13px;
}

.polaroid-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.tape {
  position: absolute;

  width: 70px;
  height: 22px;

  background: rgba(218,195,150,.75);

  top: -10px;
  left: 50%;

  transform: translateX(-50%) rotate(2deg);

  z-index: 2;
}

.person-name {
  margin-top: 30px;

  font-size: clamp(25px, 3vw, 38px);

  letter-spacing: 2px;
}

.person-divider {
  width: 70px;
  height: 1px;

  background: var(--gold);

  margin: 15px auto;
}

.tags {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 7px;
}

.tag {
  border: 1px solid #c9b89d;

  border-radius: 20px;

  padding: 6px 12px;

  font-size: 11px;

  color: #715f4e;
}

/* =========================================================
   MESSAGE
========================================================= */

.person-right {
  justify-content: center;
}

.message-title {
  font-size: 12px;
  letter-spacing: 4px;
  color: #90734e;

  margin-bottom: 20px;
}

.message {
  max-width: 420px;

  font-size: clamp(19px, 2.2vw, 25px);

  line-height: 1.8;

  color: #40342d;
}

.message-heart {
  font-size: 22px;

  margin: 20px 0;

  color: #8f5c52;
}

.video-card {
  width: 100%;
  max-width: 360px;

  margin-top: 25px;

  padding: 15px 18px;

  border: 1px solid #cdbda4;

  background: rgba(255,255,255,.35);

  display: flex;
  align-items: center;
  gap: 15px;

  cursor: pointer;

  transition:
    transform .2s ease,
    background .2s ease;
}

.video-card:hover {
  transform: translateY(-2px);
  background: rgba(255,255,255,.65);
}

.play {
  width: 38px;
  height: 38px;

  border-radius: 50%;

  background: var(--brown);
  color: white;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 13px;
}

.video-text {
  font-size: 13px;
  letter-spacing: 1px;
}

/* =========================================================
   PHYSICAL PAGE LEAF
========================================================= */

.page-leaf {
  position: absolute;

  top: 0;

  width: var(--page-width);
  height: var(--book-height);

  display: block;

  transform-style: preserve-3d;

  pointer-events: none;

  visibility: hidden;

  will-change: transform;

  transition:
    transform 760ms cubic-bezier(.22,.61,.36,1);

  z-index: 500;

  transform: translateZ(20px);
}

.page-leaf.next {
  left: 50%;
  transform-origin: left center;
}

.page-leaf.previous {
  left: 0;
  transform-origin: right center;
}

.page-leaf.flipping {
  visibility: visible;
}

/* =========================================================
   PAGE LEAF FACES
========================================================= */

.page-front,
.page-back {
  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background:
    radial-gradient(
      circle at 20% 20%,
      rgba(150,110,70,.07) 0 1px,
      transparent 2px
    ),
    var(--paper);

  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;

  transform-style: preserve-3d;

  box-shadow:
    0 5px 15px rgba(0,0,0,.18);
}

.page-back {
  transform: rotateY(180deg);
}

/* =========================================================
   COVER
========================================================= */

.cover {
  position: absolute;

  top: 0;
  left: 50%;

  width: var(--page-width);
  height: var(--book-height);

  transform-origin: left center;

  transform-style: preserve-3d;

  z-index: 1000;

  transition:
    transform 900ms cubic-bezier(.22,.61,.36,1);

  box-shadow:
    8px 10px 25px rgba(0,0,0,.35);

  pointer-events: auto;
}

.cover.closed {
  transform:
    translateX(0)
    rotateY(0deg);
}

.cover.open {
  transform:
    translateX(-100%)
    rotateY(-180deg);
}

.cover-face {
  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;

  transform-style: preserve-3d;
}

.cover-front {
  background:
    linear-gradient(
      135deg,
      #563729,
      #39251d
    );

  color: #ead8b6;

  display: flex;
  align-items: center;
  justify-content: center;

  text-align: center;

  padding: 30px;
}

.cover-back {
  transform: rotateY(180deg);

  background:
    linear-gradient(
      135deg,
      #f1e5d2,
      #e4d4bb
    );
}

.cover-content {
  width: 100%;
}

.cover-small {
  font-size: 11px;
  letter-spacing: 5px;
  margin-bottom: 25px;
  opacity: .8;
}

.cover-title {
  font-size: clamp(25px, 4vw, 45px);
  letter-spacing: 3px;
  line-height: 1.3;
}

.cover-year {
  margin-top: 18px;

  font-size: 13px;

  letter-spacing: 4px;

  color: #c6a775;
}

.cover-heart {
  font-size: 26px;
  margin: 25px 0;
}

.open-button {
  border: 1px solid #c6a775;

  background: transparent;

  color: #ead8b6;

  padding: 12px 20px;

  font-family: inherit;

  font-size: 12px;

  letter-spacing: 2px;

  cursor: pointer;

  transition:
    background .2s ease,
    color .2s ease;
}

.open-button:hover {
  background: #ead8b6;
  color: #39251d;
}

/* =========================================================
   CONTROLS
========================================================= */

.controls {
  position: relative;

  z-index: 2000;

  pointer-events: auto;

  margin-top: 22px;

  display: flex;

  align-items: center;
  justify-content: center;

  gap: 10px;

  padding: 10px 15px;

  border-radius: 40px;

  background: rgba(20,16,14,.9);

  box-shadow:
    0 8px 25px rgba(0,0,0,.35);

  transition: opacity .25s ease;
}

.controls button {
  position: relative;

  z-index: 2001;

  pointer-events: auto;

  cursor: pointer;

  border: 1px solid rgba(230,215,190,.35);

  background: rgba(255,255,255,.08);

  color: #f4eadb;

  padding: 10px 15px;

  border-radius: 20px;

  font-family: inherit;

  font-size: 12px;

  transition:
    background .2s ease,
    opacity .2s ease;
}

.controls button:hover:not(:disabled) {
  background: rgba(255,255,255,.18);
}

.controls button:disabled {
  opacity: .35;
  cursor: default;
}

#spreadCounter {
  min-width: 110px;

  text-align: center;

  color: #d7c5aa;

  font-size: 12px;
}

/* Hide controls while book is closed */

body.closed .controls {
  opacity: 0;
  pointer-events: none;
}

/* =========================================================
   CLOSED STATE
========================================================= */

body.closed .book-spread,
body.closed .spine,
body.closed .page-leaf {
  visibility: hidden;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 700px) {

  :root {
    --book-width: 94vw;
    --book-height: 56.4vw;
  }

  .book-page {
    padding: 25px;
  }

  .intro-title {
    font-size: 25px;
  }

  .intro-text {
    font-size: 13px;
    line-height: 1.6;
  }

  .message {
    font-size: 15px;
    line-height: 1.6;
  }

  .polaroid {
    width: 150px;
  }

  .person-name {
    font-size: 22px;
  }

  .tag {
    font-size: 9px;
    padding: 4px 8px;
  }

  .controls {
    gap: 5px;
    padding: 7px;
  }

  .controls button {
    padding: 8px 10px;
    font-size: 10px;
  }

  #spreadCounter {
    min-width: 80px;
    font-size: 10px;
  }
}
</style>
</head>

<body class="closed">

<div class="book-app">

  <!-- =====================================================
       BOOK
  ====================================================== -->

  <div class="book-stage" id="bookStage">

    <!-- STATIC OPEN SPREAD -->
    <div class="book-spread">

      <section class="book-page left">
        <div id="leftPage"></div>
      </section>

      <section class="book-page right">
        <div id="rightPage"></div>
      </section>

    </div>

    <!-- SPINE -->
    <div class="spine"></div>

    <!-- PHYSICAL TURNING PAGE -->
    <div class="page-leaf" id="pageLeaf">

      <div class="page-front" id="pageFront"></div>

      <div class="page-back" id="pageBack"></div>

    </div>

    <!-- =================================================
         FRONT COVER
    ================================================== -->

    <div class="cover closed" id="cover">

      <div class="cover-face cover-front">

        <div class="cover-content">

          <div class="cover-small">
            A COLLECTION OF
          </div>

          <div class="cover-title">
            SAI<br>
            MEMORY BOOK
          </div>

          <div class="cover-year">
            FAREWELL 2026
          </div>

          <div class="cover-heart">
            ♥
          </div>

          <button
            class="open-button"
            id="openButton"
            type="button"
          >
            OPEN BOOK →
          </button>

        </div>

      </div>

      <div class="cover-face cover-back"></div>

    </div>

  </div>

  <!-- =====================================================
       NAVIGATION
  ====================================================== -->

  <div class="controls" id="controls">

    <button
      id="previousButton"
      type="button"
    >
      ← Previous
    </button>

    <button
      id="closeButton"
      type="button"
    >
      Close Book
    </button>

    <div id="spreadCounter">
      Spread 1 of 16
    </div>

    <button
      id="nextButton"
      type="button"
    >
      Next →
    </button>

  </div>

</div>


<script>
/* =========================================================
   DATA
========================================================= */

const people = [

  {
    name: "Sai",
    image: "",
    tags: ["Friendship", "Laughter", "Memories"],
    message:
      "Some people become part of our story without us realizing how important they will become. Thank you for every laugh, every conversation and every memory.",
    video: ""
  },

  {
    name: "Person 2",
    image: "",
    tags: ["Good Times", "Friends", "Memories"],
    message:
      "The best memories are often the simplest moments that we never planned.",
    video: ""
  },

  {
    name: "Person 3",
    image: "",
    tags: ["Together", "Friendship", "Moments"],
    message:
      "Every chapter becomes special because of the people who are part of it.",
    video: ""
  },

  {
    name: "Person 4",
    image: "",
    tags: ["Laughs", "Memories"],
    message:
      "Years from now, these little moments will still make us smile.",
    video: ""
  },

  {
    name: "Person 5",
    image: "",
    tags: ["Forever", "Memories"],
    message:
      "Some memories stay with us long after the moment has passed.",
    video: ""
  },

  {
    name: "Person 6",
    image: "",
    tags: ["Thank You", "Friends"],
    message:
      "Thank you for being part of a chapter that will always mean something.",
    video: ""
  },

  {
    name: "Person 7",
    image: "",
    tags: ["Journey", "Memories"],
    message:
      "Life moves forward, but some memories travel with us wherever we go.",
    video: ""
  },

  {
    name: "Person 8",
    image: "",
    tags: ["Laughter", "Together"],
    message:
      "The laughter, random conversations and little moments are what we remember most.",
    video: ""
  },

  {
    name: "Person 9",
    image: "",
    tags: ["Story", "Friendship"],
    message:
      "Every person leaves something behind in the story we share.",
    video: ""
  },

  {
    name: "Person 10",
    image: "",
    tags: ["Beautiful Times", "Memories"],
    message:
      "One day we will look back and realize how beautiful this chapter really was.",
    video: ""
  },

  {
    name: "Person 11",
    image: "",
    tags: ["Friendship", "Moments"],
    message:
      "Some friendships are made from hundreds of tiny moments that slowly become unforgettable.",
    video: ""
  },

  {
    name: "Person 12",
    image: "",
    tags: ["Journey", "Together"],
    message:
      "Wherever life takes us next, this part of the journey will always remain ours.",
    video: ""
  },

  {
    name: "Person 13",
    image: "",
    tags: ["Thank You", "Memories"],
    message:
      "Thank you for the memories that made ordinary days feel extraordinary.",
    video: ""
  },

  {
    name: "Person 14",
    image: "",
    tags: ["Next Chapter", "Forever"],
    message:
      "The chapter may be ending, but the memories are staying.",
    video: ""
  },

  {
    name: "Person 15",
    image: "",
    tags: ["Until Next Time", "Forever"],
    message:
      "Until the next chapter... may all the memories we created together continue to make us smile.",
    video: ""
  }

];


/* =========================================================
   SPREADS
========================================================= */

const spreads = [
  { type: "intro" },
  ...people.map(person => ({
    type: "person",
    person
  }))
];


/* =========================================================
   ELEMENTS
========================================================= */

const cover =
  document.getElementById("cover");

const openButton =
  document.getElementById("openButton");

const previousButton =
  document.getElementById("previousButton");

const nextButton =
  document.getElementById("nextButton");

const closeButton =
  document.getElementById("closeButton");

const spreadCounter =
  document.getElementById("spreadCounter");

const leftPage =
  document.getElementById("leftPage");

const rightPage =
  document.getElementById("rightPage");

const pageLeaf =
  document.getElementById("pageLeaf");

const pageFront =
  document.getElementById("pageFront");

const pageBack =
  document.getElementById("pageBack");


/* =========================================================
   STATE
========================================================= */

let currentSpread = 0;

let bookOpen = false;

let animating = false;


/* =========================================================
   INTRO PAGE
========================================================= */

function createIntroLeft() {

  return `
    <div class="page-content intro-left">

      <div class="small">
        OUR MEMORIES
      </div>

      <h1>
        MEMORIES
      </h1>

      <div class="line"></div>

      <div>
        ♥
      </div>

    </div>
  `;
}


function createIntroRight() {

  return `
    <div class="page-content intro-right">

      <div class="chapter">
        CHAPTER ONE
      </div>

      <div class="intro-title">
        OUR STORY
      </div>

      <div class="intro-text">
        A little collection of people,
        laughter, conversations and
        moments that made this chapter
        unforgettable.
      </div>

    </div>
  `;
}


/* =========================================================
   PERSON PAGE
========================================================= */

function createPersonLeft(person) {

  const imageHTML = person.image
    ? `<img src="${person.image}" alt="${person.name}">`
    : `<span>Your photo</span>`;

  const tagsHTML = person.tags
    .map(tag => `<span class="tag">${tag}</span>`)
    .join("");

  return `
    <div class="page-content person-left">

      <div class="polaroid">

        <div class="tape"></div>

        <div class="polaroid-image">
          ${imageHTML}
        </div>

      </div>

      <div class="person-name">
        ${person.name}
      </div>

      <div class="person-divider"></div>

      <div class="tags">
        ${tagsHTML}
      </div>

    </div>
  `;
}


function createPersonRight(person) {

  return `
    <div class="page-content person-right">

      <div class="message-title">
        A MEMORY FOR YOU
      </div>

      <div class="message">
        ${person.message}
      </div>

      <div class="message-heart">
        ♥
      </div>

      <div
        class="video-card"
        onclick="watchVideo()"
      >

        <div class="play">
          ▶
        </div>

        <div class="video-text">
          WATCH VIDEO
        </div>

      </div>

    </div>
  `;
}


/* =========================================================
   RENDER SPREAD
========================================================= */

function renderSpread(index) {

  const spread = spreads[index];

  if (!spread) return;

  if (spread.type === "intro") {

    leftPage.innerHTML =
      createIntroLeft();

    rightPage.innerHTML =
      createIntroRight();

  } else {

    leftPage.innerHTML =
      createPersonLeft(spread.person);

    rightPage.innerHTML =
      createPersonRight(spread.person);
  }

  updateNavigation();
}


/* =========================================================
   LEAF CONTENT
========================================================= */

function leftHTML(index) {

  const spread = spreads[index];

  if (!spread) return "";

  if (spread.type === "intro") {
    return createIntroLeft();
  }

  return createPersonLeft(spread.person);
}


function rightHTML(index) {

  const spread = spreads[index];

  if (!spread) return "";

  if (spread.type === "intro") {
    return createIntroRight();
  }

  return createPersonRight(spread.person);
}


/* =========================================================
   OPEN BOOK
========================================================= */

function openBook() {

  if (bookOpen || animating) return;

  animating = true;

  currentSpread = 0;

  renderSpread(0);

  document.body.classList.remove("closed");

  cover.classList.remove("open");
  cover.classList.add("closed");

  void cover.offsetWidth;

  requestAnimationFrame(() => {

    cover.classList.remove("closed");
    cover.classList.add("open");

  });

  setTimeout(() => {

    bookOpen = true;

    animating = false;

    updateNavigation();

  }, 950);
}


/* =========================================================
   CLOSE BOOK
========================================================= */

function closeBook() {

  if (!bookOpen || animating) return;

  animating = true;

  cover.classList.remove("closed");
  cover.classList.add("open");

  void cover.offsetWidth;

  requestAnimationFrame(() => {

    cover.classList.remove("open");
    cover.classList.add("closed");

  });

  setTimeout(() => {

    bookOpen = false;

    currentSpread = 0;

    pageLeaf.className = "page-leaf";

    pageLeaf.style.transform = "";

    pageFront.innerHTML = "";
    pageBack.innerHTML = "";

    document.body.classList.add("closed");

    renderSpread(0);

    animating = false;

    updateNavigation();

  }, 950);
}


/* =========================================================
   PAGE TURN
========================================================= */

function turnSpread(direction) {

  if (!bookOpen || animating) return;

  const destination =
    currentSpread + direction;

  if (
    destination < 0 ||
    destination >= spreads.length
  ) {
    return;
  }

  animating = true;

  /* =======================================================
     NEXT
  ====================================================== */

  if (direction === 1) {

    pageFront.innerHTML =
      rightHTML(currentSpread);

    pageBack.innerHTML =
      leftHTML(destination);

    pageLeaf.className =
      "page-leaf next flipping";

    pageLeaf.style.zIndex = "600";

    pageLeaf.style.transform =
      "rotateY(0deg)";

    void pageLeaf.offsetWidth;

    requestAnimationFrame(() => {

      pageLeaf.style.transform =
        "rotateY(-180deg)";

    });

  }

  /* =======================================================
     PREVIOUS
  ====================================================== */

  else {

    pageFront.innerHTML =
      leftHTML(currentSpread);

    pageBack.innerHTML =
      rightHTML(destination);

    pageLeaf.className =
      "page-leaf previous flipping";

    pageLeaf.style.zIndex = "600";

    pageLeaf.style.transform =
      "rotateY(0deg)";

    void pageLeaf.offsetWidth;

    requestAnimationFrame(() => {

      pageLeaf.style.transform =
        "rotateY(180deg)";

    });

  }


  /* =======================================================
     COMPLETE TURN
  ====================================================== */

  setTimeout(() => {

    currentSpread = destination;

    pageLeaf.className =
      "page-leaf";

    pageLeaf.style.transform = "";

    pageLeaf.style.zIndex = "";

    pageFront.innerHTML = "";
    pageBack.innerHTML = "";

    renderSpread(currentSpread);

    animating = false;

    updateNavigation();

  }, 800);
}


/* =========================================================
   NAVIGATION
========================================================= */

function nextSpread() {

  if (!bookOpen || animating) return;

  /*
    Person 15 is the final spread.
    Next closes the physical book.
  */

  if (
    currentSpread >= spreads.length - 1
  ) {

    closeBook();

    return;
  }

  turnSpread(1);
}


function previousSpread() {

  if (!bookOpen || animating) return;

  if (currentSpread <= 0) return;

  turnSpread(-1);
}


/* =========================================================
   NAVIGATION UI
========================================================= */

function updateNavigation() {

  spreadCounter.textContent =
    `Spread ${currentSpread + 1} of ${spreads.length}`;

  previousButton.disabled =
    !bookOpen ||
    currentSpread === 0 ||
    animating;

  nextButton.disabled =
    !bookOpen ||
    animating;

  closeButton.disabled =
    !bookOpen ||
    animating;
}


/* =========================================================
   VIDEO
========================================================= */

function watchVideo() {

  const person =
    spreads[currentSpread]?.person;

  if (!person) return;

  if (person.video) {

    window.open(
      person.video,
      "_blank"
    );

  } else {

    alert(
      `Video for ${person.name} will be added here.`
    );

  }
}


/* =========================================================
   BUTTON EVENTS
========================================================= */

openButton.addEventListener(
  "click",
  openBook
);

previousButton.addEventListener(
  "click",
  previousSpread
);

nextButton.addEventListener(
  "click",
  nextSpread
);

closeButton.addEventListener(
  "click",
  closeBook
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if (!bookOpen) return;

    if (event.key === "ArrowRight") {
      nextSpread();
    }

    if (event.key === "ArrowLeft") {
      previousSpread();
    }

    if (event.key === "Escape") {
      closeBook();
    }

  }
);


/* =========================================================
   INITIALIZE
========================================================= */

renderSpread(0);

document.body.classList.add("closed");

cover.classList.remove("open");
cover.classList.add("closed");

bookOpen = false;
animating = false;

updateNavigation();

</script>

</body>
</html>
