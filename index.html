<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAI MEMORY BOOK</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    background: #2c2724;
    font-family: Georgia, "Times New Roman", serif;
    color: #3d3027;
    overflow-x: hidden;
}

/* =========================================================
   VARIABLES
========================================================= */

:root {
    --book-width: min(92vw, 1000px);
    --book-height: min(calc(92vw * .6), 600px);
    --page-width: calc(var(--book-width) / 2);

    --paper: #fdfbf7;
    --paper-alt: #f5f0eb;

    --brown: #604535;
    --brown-dark: #34271f;
    --gold: #c6a46a;

    --flip-duration: 720ms;

    --shadow:
        0 25px 60px rgba(0,0,0,.40),
        0 8px 20px rgba(0,0,0,.25);
}

/* =========================================================
   APP
========================================================= */

.book-app {
    width: 100%;
    min-height: 100vh;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    padding: 30px 20px;
}

/* =========================================================
   BOOK STAGE
========================================================= */

.book-stage {
    position: relative;

    width: var(--book-width);
    height: var(--book-height);

    flex-shrink: 0;

    perspective: 1800px;
    perspective-origin: 50% 50%;

    transform-style: preserve-3d;

    isolation: isolate;
}

/* =========================================================
   OPEN SPREAD
========================================================= */

.book-spread {
    position: absolute;
    inset: 0;

    display: grid;
    grid-template-columns: 1fr 1fr;

    overflow: hidden;

    background: var(--paper);

    border-radius: 5px;

    box-shadow: var(--shadow);

    transform-style: preserve-3d;

    z-index: 1;
}

/* =========================================================
   PAGE
========================================================= */

.book-page {
    position: relative;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background:
        linear-gradient(
            rgba(255,255,255,.18),
            rgba(255,255,255,.18)
        ),
        repeating-linear-gradient(
            0deg,
            rgba(100,70,40,.025) 0px,
            rgba(100,70,40,.025) 1px,
            transparent 1px,
            transparent 4px
        ),
        var(--paper);

    transform-style: preserve-3d;

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
}

.book-page.left {
    border-right: 1px solid rgba(70,50,35,.15);
}

.book-page.right {
    border-left: 1px solid rgba(70,50,35,.10);
}

.page-content {
    width: 100%;
    height: 100%;
    padding: clamp(25px, 4vw, 55px);
}

/* =========================================================
   SPINE
========================================================= */

.spine {
    position: absolute;

    top: 0;
    left: 50%;

    width: 18px;
    height: 100%;

    transform:
        translateX(-50%)
        translateZ(5px);

    pointer-events: none;

    z-index: 20;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(50,35,25,.12),
            rgba(50,35,25,.20),
            rgba(50,35,25,.08),
            transparent
        );
}

/* =========================================================
   COVER
========================================================= */

.cover {
    position: absolute;

    top: 0;
    left: 50%;

    width: var(--page-width);
    height: var(--book-height);

    transform-origin: left center;

    transform-style: preserve-3d;

    background: #604535;

    border-radius: 4px;

    z-index: 100;

    box-shadow:
        10px 18px 35px rgba(0,0,0,.40);

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;

    will-change: transform;
}

/*
   CLOSED:
   occupies exactly the right half of the open-book
   coordinate system.
*/

.cover.closed {
    transform: translateX(0) rotateY(0deg);
}

/*
   OPEN:
   rotates around the left hinge and lands over the
   left page.
*/

.cover.open {
    transform: translateX(-100%) rotateY(-180deg);
}

/* =========================================================
   COVER FACES
========================================================= */

.cover-face {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 28px;

    overflow: hidden;

    transform-style: preserve-3d;

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;

    background: #f5f0eb;
}

.cover-front {
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.05),
            transparent 35%,
            rgba(0,0,0,.10)
        ),
        #604535;

    color: #f5e9da;
}

.cover-back {
    transform: rotateY(180deg);

    background: #f5f0eb;

    color: #604535;
}

/* =========================================================
   COVER DESIGN
========================================================= */

.cover-frame {
    width: 100%;
    height: 100%;

    border: 1px solid rgba(255,255,255,.20);

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    text-align: center;
}

.cover-eyebrow {
    font-family: Arial, sans-serif;

    font-size: 10px;
    letter-spacing: .28em;

    opacity: .75;

    margin-bottom: 18px;
}

.cover-title {
    margin: 0;

    font-size: clamp(27px,4vw,48px);

    font-weight: normal;

    letter-spacing: .08em;
}

.cover-subtitle {
    margin-top: 15px;

    font-size: 14px;

    letter-spacing: .18em;

    opacity: .85;
}

.cover-heart {
    margin-top: 25px;

    font-size: 25px;
}

/* =========================================================
   OPEN BUTTON
========================================================= */

.open-book-button {
    position: absolute;

    bottom: 35px;
    left: 50%;

    transform: translateX(-50%);

    border: 1px solid rgba(255,255,255,.35);

    background: rgba(255,255,255,.10);

    color: #fff5e9;

    padding: 11px 20px;

    font-family: Arial, sans-serif;

    font-size: 10px;

    letter-spacing: .16em;

    cursor: pointer;

    transition:
        background .2s ease,
        transform .2s ease;
}

.open-book-button:hover {
    background: rgba(255,255,255,.20);

    transform:
        translateX(-50%)
        translateY(-1px);
}

/* =========================================================
   INTRO
========================================================= */

.intro-left {
    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;
}

.memory-word {
    font-size: clamp(30px,4vw,50px);

    letter-spacing: .12em;

    color: #604535;
}

.decor {
    margin-top: 20px;

    color: #9d8168;

    letter-spacing: .3em;
}

.intro-right {
    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;

    justify-content: center;
}

.eyebrow {
    font-family: Arial, sans-serif;

    font-size: 10px;

    letter-spacing: .25em;

    color: #92755d;

    margin-bottom: 15px;
}

.intro-title {
    margin: 0 0 20px;

    font-size: clamp(28px,4vw,46px);

    font-weight: normal;
}

.intro-copy {
    max-width: 440px;

    font-size: 16px;

    line-height: 1.8;

    color: #6b5645;
}

/* =========================================================
   PERSON LEFT
========================================================= */

.person-left {
    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;
}

/* =========================================================
   POLAROID
========================================================= */

.polaroid {
    position: relative;

    width: min(42%,220px);

    min-width: 145px;

    aspect-ratio: 4 / 5;

    padding: 9px 9px 34px;

    background: #fffdf8;

    box-shadow:
        0 12px 25px rgba(50,35,25,.22),
        0 2px 5px rgba(50,35,25,.12);

    transform: rotate(-2deg);
}

.polaroid::before {
    content: "";

    position: absolute;

    top: -9px;
    left: 50%;

    width: 65px;
    height: 18px;

    transform:
        translateX(-50%)
        rotate(-2deg);

    background: rgba(207,183,148,.78);

    z-index: 5;
}

.polaroid-image,
.photo-placeholder {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;
}

.photo-placeholder {
    display: flex;

    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            135deg,
            #eadfce,
            #cdb89f
        );

    color: #806b58;

    font-family: Arial, sans-serif;

    font-size: 10px;

    letter-spacing: .12em;
}

.person-name {
    margin: 18px 0 6px;

    font-size: clamp(20px,2.5vw,30px);

    font-weight: normal;
}

.person-divider {
    color: #a1775d;

    margin: 3px 0 10px;

    letter-spacing: .2em;
}

.tags {
    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    gap: 6px;
}

.tag {
    border: 1px solid rgba(96,69,53,.25);

    border-radius: 20px;

    padding: 5px 9px;

    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: .08em;

    color: #705b49;
}

/* =========================================================
   PERSON RIGHT
========================================================= */

.person-right {
    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;

    justify-content: center;
}

.tribute {
    max-width: 450px;

    margin: 0;

    font-size: 1rem;

    line-height: 1.6;

    color: #49382d;
}

.small-divider {
    width: 65px;
    height: 1px;

    margin: 22px 0;

    background: rgba(96,69,53,.30);
}

/* =========================================================
   VIDEO
========================================================= */

.video-card {
    width: min(100%,390px);

    min-height: 105px;

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 15px;

    border: 1px solid rgba(96,69,53,.22);

    background: rgba(255,255,255,.48);

    cursor: pointer;

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.video-card:hover {
    transform: translateY(-2px);

    box-shadow:
        0 10px 22px rgba(50,35,25,.13);
}

.play {
    width: 42px;
    height: 42px;

    border-radius: 50%;

    background: #604535;

    color: #fff;

    display: flex;

    align-items: center;
    justify-content: center;

    font-family: Arial, sans-serif;

    padding-left: 2px;
}

.video-text {
    display: flex;
    flex-direction: column;

    gap: 4px;
}

.video-text strong {
    font-weight: normal;

    font-size: 14px;
}

.video-text span {
    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: .12em;

    color: #8b725c;
}

/* =========================================================
   PHYSICAL FLIPPING SHEET
========================================================= */

.page-leaf {
    position: absolute;

    top: 0;

    width: var(--page-width);
    height: var(--book-height);

    display: block;

    transform-style: preserve-3d;

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;

    pointer-events: none;

    visibility: hidden;

    z-index: 200;

    will-change: transform;

    contain: layout paint style;
}

/* Next:
   RIGHT PAGE -> LEFT
*/

.page-leaf.next {
    left: 50%;

    transform-origin: left center;

    transform: rotateY(0deg);
}

/* Previous:
   LEFT PAGE -> RIGHT
*/

.page-leaf.previous {
    left: 0;

    transform-origin: right center;

    transform: rotateY(0deg);
}

/* =========================================================
   PAGE FACES
========================================================= */

.page-front,
.page-back {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #fdfbf7;

    transform-style: preserve-3d;

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;

    isolation: isolate;
}

.page-front {
    transform: rotateY(0deg);
}

.page-back {
    transform: rotateY(180deg);
}

/*
   Force every generated page to have an opaque paper
   surface. This prevents black/transparent bleed-through.
*/

.page-front::before,
.page-back::before {
    content: "";

    position: absolute;

    inset: 0;

    background: #fdfbf7;

    z-index: -1;

    pointer-events: none;
}

/* =========================================================
   ACTIVE FLIP STATES
========================================================= */

.page-leaf.flipping-next {
    visibility: visible;

    z-index: 500;

    transform:
        rotateY(-180deg);

    transition:
        transform var(--flip-duration)
        cubic-bezier(.22,.61,.36,1);
}

.page-leaf.flipping-previous {
    visibility: visible;

    z-index: 500;

    transform:
        rotateY(180deg);

    transition:
        transform var(--flip-duration)
        cubic-bezier(.22,.61,.36,1);
}

/* =========================================================
   NAVIGATION
========================================================= */

.controls {
    margin-top: 22px;

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 7px;

    padding: 8px 24px;

    background: rgba(30,26,23,.96);

    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);

    border-radius: 30px;

    box-shadow:
        0 8px 25px rgba(0,0,0,.30);

    z-index: 1000;
}

.controls button {
    border: 0;

    background: transparent;

    color: #f5f0eb;

    font-family: Arial, sans-serif;

    font-weight: 500;

    font-size: .95rem;

    padding: 9px 13px;

    border-radius: 20px;

    cursor: pointer;

    transition:
        background .2s ease,
        color .2s ease;
}

.controls button:hover:not(:disabled) {
    background: rgba(255,255,255,.10);

    color: #fff;
}

.controls button:disabled {
    opacity: .35;

    cursor: default;
}

.spread-counter {
    min-width: 105px;

    text-align: center;

    color: #d8bb7d;

    font-family: Arial, sans-serif;

    font-size: .85rem;

    font-weight: 500;
}

/* =========================================================
   CLOSED
========================================================= */

body.closed .book-spread,
body.closed .spine,
body.closed .page-leaf {
    visibility: hidden;
}

body.closed .controls {
    visibility: hidden;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width:700px) {

    :root {
        --book-width: 94vw;
        --book-height: calc(94vw * .6);
    }

    .book-app {
        padding: 20px 10px;
    }

    .page-content {
        padding: 20px;
    }

    .polaroid {
        width: 48%;
    }

    .tribute {
        font-size: .88rem;
    }

    .video-card {
        min-height: 80px;
    }

    .controls {
        padding: 6px 10px;
    }

    .controls button {
        font-size: .75rem;
        padding: 8px;
    }

    .spread-counter {
        min-width: 75px;
        font-size: .7rem;
    }
}
</style>
</head>
